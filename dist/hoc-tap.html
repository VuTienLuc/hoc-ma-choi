    if(w.neck === 'huy-chuong') s += `<path class="acc-red acc-st" d="M${P(-.3,.38)} L${P(0,.72)} L${P(.3,.38)} L${P(.16,.38)} L${P(0,.58)} L${P(-.16,.38)} Z"/><circle class="acc-gold acc-st" cx="${cx}" cy="${cy+r*.82}" r="${r*.17}"/><path class="acc-gold-dark" d="M${cx} ${cy+r*.72} l${r*.03} ${r*.07} ${r*.07} 0 -${r*.055} ${r*.045} ${r*.02} ${r*.075} -${r*.065} -${r*.045} -${r*.065} ${r*.045} ${r*.02} -${r*.075} -${r*.055} -${r*.045} ${r*.07} 0 Z"/>`;
    if(w.eye === 'kinh-tron') s += `<circle class="acc-glass acc-st" cx="${cx-ex}" cy="${ey}" r="${r*.22}"/><circle class="acc-glass acc-st" cx="${cx+ex}" cy="${ey}" r="${r*.22}"/><path class="acc-line" d="M${cx-ex+r*.22} ${ey} Q ${cx} ${ey-r*.1} ${cx+ex-r*.22} ${ey}"/>`;
    if(w.eye === 'kinh-ram') s += `<rect class="acc-dark acc-st" x="${cx-ex-r*.25}" y="${ey-r*.16}" width="${r*.5}" height="${r*.32}" rx="${r*.12}"/><rect class="acc-dark acc-st" x="${cx+ex-r*.25}" y="${ey-r*.16}" width="${r*.5}" height="${r*.32}" rx="${r*.12}"/><path class="acc-line" d="M${cx-ex+r*.25} ${ey-r*.04} L${cx+ex-r*.25} ${ey-r*.04}"/><path class="acc-shine" d="M${cx-ex-r*.14} ${ey-r*.06} l${r*.1} -${r*.06} M${cx+ex-r*.14} ${ey-r*.06} l${r*.1} -${r*.06}"/>`;
    if(w.eye === 'kinh-tim'){ const H = x => `<path class="acc-pink acc-st" d="M${x} ${ey+r*.2} C ${x-r*.34} ${ey-r*.02} ${x-r*.2} ${ey-r*.3} ${x} ${ey-r*.12} C ${x+r*.2} ${ey-r*.3} ${x+r*.34} ${ey-r*.02} ${x} ${ey+r*.2} Z"/>`;
      s += H(cx-ex) + H(cx+ex) + `<path class="acc-line" d="M${cx-ex+r*.2} ${ey-r*.08} L${cx+ex-r*.2} ${ey-r*.08}"/>`; }
    if(w.hat === 'mu-tiec') s += `<path class="acc-purple acc-st" d="M${cx-r*.34} ${top+r*.14} L${cx} ${top-r*.72} L${cx+r*.34} ${top+r*.14} Z"/><path class="acc-yellow" d="M${cx-r*.2} ${top-r*.2} L${cx+r*.2} ${top-r*.2} L${cx+r*.26} ${top-r*.06} L${cx-r*.26} ${top-r*.06} Z"/><circle class="acc-pink acc-st" cx="${cx}" cy="${top-r*.76}" r="${r*.12}"/>`;
    if(w.hat === 'mu-len') s += `<path class="acc-red acc-st" d="M${cx-r*.78} ${top+r*.36} C ${cx-r*.8} ${top-r*.42} ${cx+r*.8} ${top-r*.42} ${cx+r*.78} ${top+r*.36} Z"/><rect class="acc-white acc-st" x="${cx-r*.84}" y="${top+r*.22}" width="${r*1.68}" height="${r*.22}" rx="${r*.1}"/><circle class="acc-white acc-st" cx="${cx}" cy="${top-r*.3}" r="${r*.14}"/>`;
    if(w.hat === 'no-hoa'){ const fx = cx + r*.5, fy = top + r*.2, pr = r*.12;
      s += [0,72,144,216,288].map(a => `<circle class="acc-pink acc-st" cx="${fx + Math.cos(a*Math.PI/180)*pr*1.3}" cy="${fy + Math.sin(a*Math.PI/180)*pr*1.3}" r="${pr}"/>`).join('') + `<circle class="acc-yellow acc-st" cx="${fx}" cy="${fy}" r="${pr*.9}"/>`; }
    if(w.hat === 'mu-tn') s += `<rect class="acc-dark acc-st" x="${cx-r*.36}" y="${top-r*.06}" width="${r*.72}" height="${r*.26}" rx="${r*.05}"/><path class="acc-dark acc-st" d="M${cx} ${top-r*.42} L${cx+r*.78} ${top-r*.18} L${cx} ${top+r*.06} L${cx-r*.78} ${top-r*.18} Z"/><path class="acc-gold-line" d="M${cx} ${top-r*.18} L${cx+r*.56} ${top-r*.06} L${cx+r*.56} ${top+r*.3}"/><circle class="acc-gold" cx="${cx+r*.56}" cy="${top+r*.34}" r="${r*.07}"/>`;
    return s;
  }
  function look(){ const s = st(), m = Math.min(s.no, s.vui); return {wear:s.wear, mood: m >= 55 ? 'vui' : m >= 25 ? 'binh' : 'buon'}; }
  const moodText = () => { const s = st();
    if(s.no < 25) return 'Bé đói bụng lắm rồi… Em làm bài để có hạt cho bé ăn nhé! 🥺';
    if(s.vui < 25) return 'Bé buồn vì nhớ em. Chơi với bé một chút nhé!';
    if(s.no < 55) return 'Bé hơi đói rồi đấy.';
    if(s.vui < 55) return 'Bé muốn được chơi cùng em.';
    return 'Bé đang rất vui và no nê! 💖'; };

  /* ---------- Hành động ---------- */
  function feed(){ const s = st(); if(s.food < 1) return 'Hết hạt rồi! Em làm bài để có thêm hạt nhé (mỗi ⭐ = 1 hạt).';
    if(s.no >= 100) return 'Bé no căng bụng rồi, lát nữa cho ăn tiếp nhé!';
    s.food--; s.no = clamp(s.no + 25); s.vui = clamp(s.vui + 5); s.st.fed++; quest('an'); checkBadges(); save(true); return 'Măm măm… Ngon quá! 😋'; }
  function playWith(){ const s = st(), wait = 20*60*1000 - (Date.now() - s.lastPlay);
    if(s.no < 20) return 'Bé đói quá, không chơi nổi. Cho bé ăn trước nhé!';
    if(wait > 0) return `Bé đang nghỉ mệt. ${Math.ceil(wait/60000)} phút nữa lại chơi tiếp nhé!`;
    s.lastPlay = Date.now(); s.vui = clamp(s.vui + 25); s.no = clamp(s.no - 5); s.st.played++; quest('choi'); checkBadges(); save(true); return 'Vui quá! Bé nhảy tưng tưng! 🎉'; }
  function buy(id){ const s = st(), it = ITEMS.find(i => i.id === id); if(!it || s.owned.includes(id)) return '';
    if(s.xu < it.price) return `Em cần thêm ${it.price - s.xu} 🪙 nữa. Làm thêm bài nhé!`;
    s.xu -= it.price; s.owned.push(id); s.wear[it.slot] = id; s.st.bought++; checkBadges(); save(true); return `Đã mua ${it.name}! 🎁`; }
  function wear(id){ const s = st(), it = ITEMS.find(i => i.id === id); if(!it || !s.owned.includes(id)) return;
    if(s.wear[it.slot] === id) delete s.wear[it.slot]; else s.wear[it.slot] = id; save(true); }

  /* ---------- Sự kiện từ engine / account ---------- */
  function on(ev, a){
    const s = st();
    if(ev === 'answer'){
      if(a.ok){ const c = a.tries === 0 ? 2 : 1; s.xu += c; s.xuTotal += c; s.st.correct++;
        s.st.run = a.tries === 0 ? s.st.run + 1 : 0; s.st.bestRun = Math.max(s.st.bestRun, s.st.run);
        quest('dung10'); quest('dung20'); quest('lien5', 0, s.st.run);
        if(a.el){ const b = document.createElement('span'); b.className = 'coin-pop'; b.textContent = `+${c} 🪙`; a.el.appendChild(b); setTimeout(() => b.remove(), 1400); }
      } else if(a.tries === 1) s.st.run = 0;
      checkBadges(); save(false); updateMini();
    }
    if(ev === 'done'){
      const {g, l, lv, st: stars, pts} = a, food = pts > 0 ? Math.max(1, stars) : 0, bonus = stars === 3 ? 5 : 0;
      s.food += food; s.xu += bonus; s.xuTotal += bonus; s.st.sets++; if(stars === 3) s.st.three++;
      const d = today();
      if(s.last !== d){ s.streak = dayNum(d) - dayNum(s.last) === 1 ? s.streak + 1 : 1; s.last = d; s.best = Math.max(s.best, s.streak);
        if(s.streak > 1) note(`🔥 Chuỗi ${s.streak} ngày học liên tiếp! Giỏi quá!`); }
      if(food) note(`🍖 +${food} hạt cho thú cưng${bonus ? ` · +${bonus} 🪙 thưởng 3 sao` : ''}`);
      quest('bo1'); quest('bo3'); if(stars === 3) quest('sao3'); if(lv >= 2) quest('muc2');
      const lk = `${g.id}:${l.id}`; if(!s.seen[lk]){ s.seen[lk] = 1; quest('moi'); }
      checkBadges(); save(false); updateMini();
    }
    if(ev === 'home') decorateHome(a);
    if(ev === 'lesson') updateMini();
  }

  /* ---------- Giao diện ---------- */
  const meter = (ic, lab, v) => `<div class="meter ${v < 25 ? 'low' : v < 55 ? 'mid' : ''}"><span>${ic} ${lab}</span><div class="bar"><i style="width:${v}%"></i></div><b>${v}</b></div>`;
  const chips = () => { const s = st(); return `<div class="pchips"><span title="Chuỗi ngày học liên tiếp">🔥 <b>${s.streak}</b> ngày</span><span title="Xu">🪙 <b>${s.xu}</b></span><span title="Hạt thức ăn">🍖 <b>${s.food}</b></span><span title="Huy hiệu">🏅 <b>${Object.keys(s.badges).length}</b></span></div>`; };
  function questRows(){ const s = st(); return s.q.list.map(it => { const Qd = QUESTS[it.id];
    return `<li class="${it.done?'done':''}"><span class="qi">${it.done?'✅':'🎯'}</span><div><b>${Qd.text}</b><div class="bar"><i style="width:${Math.round(it.p/Qd.n*100)}%"></i></div></div><small>${it.p}/${Qd.n}<br>+${Qd.xu} 🪙</small></li>`; }).join(''); }
  function decorateHome(g){
    const info = $('.pet-card .pet-info'); if(!info) return; const s = st();
    info.insertAdjacentHTML('afterbegin', chips());
    info.insertAdjacentHTML('beforeend', `<div class="meters">${meter('🍖','No',s.no)}${meter('💖','Vui',s.vui)}</div><p class="mood">${moodText()}</p>
      <div class="row"><button class="btn primary" data-ph="care">🏠 Nhà thú cưng</button><button class="btn" data-ph="shop">🛍️ Cửa hàng</button>${Account.user?'<button class="btn" data-ph="rank">🏆 Xếp hạng lớp</button>':''}</div>`);
    const card = $('.pet-card'); if(card) card.insertAdjacentHTML('afterend', `<section class="quests card"><h3>🎯 Nhiệm vụ hôm nay</h3><ul>${questRows()}</ul><button class="linkbtn" data-ph="badge">Xem huy hiệu (${Object.keys(s.badges).length}/${BADGES.length}) →</button></section>`);
    $$('[data-ph]').forEach(b => b.onclick = () => open(g, b.dataset.ph));
  }
  function updateMini(){ const m = $('.pet-mini'); if(!m) return; let c = m.querySelector('.mini-xu');
    if(!c){ m.insertAdjacentHTML('beforeend', '<b class="mini-xu"></b>'); c = m.querySelector('.mini-xu'); } c.textContent = `🪙 ${st().xu}`; }

  let G = null, TAB = 'care', rankSort = 'stars', rankData = null;
  function open(g, tab){
    G = g; TAB = tab || 'care'; const old = $('#petHome'); if(old) old.remove();
    const el = document.createElement('div'); el.id = 'petHome'; el.className = 'evolve pethome'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true');
    el.innerHTML = `<div class="ph card"><button class="ph-x" data-close aria-label="Đóng">✕</button><div class="ph-top" id="phTop"></div>
      <div class="ph-tabs" role="tablist">${[['care','🏠 Chăm sóc'],['shop','🛍️ Cửa hàng'],['quest','🎯 Nhiệm vụ'],['badge','🏅 Huy hiệu'],['rank','🏆 Xếp hạng']].map(([k,t]) => `<button role="tab" data-tab="${k}">${t}</button>`).join('')}</div>
      <div class="ph-body" id="phBody"></div></div>`;
    document.body.appendChild(el); document.body.classList.add('noscroll');
    const close = () => { el.remove(); document.body.classList.remove('noscroll'); if(location.hash === `#/${g.id}`) try{ renderHome() }catch(e){} };
    el.querySelector('[data-close]').onclick = close; el.addEventListener('click', e => { if(e.target === el) close(); });
    el.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { TAB = b.dataset.tab; draw(); });
    draw();
  }
  function drawTop(msg){ const g = G, k = Pet.stage(g);
    $('#phTop').innerHTML = `<div class="ph-pet" id="phPet">${Pet.svg(g, k, 'big')}</div><div><small>Thú cưng ${esc(g.name)} · Cấp ${k+1}/5</small><h2>${Pet.name(g,k)}</h2>${chips()}<p class="mood" id="phMsg">${msg || moodText()}</p></div>`; }
  function jump(){ const p = $('#phPet'); if(p){ p.classList.remove('boing'); void p.offsetWidth; p.classList.add('boing'); } }
  function draw(msg){
    drawTop(msg); $$('#petHome [data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === TAB));
    const s = st(), body = $('#phBody');
    if(TAB === 'care'){
      body.innerHTML = `<div class="meters">${meter('🍖','No bụng',s.no)}${meter('💖','Vui vẻ',s.vui)}</div>
        <div class="row care-btns"><button class="btn primary big" data-act="feed">🍖 Cho ăn <small>(còn ${s.food} hạt)</small></button><button class="btn big" data-act="play">🎾 Chơi cùng bé</button></div>
        <ul class="tips"><li>Làm đúng ngay lần đầu: <b>+2 🪙</b>; đúng lần hai: <b>+1 🪙</b>.</li><li>Xong một bộ: mỗi ⭐ được <b>1 hạt 🍖</b>; đạt ⭐⭐⭐ thưởng thêm <b>5 🪙</b>.</li>
        <li>Mỗi ngày không học, bé sẽ đói và buồn dần – nhưng bé luôn chờ em quay lại. 💖</li><li>Học mỗi ngày để giữ chuỗi 🔥 (dài nhất của em: <b>${s.best}</b> ngày).</li></ul>`;
      body.querySelector('[data-act="feed"]').onclick = () => { const m = feed(); draw(m); if(/Măm/.test(m)) jump(); };
      body.querySelector('[data-act="play"]').onclick = () => { const m = playWith(); draw(m); if(/Vui quá/.test(m)) jump(); };
    }
    if(TAB === 'shop'){
      const k = Math.max(2, Pet.stage(G));
      body.innerHTML = `<p class="note-line">Em đang có <b>${s.xu} 🪙</b>. Chạm vào món đã mua để đeo/tháo.${Pet.stage(G) < 2 ? ' <i>(Trứng nở rồi mới đeo được mũ, kính, nơ; nền phòng thì dùng được ngay.)</i>' : ''}</p>` +
        Object.entries(SLOT).map(([slot, t]) => `<h3>${t}</h3><div class="shop">${ITEMS.filter(i => i.slot === slot).map(i => { const own = s.owned.includes(i.id), on = s.wear[slot] === i.id;
          return `<button class="item ${on?'on':''} ${own?'own':''}" data-item="${i.id}">${Pet.svg(G, k, '', {wear:{[slot]:i.id}, mood:'vui'})}<b>${i.name}</b><span>${on ? '✔ Đang dùng' : own ? 'Dùng' : `${i.price} 🪙`}</span></button>`; }).join('')}</div>`).join('');
      body.querySelectorAll('[data-item]').forEach(b => b.onclick = () => { const id = b.dataset.item;
        if(s.owned.includes(id)){ wear(id); draw(); } else draw(buy(id)); });
    }
    if(TAB === 'quest'){
      body.innerHTML = `<h3>Nhiệm vụ hôm nay</h3><ul class="qlist">${questRows()}</ul><p class="note-line">Mỗi ngày có 3 nhiệm vụ mới. Em đã hoàn thành <b>${s.qDone}</b> nhiệm vụ.</p>
        <h3>Thành tích của em</h3><div class="stats"><span>✅ <b>${s.st.correct}</b> câu đúng</span><span>📚 <b>${s.st.sets}</b> bộ</span><span>⭐⭐⭐ <b>${s.st.three}</b> bộ</span><span>⚡ Đúng liền nhiều nhất <b>${s.st.bestRun}</b></span><span>🔥 Chuỗi dài nhất <b>${s.best}</b> ngày</span><span>🪙 Đã kiếm <b>${s.xuTotal}</b> xu</span></div>`;
    }
    if(TAB === 'badge'){
      body.innerHTML = `<p class="note-line">Mỗi huy hiệu mới thưởng <b>10 🪙</b>. Em có <b>${Object.keys(s.badges).length}/${BADGES.length}</b>.</p><div class="badges">${BADGES.map(([id, ic, nm, desc]) => {
        const got = s.badges[id]; return `<div class="badge ${got?'got':''}"><span class="bi">${ic}</span><b>${nm}</b><small>${desc}${got?`<br>✔ ${got.split('-').reverse().join('/')}`:''}</small></div>`; }).join('')}</div>`;
    }
    if(TAB === 'rank') drawRank(body);
  }
  async function drawRank(body){
    if(!Account.user){ body.innerHTML = '<p class="note-line">Bảng xếp hạng lớp chỉ có khi em <b>đăng nhập</b> bằng tài khoản thầy cô phát.</p>'; return; }
    const head = () => `<div class="row rank-sort">${[['stars','⭐ Tổng sao'],['streak','🔥 Chuỗi ngày'],['badges','🏅 Huy hiệu'],['xu','🪙 Xu đã kiếm']].map(([k,t]) => `<button class="btn small ${rankSort===k?'primary':''}" data-rs="${k}">${t}</button>`).join('')}</div>`;
    const render = () => { const rows = rankData.slice().sort((a,b) => (b[rankSort]-a[rankSort]) || (b.stars-a.stars) || a.name.localeCompare(b.name,'vi'));
      body.innerHTML = head() + `<p class="note-line">Lớp <b>${esc(Account.user.lop)}</b> · ${rows.length} bạn đã tham gia. Cố lên nhé! 💪</p><ol class="rank">${rows.map((r, i) => {
        const k = Math.min(4, Math.max(0, r.pets && r.pets[G.id] != null ? r.pets[G.id] : 0));
        return `<li class="${r.me?'me':''}"><span class="rk">${i<3?['🥇','🥈','🥉'][i]:i+1}</span><span class="rp">${Pet.svg(G, k, '', {wear:r.wear||{}, mood:'vui'})}</span><b>${esc(r.name)}${r.me?' (em)':''}</b><span class="rv">${{stars:'⭐',streak:'🔥',badges:'🏅',xu:'🪙'}[rankSort]} ${r[rankSort]}</span></li>`; }).join('')}</ol>`;
      body.querySelectorAll('[data-rs]').forEach(b => b.onclick = () => { rankSort = b.dataset.rs; render(); }); };
    if(rankData){ render(); }
    else body.innerHTML = '<p class="note-line">Đang tải bảng xếp hạng…</p>';
    try{ const r = await Account.rank(); if(!r.ok) throw new Error(r.msg); rankData = r.rows; if(TAB === 'rank') render(); setTimeout(() => rankData = null, 60000); }
    catch(e){ if(!rankData) body.innerHTML = '<p class="note-line">Chưa tải được bảng xếp hạng. Em kiểm tra mạng rồi thử lại nhé. (Nếu vẫn lỗi: thầy cô cần cập nhật lại Apps Script.)</p>'; }
  }

  addEventListener('hashchange', () => { const m = $('#petHome'); if(m){ m.remove(); document.body.classList.remove('noscroll'); } });
  return { on, look, bgSVG, accSVG, snapshot, adopt, open, get state(){ return st(); }, reset(){ S = null; }, ITEMS, BADGES, QUESTS, feed, playWith, buy, wear };
})();

</script>
<script>/* assets/js/present.js */
/* =====================================================================
   PRESENT – Trình chiếu câu hỏi lên máy chiếu (toàn màn hình).
   Mỗi lần một câu: đề sát mép trên và hai mép, chữ tự phóng to/thu nhỏ vừa màn hình,
   hình bên trái – phương án bên phải. Giáo viên bấm Gợi ý / Đáp án khi cần.
   Phím: ← → (hoặc Space) chuyển câu · G gợi ý · Đ/Enter đáp án · T nền tối · Esc thoát.
   Nạp SAU engine.js? Không cần: engine gọi Present.on('lesson', g, l) qua hook().
   ===================================================================== */
const Present = (() => {
  let el = null, i = 0, dark = false, shown = {}, ro = null, fitting = false;
  const LET = 'ABCDEFGH';
  const fmtAns = v => String(v).replace('.', ',');
  const ansOf = sp => sp && sp.frac ? sp.frac : Array.isArray(sp) ? ansOf(sp[0]) : sp;

  function on(ev){
    if(ev !== 'lesson') return;
    const r = $('#resetSet'); if(!r || $('#presentBtn')) return;
    r.insertAdjacentHTML('afterend', `<button class="btn" id="presentBtn" title="Trình chiếu lên máy chiếu">📽️ Trình chiếu</button>`);
    $('#presentBtn').onclick = () => open(0);
  }

  function open(start){
    if(!S.qs.length) return;
    i = start || 0; shown = {};
    el = document.createElement('div'); el.id = 'present'; el.className = 'pv' + (dark ? ' dark' : '');
    el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', 'Trình chiếu câu hỏi');
    el.innerHTML = `<div class="pv-slide" id="pvSlide"></div>
      <div class="pv-bar"><button data-k="prev" aria-label="Câu trước">‹</button><span id="pvPos"></span><button data-k="next" aria-label="Câu sau">›</button>
      <span class="pv-sp"></span><button data-k="hint">💡 Gợi ý</button><button data-k="ans">✅ Đáp án</button><button data-k="new">↻ Bộ mới</button>
      <button data-k="dark" aria-label="Đổi nền sáng/tối">🌓</button><button data-k="close" aria-label="Thoát trình chiếu">✕</button></div>`;
    document.body.appendChild(el); document.body.classList.add('noscroll');
    el.querySelectorAll('[data-k]').forEach(b => b.onclick = e => { e.stopPropagation(); act(b.dataset.k); });
    const fs = el.requestFullscreen || el.webkitRequestFullscreen;
    if(fs) try{ const p = fs.call(el); if(p && p.catch) p.catch(() => {}); }catch(e){}
    addEventListener('keydown', key); addEventListener('resize', fit);
    if(document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', fit);   // phông công thức tải xong → co giãn lại
    document.addEventListener('fullscreenchange', fsChange); document.addEventListener('webkitfullscreenchange', fsChange);
    draw();
  }
  function close(){
    if(!el) return;
    removeEventListener('keydown', key); removeEventListener('resize', fit);
    if(document.fonts && document.fonts.removeEventListener) document.fonts.removeEventListener('loadingdone', fit);
    document.removeEventListener('fullscreenchange', fsChange); document.removeEventListener('webkitfullscreenchange', fsChange);
    const fe = document.fullscreenElement || document.webkitFullscreenElement;
    if(fe){ const x = document.exitFullscreen || document.webkitExitFullscreen; try{ const p = x.call(document); if(p && p.catch) p.catch(() => {}); }catch(e){} }
    if(ro){ ro.disconnect(); ro = null; }
    el.remove(); el = null; document.body.classList.remove('noscroll');
  }
  function fsChange(){ if(el && !(document.fullscreenElement || document.webkitFullscreenElement)) close(); }
  function key(e){
    if(!el) return; const k = e.key;
    if(k === 'ArrowRight' || k === ' ' || k === 'PageDown'){ e.preventDefault(); act('next'); }
    else if(k === 'ArrowLeft' || k === 'PageUp'){ e.preventDefault(); act('prev'); }
    else if(k === 'Escape') close();
    else if(/^[gGhH]$/.test(k)) act('hint');
    else if(k === 'Enter' || /^[dDđĐ]$/.test(k)) act('ans');
    else if(/^[tT]$/.test(k)) act('dark');
    else if(/^[a-dA-D]$/.test(k)){ const b = el.querySelector(`[data-o="${'abcd'.indexOf(k.toLowerCase())}"]`); if(b) b.click(); }
  }
  function act(k){
    const n = S.qs.length;
    if(k === 'next' && i < n-1){ i++; draw(); }
    if(k === 'prev' && i > 0){ i--; draw(); }
    if(k === 'hint'){ shown[i] = shown[i] === 'hint' ? '' : 'hint'; draw(); }
    if(k === 'ans'){ shown[i] = shown[i] === 'ans' ? '' : 'ans'; draw(); }
    if(k === 'new'){ genSet(); try{ renderQs(); }catch(e){} i = 0; shown = {}; draw(); }
    if(k === 'dark'){ dark = !dark; el.classList.toggle('dark', dark); }
    if(k === 'close') close();
  }

  /* ---------- Dựng một trang chiếu ---------- */
  function body(q, reveal){
    if(q.kind === 'choice'){
      const long = q.opts.some(o => o.replace(/<[^>]+>|\\[a-z]+|[{}\\()]/gi, '').length > 26);
      const tall = q.opts.some(o => /cases/.test(o));   // phương án là hệ: xếp 2 cột cho đỡ cao
      return `<div class="pv-opts ${!tall && (long || q.fig) ? 'one' : ''}">${q.opts.map((o, k) => `<button class="pv-o ${reveal && k === q.correct ? 'right' : ''}" data-o="${k}"><b>${LET[k]}</b><span>${o}</span></button>`).join('')}</div>`;
    }
    if(q.kind === 'blanks'){
      let bi = 0;
      const box = () => { const sp = ansOf(q.ans[bi++]); return `<span class="pv-b">${reveal ? fmtAns(sp) : '&nbsp;'}</span>`; };
      const html = q.tpl.split(/(\[_\]|\[F\])/).map(p => {
        if(p === '[_]') return box();
        if(p === '[F]'){ const f = ansOf(q.ans[bi++]); return `<span class="fr pv-f"><span class="pv-b">${reveal ? f[0] : '&nbsp;'}</span><span class="pv-b">${reveal ? f[1] : '&nbsp;'}</span></span>`; }
        return p; }).join('');
      return `<div class="pv-ans">${html}</div>`;
    }
    return '';
  }
  function draw(){
    if(!el) return;
    const q = S.qs[i], n = S.qs.length, mode = shown[i] || '';
    $('#pvPos').textContent = `Câu ${i+1}/${n}`;
    el.querySelector('[data-k="prev"]').disabled = i === 0; el.querySelector('[data-k="next"]').disabled = i === n-1;
    el.querySelector('[data-k="hint"]').classList.toggle('on', mode === 'hint'); el.querySelector('[data-k="ans"]').classList.toggle('on', mode === 'ans');
    const fig = q.fig || (q.kind === 'rotate' ? protractorSVG(q.val) : q.kind === 'shade' ? fracSVG(q.n, 0, q.shape, false) : '');
    const extra = mode === 'hint' ? `<div class="pv-note hint"><b>💡 Gợi ý:</b> ${q.hint}</div>` : mode === 'ans' ? `<div class="pv-note sol"><b>✅ Lời giải:</b> ${q.sol}</div>` : '';
    const slide = $('#pvSlide');
    slide.className = 'pv-slide' + (fig ? ' has-fig' : '');
    slide.innerHTML = `<div class="pv-q"><span class="pv-n">Câu ${i+1}.</span> ${q.text}${q.expr ? `<div class="pv-expr">${q.expr}</div>` : ''}</div>
      <div class="pv-main">${fig ? `<div class="pv-fig">${fig}</div>` : ''}<div class="pv-side">${body(q, mode === 'ans')}${extra}</div></div>`;
    slide.querySelectorAll('[data-o]').forEach(b => b.onclick = () => {
      const k = +b.dataset.o, ok = k === q.correct; b.classList.remove('right', 'wrong'); void b.offsetWidth; b.classList.add(ok ? 'right' : 'wrong');
      if(typeof Sound !== 'undefined') Sound.play(ok ? 'ok' : 'bad'); });
    const done = () => requestAnimationFrame(fit);
    if(window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([slide]).then(done, done); else done();
    fit(); setTimeout(fit, 450); setTimeout(fit, 1200);
    if(window.ResizeObserver){ if(ro) ro.disconnect(); let raf = 0; ro = new ResizeObserver(() => { if(fitting) return; cancelAnimationFrame(raf); raf = requestAnimationFrame(fit); });
      slide.querySelectorAll('.pv-q,.pv-side,.pv-fig').forEach(x => ro.observe(x)); }
  }
  /* Chữ to nhất có thể mà vẫn vừa khung (không cuộn). */
  function fit(){
    const s = $('#pvSlide'); if(!s) return;
    fitting = true; try{ fit_(s); } finally { requestAnimationFrame(() => fitting = false); }
  }
  function fit_(s){
    const W = innerWidth, H = s.clientHeight;
    let hi = Math.min(W / 12, 110), lo = 16;
    const fits = f => { s.style.setProperty('--fs', f + 'px'); return s.scrollHeight <= H + 1 && [s, ...s.querySelectorAll('.pv-q,.pv-side,.pv-note,.pv-ans')].every(x => x.scrollWidth <= x.clientWidth + 1); };
    if(fits(hi)) return;
    for(let k = 0; k < 14; k++){ const m = (hi + lo) / 2; if(fits(m)) lo = m; else hi = m; }
    s.style.setProperty('--fs', Math.floor(lo) + 'px');
  }
  return { on, open, close };
})();

lesson(5,'tinh-chat-cong','Tính chất giao hoán và kết hợp của phép cộng','Vận dụng tính chất để tính thuận tiện.',[()=>{const a=R(100,999),b=R(100,999);return QB({text:'Điền số thích hợp:',tpl:`<span class="eq">${a} + ${b} = ${b} + [_]</span>`,ans:[a],hint:'Khi đổi chỗ các số hạng trong một tổng thì tổng không thay đổi.',sol:`${a} + ${b} = ${b} + <b>${a}</b>.`})},
 ()=>{const a=R(1,9)*100+R(1,99),c=Math.ceil(a/100)*100+R(1,5)*100-a,b=R(100,899);return QB({text:'Tính bằng cách thuận tiện:',tpl:`<span class="eq">${a} + ${b} + ${c} = [_]</span>`,ans:[a+b+c],wide:true,hint:`Nhóm ${a} với ${c} được số tròn trăm.`,sol:`(${a} + ${c}) + ${b} = ${a+c} + ${b} = <b>${fmt(a+b+c)}</b>.`})},
 ()=>{const a=R(1000,9000),b=R(100,900),c=R(100,900);return QB({text:'Điền số thích hợp:',tpl:`<span class="eq">(${a} + ${b}) + ${c} = ${a} + ([_] + ${c})</span>`,ans:[b],hint:'Tính chất kết hợp: (a + b) + c = a + (b + c).',sol:`Số cần điền là <b>${b}</b>.`})}]);
lesson(5,'tong-hieu','Tìm hai số biết tổng và hiệu','Tìm số lớn, số bé khi biết tổng và hiệu.',[lv=>{const s=R(10,lv*200),h=R(2,Math.max(4,s))*2;const big=s+h,S=big+s;return QB({text:`Tổng hai số là <b>${S}</b>, hiệu hai số là <b>${h}</b>. Tìm hai số đó.`,tpl:'Số lớn: [_] &nbsp; Số bé: [_]',ans:[big,s],hint:'Số lớn = (Tổng + Hiệu) : 2; Số bé = (Tổng − Hiệu) : 2.',sol:`Số lớn = (${S} + ${h}) : 2 = <b>${big}</b>; số bé = ${S} − ${big} = <b>${s}</b>.`})},
 ()=>{const c=R(6,12),h=R(24,32),d=c+h;return QB({text:`Tổng số tuổi của bố và con là <b>${c+d}</b> tuổi. Bố hơn con <b>${h}</b> tuổi. Hỏi con bao nhiêu tuổi?`,tpl:'[_] tuổi',ans:[c],hint:'Tuổi con là số bé: (Tổng − Hiệu) : 2.',sol:`Tuổi con: (${c+d} − ${h}) : 2 = <b>${c} tuổi</b>.`})},
 ()=>{const b=R(80,200),h=R(10,60),a=b+h;return QB({text:`Hai lớp 4A và 4B trồng được <b>${a+b}</b> cây. Lớp 4A trồng nhiều hơn lớp 4B <b>${h}</b> cây. Mỗi lớp trồng được bao nhiêu cây?`,tpl:'4A: [_] cây &nbsp; 4B: [_] cây',ans:[a,b],hint:'Lớp 4A là số lớn, lớp 4B là số bé.',sol:`4A: (${a+b} + ${h}) : 2 = <b>${a}</b> cây; 4B: ${a+b} − ${a} = <b>${b}</b> cây.`})}]);

/* CĐ6 */
lesson(6,'vuong-song-song','Hai đường thẳng vuông góc, song song. Hình bình hành, hình thoi','Nhận biết cặp cạnh vuông góc, song song; nhận dạng hình.',[()=>{const q=pick([['AB','DC'],['AD','BC'],['BC','AD'],['DC','AB']]);return QC({text:`Trong hình chữ nhật ABCD, cạnh nào <b>song song</b> với cạnh ${q[0]}?`,fig:rectSVG(),opts:[q[1],...['AB','BC','DC','AD'].filter(x=>x!==q[0]&&x!==q[1])],ans:q[1],hint:'Hai cạnh đối diện của hình chữ nhật song song với nhau.',sol:`Cạnh <b>${q[1]}</b> song song với cạnh ${q[0]}.`})},
 ()=>{const q=pick([['AB','AD và BC'],['DC','AD và BC'],['AD','AB và DC'],['BC','AB và DC']]);return QC({text:`Trong hình chữ nhật ABCD, cạnh ${q[0]} <b>vuông góc</b> với những cạnh nào?`,fig:rectSVG(),opts:['AD và BC','AB và DC',q[0]==='AB'||q[0]==='DC'?'AD và DC':'AB và BC'],ans:q[1],hint:'Hai cạnh chung một đỉnh của hình chữ nhật thì vuông góc với nhau.',sol:`Cạnh ${q[0]} vuông góc với <b>${q[1]}</b>.`})},
 ()=>{const k=pick(['Hình bình hành','Hình thoi','Hình chữ nhật','Hình vuông']);return QC({text:'Hình bên là hình gì?',fig:shapeSVG(k),opts:['Hình bình hành','Hình thoi','Hình chữ nhật','Hình vuông'],ans:k,keepOrder:true,hint:'Hình bình hành: hai cặp cạnh đối song song và bằng nhau. Hình thoi: thêm bốn cạnh bằng nhau. Hình chữ nhật có 4 góc vuông.',sol:`Đó là <b>${k.toLowerCase()}</b>.`})}]);

lesson(8,'nhan-chia-1','Nhân, chia với số có một chữ số','Nhân, chia số có nhiều chữ số với số có một chữ số.',[lv=>{const a=randDigits(lv+3),b=R(2,9);return QB({text:'Tính:',tpl:`<span class="eq">${fmt(a)} × ${b} = [_]</span>`,ans:[a*b],wide:true,hint:'Nhân từ phải sang trái, nhớ sang hàng bên trái.',sol:`${fmt(a)} × ${b} = <b>${fmt(a*b)}</b>.`})},
 lv=>{const b=R(2,9),q=randDigits(lv+2);return QB({text:'Tính:',tpl:`<span class="eq">${fmt(q*b)} : ${b} = [_]</span>`,ans:[q],wide:true,hint:'Chia từ trái sang phải; mỗi lần chia: chia – nhân – trừ – hạ.',sol:`${fmt(q*b)} : ${b} = <b>${fmt(q)}</b>.`})},
 lv=>{const b=R(3,9),q=randDigits(lv+1),r=R(1,b-1),a=q*b+r;return QB({text:'Thực hiện phép chia có dư:',tpl:`<span class="eq">${fmt(a)} : ${b} = [_] (dư [_])</span>`,ans:[q,r],hint:'Số dư luôn bé hơn số chia.',sol:`${fmt(a)} = ${fmt(q)} × ${b} + ${r} → thương <b>${fmt(q)}</b>, dư <b>${r}</b>.`})}]);
lesson(8,'nhan-10','Nhân, chia với 10, 100, 1 000, …','Nhân, chia nhẩm với 10, 100, 1 000.',[()=>{const k=pick([10,100,1000]),n=R(12,999);return QB({text:'Tính nhẩm:',tpl:`<span class="eq">${n} × ${fmt(k)} = [_]</span>`,ans:[n*k],wide:true,hint:`Nhân với ${fmt(k)}: viết thêm ${String(k).length-1} chữ số 0 vào bên phải.`,sol:`${n} × ${fmt(k)} = <b>${fmt(n*k)}</b>.`})},
 ()=>{const k=pick([10,100,1000]),n=R(12,999);return QB({text:'Tính nhẩm:',tpl:`<span class="eq">${fmt(n*k)} : ${fmt(k)} = [_]</span>`,ans:[n],hint:`Chia cho ${fmt(k)}: bỏ bớt ${String(k).length-1} chữ số 0 ở bên phải.`,sol:`${fmt(n*k)} : ${fmt(k)} = <b>${n}</b>.`})},
 ()=>{const k=pick([10,100,1000]),n=R(12,99);return QB({text:'Điền số thích hợp:',tpl:`<span class="eq">[_] × ${fmt(k)} = ${fmt(n*k)}</span>`,ans:[n],hint:`Lấy ${fmt(n*k)} chia cho ${fmt(k)}.`,sol:`Số cần điền là <b>${n}</b>.`})}]);
lesson(8,'tinh-chat-nhan','Tính chất của phép nhân','Giao hoán, kết hợp, nhân một số với một tổng – tính thuận tiện.',[()=>{const p=pick([[25,4],[5,2],[50,2],[125,8],[20,5]]),m=R(3,19);return QB({text:'Tính bằng cách thuận tiện:',tpl:`<span class="eq">${p[0]} × ${m} × ${p[1]} = [_]</span>`,ans:[p[0]*p[1]*m],wide:true,hint:`Nhóm ${p[0]} × ${p[1]} = ${p[0]*p[1]} trước.`,sol:`${p[0]} × ${p[1]} × ${m} = ${p[0]*p[1]} × ${m} = <b>${fmt(p[0]*p[1]*m)}</b>.`})},
 ()=>{const a=R(12,99),b=R(11,89),c=100-b;return QB({text:'Tính bằng cách thuận tiện:',tpl:`<span class="eq">${a} × ${b} + ${a} × ${c} = [_]</span>`,ans:[a*100],wide:true,hint:'Một số nhân với một tổng: a × b + a × c = a × (b + c).',sol:`${a} × (${b} + ${c}) = ${a} × 100 = <b>${fmt(a*100)}</b>.`})},
 ()=>{const a=R(12,99),k=pick([9,99,11,101]);const v=a*k;const s=k===9?`${a} × 10 − ${a}`:k===99?`${a} × 100 − ${a}`:k===11?`${a} × 10 + ${a}`:`${a} × 100 + ${a}`;return QB({text:'Tính bằng cách thuận tiện:',tpl:`<span class="eq">${a} × ${k} = [_]</span>`,ans:[v],wide:true,hint:`Viết ${k} thành ${k===9?'10 − 1':k===99?'100 − 1':k===11?'10 + 1':'100 + 1'}.`,sol:`${s} = <b>${fmt(v)}</b>.`})}]);
lesson(8,'nhan-chia-2','Nhân, chia với số có hai chữ số','Nhân, chia với số có hai chữ số; bài toán thực tế.',[lv=>{const a=randDigits(lv+1),b=R(11,99);return QB({text:'Tính:',tpl:`<span class="eq">${fmt(a)} × ${b} = [_]</span>`,ans:[a*b],wide:true,hint:`Nhân ${fmt(a)} với ${b%10} và với ${Math.floor(b/10)} chục, rồi cộng hai tích riêng (tích riêng thứ hai lùi sang trái một cột).`,sol:`${fmt(a)} × ${b} = <b>${fmt(a*b)}</b>.`})},
 lv=>{const b=R(12,68),q=lv===1?R(2,9):R(11,lv===2?99:300);return QB({text:'Tính:',tpl:`<span class="eq">${fmt(q*b)} : ${b} = [_]</span>`,ans:[q],hint:`Ước lượng thương: làm tròn ${b} thành ${Math.round(b/10)*10} để nhẩm.`,sol:`${fmt(q*b)} : ${b} = <b>${q}</b> (thử lại: ${q} × ${b} = ${fmt(q*b)}).`})},
 ()=>{const per=R(24,48),k=R(12,35);return QB({text:`Mỗi hộp có <b>${per}</b> cái bút. Hỏi <b>${k}</b> hộp như thế có bao nhiêu cái bút?`,tpl:'[_] cái bút',ans:[per*k],hint:'Lấy số bút mỗi hộp nhân với số hộp.',sol:`${per} × ${k} = <b>${per*k}</b> cái bút.`})}]);
lesson(8,'tbc','Tìm số trung bình cộng','Tính trung bình cộng; bài toán thực tế.',[lv=>{const n=lv===1?2:pick([3,4]),avg=R(20,lv*60+20);let v;do{v=[...Array(n-1)].map(()=>avg+R(-15,15));v.push(avg*n-v.reduce((a,b)=>a+b,0))}while(v[n-1]<=0);
  return QB({text:`Tìm số trung bình cộng của các số: <b>${v.join('; ')}</b>.`,tpl:'[_]',ans:[avg],hint:`Tính tổng các số rồi chia cho ${n} (số các số hạng).`,sol:`(${v.join(' + ')}) : ${n} = ${avg*n} : ${n} = <b>${avg}</b>.`})},
 ()=>{const avg=R(30,60),n=pick([3,4]);let v;do{v=[...Array(n-1)].map(()=>avg+R(-12,12));v.push(avg*n-v.reduce((a,b)=>a+b,0))}while(v[n-1]<=0);const names=shuffle(NAMES).slice(0,n);
  return QB({text:`${joinVa(names)} lần lượt gấp được ${v.join(', ')} ngôi sao. Hỏi trung bình mỗi bạn gấp được bao nhiêu ngôi sao?`,tpl:'[_] ngôi sao',ans:[avg],hint:`Tổng số ngôi sao chia cho ${n} bạn.`,sol:`(${v.join(' + ')}) : ${n} = <b>${avg}</b> ngôi sao.`})},
 ()=>{const avg=R(20,80),y=R(10,2*avg-5);return QB({text:`Trung bình cộng của hai số là <b>${avg}</b>. Một số là <b>${y}</b>. Tìm số kia.`,tpl:'[_]',ans:[2*avg-y],hint:'Tổng hai số = trung bình cộng × 2.',sol:`Tổng: ${avg} × 2 = ${2*avg}. Số kia: ${2*avg} − ${y} = <b>${2*avg-y}</b>.`})}]);

/* CĐ9 */
function chartData(){const labels=['4A','4B','4C','4D'],step=pick([5,10]);let v;do{v=labels.map(()=>R(2,11)*step)}while(new Set(v).size<4);return{labels,v,step}}
lesson(9,'bieu-do','Biểu đồ cột','Đọc và nhận xét số liệu trên biểu đồ cột.',[()=>{const{labels,v,step}=chartData(),i=R(0,3);return QB({text:`Biểu đồ cho biết số cây mỗi lớp đã trồng. Lớp <b>${labels[i]}</b> trồng được bao nhiêu cây?`,fig:barSVG(labels,v,step,'cây'),tpl:'[_] cây',ans:[v[i]],hint:'Dóng từ đỉnh cột sang trục số bên trái.',sol:`Cột ${labels[i]} cao tới vạch <b>${v[i]}</b>.`})},
 ()=>{const{labels,v,step}=chartData(),most=Math.random()<.5,idx=v.indexOf(most?Math.max(...v):Math.min(...v));return QC({text:`Lớp nào trồng được <b>${most?'nhiều':'ít'} cây nhất</b>?`,fig:barSVG(labels,v,step,'cây'),opts:labels,ans:labels[idx],keepOrder:true,hint:`Tìm cột ${most?'cao':'thấp'} nhất.`,sol:`Cột ${labels[idx]} ${most?'cao':'thấp'} nhất (${v[idx]} cây).`})},
 lv=>{const{labels,v,step}=chartData();if(lv<3||Math.random()<.5){const[i,j]=shuffle([0,1,2,3]);const[a,b]=v[i]>v[j]?[i,j]:[j,i];return QB({text:`Lớp ${labels[a]} trồng nhiều hơn lớp ${labels[b]} bao nhiêu cây?`,fig:barSVG(labels,v,step,'cây'),tpl:'[_] cây',ans:[v[a]-v[b]],hint:'Đọc số cây của hai lớp rồi lấy số lớn trừ số bé.',sol:`${v[a]} − ${v[b]} = <b>${v[a]-v[b]} cây</b>.`})}
  const t=v.reduce((a,b)=>a+b,0);return QB({text:'Cả bốn lớp trồng được tất cả bao nhiêu cây?',fig:barSVG(labels,v,step,'cây'),tpl:'[_] cây',ans:[t],hint:'Đọc số cây của từng lớp rồi cộng lại.',sol:`${v.join(' + ')} = <b>${t} cây</b>.`})}]);

/* CĐ10 */
lesson(10,'khai-niem-ps','Khái niệm phân số','Đọc, viết phân số; phân số chỉ phần tô màu; phân số và phép chia.',[lv=>{const n=R(3,lv===1?6:lv===2?8:10),k=R(1,n-1),sh=n<=8&&Math.random()<.5?'circle':'rect';return QB({text:'Viết phân số chỉ phần đã tô màu của hình:',fig:fracSVG(n,k,sh),tpl:'[F]',ans:[{frac:[k,n],mode:'exact'}],hint:'Mẫu số là số phần bằng nhau của hình; tử số là số phần được tô màu.',sol:`Hình chia thành ${n} phần bằng nhau, tô ${k} phần: ${F(k,n)}.`})},
 lv=>{const n=pick(lv===1?[4,5,6]:[6,8,10]);let k=R(1,n-1),dn=n,dk=k;if(lv===3){const g=pick([2,n/2].filter(x=>n%x===0&&x>1)),m=n/g;k=R(1,g-1)*m;dn=g;dk=k/m}
  return {kind:'shade',text:`Chạm vào các phần để tô màu ${F(dk,dn)} hình.`,n,shape:n<=8&&Math.random()<.5?'circle':'rect',num:dk,den:dn,on:[],hint:lv===3?`Hình có ${n} phần. ${F(dk,dn)} = ${F(k,n)}.`:`Hình có ${n} phần bằng nhau, con cần tô ${k} phần.`,sol:`Tô <b>${k}</b> trong ${n} phần.`}},
 ()=>{const d=R(2,10),n=R(1,10);return QB({text:`Viết phân số: <b>${WORD[n]} phần ${WORD[d]}</b>`,tpl:'[F]',ans:[{frac:[n,d],mode:'exact'}],hint:'Đọc tử số trước, rồi đọc "phần", rồi đọc mẫu số.',sol:`${F(n,d)}`})},
 ()=>{const a=R(1,15),b=R(2,12);return QB({text:'Viết thương của phép chia dưới dạng phân số:',tpl:`<span class="eq">${a} : ${b} = [F]</span>`,ans:[{frac:[a,b],mode:'exact'}],hint:'Số bị chia là tử số, số chia là mẫu số.',sol:`${a} : ${b} = ${F(a,b)}.`})}]);
lesson(10,'rut-gon','Tính chất cơ bản, rút gọn, quy đồng phân số','Phân số bằng nhau; rút gọn; quy đồng mẫu số.',[()=>{let a,b;do{b=R(2,9);a=R(1,b-1)}while(gcd(a,b)>1);const m=R(2,6);return QB({text:'Điền số thích hợp:',tpl:`<span class="eq">${F(a,b)} = <span class="fr"><span>[_]</span><span>${b*m}</span></span></span>`,ans:[a*m],hint:`${b} × ${m} = ${b*m}. Nhân cả tử và mẫu với cùng một số.`,sol:`${F(a,b)} = ${F(a+' × '+m,b+' × '+m)} = ${F(a*m,b*m)}.`})},
 lv=>{let a,b;do{b=R(2,lv===1?6:10);a=R(1,b-1)}while(gcd(a,b)>1);const m=R(2,lv===1?5:9);return QB({text:`Rút gọn phân số ${F(a*m,b*m)} thành phân số tối giản:`,tpl:'[F]',ans:[{frac:[a,b],mode:'simplest'}],hint:`Chia cả tử và mẫu cho ${m} (hoặc chia nhiều lần cho 2, 3, 5…).`,sol:`${F(a*m,b*m)} = ${F(a,b)} (chia cả tử và mẫu cho ${m}).`})},
 lv=>{let a,b,c,d;if(lv<3){b=R(2,5);d=b*R(2,4);}else{do{b=R(2,6);d=R(2,7)}while(gcd(b,d)>1||b===d)}do{a=R(1,b-1)}while(gcd(a,b)>1);do{c=R(1,d-1)}while(gcd(c,d)>1);const M=lcm(b,d);
  return QB({text:`Quy đồng mẫu số hai phân số ${F(a,b)} và ${F(c,d)}:`,tpl:'[F] &nbsp;và&nbsp; [F]',ans:[{frac:[a,b],mode:'eq'},{frac:[c,d],mode:'eq'}],sameDen:true,hint:d%b===0?`${d} chia hết cho ${b}: giữ nguyên ${F(c,d)}, nhân cả tử và mẫu của ${F(a,b)} với ${d/b}.`:`Chọn mẫu số chung là ${b} × ${d} = ${b*d}.`,sol:`${F(a,b)} = ${F(a*M/b,M)}; ${F(c,d)} = ${F(c*M/d,M)}.`})}]);
lesson(10,'so-sanh-ps','So sánh phân số','So sánh hai phân số; so sánh phân số với 1.',[()=>{const d=R(3,12);let a,b;do{a=R(1,d+3);b=R(1,d+3)}while(a===b);return QCmp('Chọn dấu thích hợp:',F(a,d),F(b,d),a,b,{hint:'Hai phân số cùng mẫu số: phân số nào có tử số lớn hơn thì lớn hơn.',sol:`${F(a,d)} <b>${cmp(a,b)}</b> ${F(b,d)}.`})},
 ()=>{const n=R(1,8);let a,b;do{a=R(2,12);b=R(2,12)}while(a===b);return QCmp('Chọn dấu thích hợp:',F(n,a),F(n,b),n/a,n/b,{hint:'Hai phân số cùng tử số: phân số nào có mẫu số bé hơn thì lớn hơn.',sol:`${F(n,a)} <b>${cmp(n/a,n/b)}</b> ${F(n,b)}.`})},
 lv=>{if(lv<3&&Math.random()<.5){const d=R(3,9),a=R(1,2*d);return QCmp('So sánh với 1:',F(a,d),'1',a/d,1,{hint:'Tử số bé hơn mẫu số thì phân số bé hơn 1; bằng thì bằng 1; lớn hơn thì lớn hơn 1.',sol:`${F(a,d)} <b>${cmp(a/d,1)}</b> 1.`})}
  const b=R(2,5),m=R(2,4),d=b*m;let a=R(1,b-1),c;do{c=R(1,d-1)}while(false);return QCmp('Chọn dấu thích hợp:',F(a,b),F(c,d),a*m,c,{hint:`Quy đồng: ${F(a,b)} = ${F(a*m,d)} rồi so sánh.`,sol:`${F(a,b)} = ${F(a*m,d)} → ${F(a,b)} <b>${cmp(a*m,c)}</b> ${F(c,d)}.`})}]);

/* CĐ11 */
lesson(11,'cong-tru-ps','Phép cộng, phép trừ phân số','Cộng, trừ phân số cùng mẫu và khác mẫu (một mẫu chia hết cho mẫu kia).',[lv=>{const d=R(3,12),add=Math.random()<.5;let a=R(1,d),b=R(1,d);if(!add&&a<b)[a,b]=[b,a];if(!add&&a===b)a++;const r=add?a+b:a-b;

 lv=>{const b=R(2,5),m=R(2,3),d=b*m,add=Math.random()<.5,a=R(1,b-1);const c=add?R(1,d-1):R(1,a*m-1),num=add?a*m+c:a*m-c,op=add?'+':'−';

 ()=>{const d=R(5,12),a=R(1,d-2),b=R(1,d-a-1);return QB({text:`Một bể nước, ngày thứ nhất dùng hết ${F(a,d)} bể, ngày thứ hai dùng hết ${F(b,d)} bể. Hỏi cả hai ngày dùng hết bao nhiêu phần bể nước?`,tpl:'[F] bể',ans:[{frac:[a+b,d],mode:'eq'}],hint:'Cộng hai phân số cùng mẫu số.',sol:`${F(a,d)} + ${F(b,d)} = ${F(a+b,d)} bể.`})}]);

<script>/* data/lop9.js */
/* =====================================================================
   DỮ LIỆU LỚP 9 – Toán, Kết nối tri thức

   Công thức viết LaTeX: tm() trong dòng, td() riêng dòng, tb() đáp án đậm (xem core.js).

(() => {
const G = App.addGrade({
  id: 'lop9', name: 'Lớp 9', subject: 'Toán', book: 'Kết nối tri thức',
  topics: [
    {id:1, hk:1, name:'Phương trình và hệ hai phương trình bậc nhất hai ẩn'},
    {id:2, hk:1, name:'Phương trình và bất phương trình bậc nhất một ẩn'},

    {id:4, hk:1, name:'Hệ thức lượng trong tam giác vuông'},
  ],
});
const lesson = G.lesson;

/* ---------- Tiện ích LaTeX riêng của lớp 9 ---------- */
const X = 'x', Y = 'y', X2 = 'x^2';
const poly = tpoly, frac = tfrac, par = tp;
const RA = '\\;\\Rightarrow\\;', EQ = '\\;\\Leftrightarrow\\;';
const OPS = {'<':'\\lt', '>':'\\gt', '≤':'\\le', '≥':'\\ge'};
const op_ = o => OPS[o];
const eq2 = (a,b,c) => `${poly([a,X],[b,Y])} = ${c}`;
const sys = (e1,e2,lab) => tsys([e1,e2], lab);
const pr = (x,y) => `({${x}};\\,{${y}})`;
const sR = (a,b) => pick([-1,1])*R(a,b);
const subst = (a,b,x,y) => `${a}\\cdot${par(x)} ${b<0?'-':'+'} ${Math.abs(b)}\\cdot${par(y)}`;

const det = (a1,b1,a2,b2) => a1*b2-a2*b1;
const uniqBy = arr => {const seen=new Set();return arr.filter(p=>{const k=JSON.stringify(p);if(seen.has(k))return false;seen.add(k);return true})};
const fac = (p,q) => q===0 ? poly([p,X]) : `(${poly([p,X],[q,''])})`;
const mulStr = c => c===1?'':c===-1?'-':String(c);
const cf = c => Math.abs(c)===1 ? '' : Math.abs(c);            // hệ số khi đã tách dấu
const sg = c => c<0 ? '-' : '+';
const FLIP = {'<':'>','>':'<','≤':'≥','≥':'≤'};
const TEST = (l,op,r) => op==='<'?l<r:op==='>'?l>r:op==='≤'?l<=r:l>=r;
const ANS2 = `<span class="eq">${tm('(x;\\,y) = (')}[_]${tm(';')}[_]${tm(')')}</span>`;
const blank = v => `<span class="eq">${tm(v+' =')} [_]</span>`;

/* =====================================================================
   CHƯƠNG I – BÀI 1. Khái niệm phương trình và hệ hai PT bậc nhất hai ẩn
   ===================================================================== */
const zeroX = (b,c) => `0x ${sg(b)} ${cf(b)}y = ${c}`;
const zeroY = (a,c) => `${poly([a,X])} + 0y = ${c}`;
const wrongPT = () => { const a=sR(1,6), b=sR(1,6), c=sR(1,9); return shuffle([
  {s:`${poly([a,X2],[b,Y])} = ${c}`, why:`có ${tm('x^2')} (bậc hai)`},
  {s:`${poly([a,'xy'],[b,X])} = ${c}`, why:`có tích ${tm('xy')}`},
  {s:`${a<0?'-':''}${tf(Math.abs(a),'x')} ${sg(b)} ${cf(b)}y = ${c}`, why:'có ẩn ở mẫu'},
  {s:`${poly([a,X],[b,'y^2'])} = ${c}`, why:`có ${tm('y^2')} (bậc hai)`},
  {s:`0x + 0y = ${c}`, why:`hai hệ số ${tm('a, b')} đều bằng 0`, zero:true},
])};
const PT2 = tm('ax + by = c');
const g1a = lv => {
  const a=sR(1,7), b=sR(1,7), c=sR(1,12);
  const goods=[eq2(a,b,c), zeroX(sR(1,6),sR(1,9)), zeroY(sR(2,6),sR(1,9)), `\\tfrac{1}{2}x - y = ${sR(1,9)}`];
  const hint=`Phương trình bậc nhất hai ẩn có dạng ${PT2}, trong đó ${tm('a')} và ${tm('b')} không đồng thời bằng 0. Ẩn không nằm ở mẫu, không có ${tm('x^2, y^2')} hay tích ${tm('xy')}.`;
  if(lv<3){
    let W=wrongPT(); if(lv===1) W=W.filter(w=>!w.zero);
    const good=lv===1?goods[0]:pick(goods);
    return QC({text:'Phương trình nào sau đây là <b>phương trình bậc nhất hai ẩn</b>?', opts:[good,...W.slice(0,3).map(w=>w.s)].map(tm), ans:tm(good), hint,
      sol:`${tb(good)} có dạng ${PT2} với ${tm('a, b')} không đồng thời bằng 0. Các phương trình còn lại có ẩn ở mẫu, có bậc hai hoặc có ${tm('a = b = 0')}.`});
  }
  const w=pick(wrongPT());
  return QC({text:'Phương trình nào sau đây <b>không phải</b> là phương trình bậc nhất hai ẩn?', opts:[w.s,...shuffle(goods).slice(0,3)].map(tm), ans:tm(w.s), hint,
    sol:`${tb(w.s)} không phải phương trình bậc nhất hai ẩn vì ${w.why}. Chú ý: ${tm('0x + 3y = 5')} vẫn là phương trình bậc nhất hai ẩn (chỉ cần ${tm('a, b')} không đồng thời bằng 0).`});
};
const g1b = lv => {
  const a=lv===1?R(1,5):sR(1,6), b=lv===1?R(1,5):sR(1,6), lo=lv===1?0:-6, hi=lv===1?5:6;
  const x=R(lo,hi), y=R(lo,hi), c=a*x+b*y, ok=(p,q)=>a*p+b*q===c;
  let W=uniqBy(shuffle([[y,x],[x,y+1],[x+1,y],[-x,y],[x,-y],[x-1,y+1],[x+1,y+1],[y,-x],[x+2,y-1]])).filter(([p,q])=>!ok(p,q)&&(lv>1||(p>=0&&q>=0)));
  if(W.length<3) W=[[x+1,y],[x,y+1],[x+1,y+1]];
  return QC({text:`Cặp số nào sau đây là nghiệm của phương trình ${td(eq2(a,b,c))}`,
    opts:[pr(x,y),...W.slice(0,3).map(([p,q])=>pr(p,q))].map(tm), ans:tm(pr(x,y)),
    hint:`Thay lần lượt ${tm('x, y')} của từng cặp số vào vế trái. Cặp số nào làm vế trái bằng vế phải thì đó là nghiệm.`,
    sol:`Thay ${tm(`x = ${x},\\ y = ${y}`)}: ${tm(`${subst(a,b,x,y)} = ${c}`)} (đúng). Vậy ${tb(pr(x,y))} là nghiệm.`});
};
const g1c = lv => {
  if(lv<3){
    const a=lv===1?R(1,5):sR(1,6), b=lv===1?R(1,5):sR(1,6), x=R(lv===1?0:-6,6), y=R(lv===1?0:-6,6), c=a*x+b*y;
    const askY=lv===1||Math.random()<.5;
    return askY
      ? QB({text:`Tìm ${tm('y')} để cặp số ${tm(pr(x,'y'))} là nghiệm của phương trình ${td(eq2(a,b,c))}`, tpl:blank('y'), ans:[y],
          hint:`Thay ${tm(`x = ${x}`)} vào phương trình rồi giải phương trình bậc nhất ẩn ${tm('y')}.`,
          sol:`Thay ${tm(`x = ${x}`)}: ${tm(`${a}\\cdot${par(x)} ${sg(b)} ${poly([Math.abs(b),Y])} = ${c}${RA}${poly([b,Y])} = ${c-a*x}${RA}y = ${y}`)}. Vậy ${tb(`y = ${y}`)}.`})
      : QB({text:`Tìm ${tm('x')} để cặp số ${tm(pr('x',y))} là nghiệm của phương trình ${td(eq2(a,b,c))}`, tpl:blank('x'), ans:[x],
          hint:`Thay ${tm(`y = ${y}`)} vào phương trình rồi giải phương trình bậc nhất ẩn ${tm('x')}.`,
          sol:`Thay ${tm(`y = ${y}`)}: ${tm(`${poly([a,X])} ${sg(b)} ${Math.abs(b)}\\cdot${par(y)} = ${c}${RA}${poly([a,X])} = ${c-b*y}${RA}x = ${x}`)}. Vậy ${tb(`x = ${x}`)}.`});
  }
  const A=sR(1,6), k=sR(1,5), m=A-k, b=sR(1,6), x=sR(1,5), y=R(-5,5), c=A*x+b*y;
  const coef=`(${poly([1,'m'],[k,''])})`;
  return QB({text:`Tìm ${tm('m')} để cặp số ${tm(pr(x,y))} là nghiệm của phương trình ${td(`${coef}x ${sg(b)} ${cf(b)}y = ${c}`)}`,
    tpl:blank('m'), ans:[m],
    hint:`Thay ${tm('x, y')} của cặp số vào phương trình, được một phương trình ẩn ${tm('m')}. Giải phương trình đó.`,
    sol:`Thay ${tm(`x = ${x},\\ y = ${y}`)}: ${tm(`${coef}\\cdot${par(x)} ${sg(b)} ${Math.abs(b)}\\cdot${par(y)} = ${c}${RA}${coef}\\cdot${par(x)} = ${A*x}${RA}${poly([1,'m'],[k,''])} = ${A}`)}. Vậy ${tb(`m = ${m}`)}.`});
};
const pickSys = (lv, big) => { let a1,b1,a2,b2; const r=big||(lv===1?4:6);
  do{ a1=lv===1?R(1,r):sR(1,r); b1=lv===1?R(1,r):sR(1,r); a2=sR(1,r); b2=sR(1,r); }while(det(a1,b1,a2,b2)===0);
  return [a1,b1,a2,b2]; };
const g1d = lv => {
  const [a1,b1,a2,b2]=pickSys(lv), lo=lv===1?0:-5, x=R(lo,5), y=R(lo,5), c1=a1*x+b1*y, c2=a2*x+b2*y;
  const both=(p,q)=>a1*p+b1*q===c1&&a2*p+b2*q===c2;
  const g1=gcd(a1,b1), g2=gcd(a2,b2);
  let W=uniqBy([[x+b1/g1,y-a1/g1],[x-b2/g2,y+a2/g2],[y,x],[x+1,y-1],[-x,-y],[x-b1/g1,y+a1/g1]]).filter(([p,q])=>!both(p,q));
  return QC({text:`Cặp số nào sau đây là nghiệm của hệ phương trình ${td(sys(eq2(a1,b1,c1),eq2(a2,b2,c2)))}`,
    opts:[pr(x,y),...W.slice(0,3).map(([p,q])=>pr(p,q))].map(tm), ans:tm(pr(x,y)),
    hint:'Nghiệm của hệ phải thoả mãn <b>cả hai</b> phương trình. Có cặp số chỉ đúng với một phương trình – hãy thử cả hai.',
    sol:`Với ${tm(pr(x,y))}: PT thứ nhất ${tm(`${subst(a1,b1,x,y)} = ${c1}`)} ✓; PT thứ hai ${tm(`${subst(a2,b2,x,y)} = ${c2}`)} ✓. Vậy nghiệm là ${tb(pr(x,y))}.`});
};
const g1e = lv => {
  const x=sR(1,4), y=sR(1,5);
  if(lv===1){ const a=sR(1,5), b1=sR(1,4), a2=sR(1,4), b2=sR(1,4), c1=a*x+b1*y, c2=a2*x+b2*y;
    return QB({text:`Biết hệ phương trình ${td(sys(`ax ${sg(b1)} ${cf(b1)}y = ${c1}`,eq2(a2,b2,c2)))} có nghiệm ${tm(pr(x,y))}. Tìm ${tm('a')}.`,
      tpl:blank('a'), ans:[a],
      hint:`Thay ${tm('x, y')} vào phương trình chứa ${tm('a')}, được phương trình bậc nhất ẩn ${tm('a')}.`,
      sol:`Thay vào PT thứ nhất: ${tm(`a\\cdot${par(x)} ${sg(b1)} ${Math.abs(b1)}\\cdot${par(y)} = ${c1}${RA}${poly([x,'a'])} = ${a*x}`)}. Vậy ${tb(`a = ${a}`)}.`}); }
  const a=sR(1,5), b=sR(1,5), k1=lv===3?sR(1,3):0, k2=lv===3?sR(1,3):0, B1=sR(1,4), A2=sR(1,4);
  const c1=(a+k1)*x+B1*y, c2=A2*x+(b+k2)*y;
  const ca=k1?`(${poly([1,'a'],[k1,''])})`:'a', cb=k2?`(${poly([1,'b'],[k2,''])})`:'b';
  return QB({text:`Biết hệ phương trình ${td(sys(`${ca}x ${sg(B1)} ${cf(B1)}y = ${c1}`,`${poly([A2,X])} + ${cb}y = ${c2}`))} có nghiệm ${tm(pr(x,y))}. Tìm ${tm('a')} và ${tm('b')}.`,
    tpl:`<span class="eq">${tm('a =')} [_]${tm(';\\quad b =')} [_]</span>`, ans:[a,b],
    hint:`Thay ${tm('x, y')} vào từng phương trình: PT thứ nhất cho ta ${tm('a')}, PT thứ hai cho ta ${tm('b')}.`,
    sol:`PT thứ nhất: ${tm(`${ca}\\cdot${par(x)} = ${minus(c1,B1*y)} = ${c1-B1*y}${k1?`${RA}${poly([1,'a'],[k1,''])} = ${a+k1}`:''}`)}, nên ${tb(`a = ${a}`)}.<br>PT thứ hai: ${tm(`${cb}\\cdot${par(y)} = ${minus(c2,A2*x)} = ${c2-A2*x}${k2?`${RA}${poly([1,'b'],[k2,''])} = ${b+k2}`:''}`)}, nên ${tb(`b = ${b}`)}.`});
};

/* =====================================================================
   BÀI 2. Giải hệ hai phương trình bậc nhất hai ẩn
   ===================================================================== */
const g2a = lv => {   // phương pháp thế
  let x,y,a1,b1,a2,b2; const r=lv===1?4:6;
  do{ x=R(-r,r); y=R(-r,r); a2=sR(1,5); b2=sR(1,5);
    if(lv===2){a1=1;b1=sR(1,5)}else{a1=sR(1,lv===1?4:6);b1=lv===1?-1:pick([-1,1])}
  }while(det(a1,b1,a2,b2)===0);
  const c1=a1*x+b1*y, c2=a2*x+b2*y; let e1, sol;
  if(lv===2){ // rút x = c1 − b1·y
    e1=eq2(1,b1,c1); const ex=poly([-b1,Y],[c1,'']), B=b2-a2*b1;
    sol=`Từ (1): ${tm(`x = ${ex}`)}. Thế vào (2): ${tm(`${mulStr(a2)}(${ex}) ${sg(b2)} ${poly([Math.abs(b2),Y])} = ${c2}${EQ}${poly([B,Y])} = ${c2-a2*c1}${EQ}y = ${y}`)}. Suy ra ${tm(`x = ${x}`)}. Nghiệm của hệ: ${tb(pr(x,y))}.`;
  } else {    // rút y = k·x + m
    const k=-a1*b1, m=c1*b1, ey=poly([k,X],[m,'']), A=a2+b2*k;

  }
  if(k==='tuoi'){ let C,kk,n,Mm; do{C=R(5,15);kk=R(2,3);n=R(3,10);Mm=kk*(C+n)-n}while(Mm-C<20||Mm>55);
    return QB({text:`Hiện nay tổng số tuổi của mẹ và con là <b>${Mm+C}</b>. Sau <b>${n}</b> năm nữa, tuổi mẹ gấp <b>${kk}</b> lần tuổi con. Tính tuổi mỗi người hiện nay.`,
      tpl:'Mẹ: [_] tuổi; con: [_] tuổi', ans:[Mm,C], hint:`Gọi ${tm('x, y')} là tuổi mẹ, tuổi con hiện nay. Sau ${n} năm, mỗi người thêm ${n} tuổi.`,
      sol:`Ta có hệ ${td(`${S2(`x + y = ${Mm+C}`,`x + ${n} = ${kk}(y + ${n})`)}${EQ}${S2(`x + y = ${Mm+C}`,`x - ${kk}y = ${kk*n-n}`)}`)}Giải được ${tm(`y = ${C},\\ x = ${Mm}`)}. Mẹ <b>${Mm} tuổi</b>, con <b>${C} tuổi</b>.`});
  }
  let a,b; do{a=R(1,9);b=R(1,9)}while(a===b);
  const n=10*a+b, m=10*b+a, D=Math.abs(m-n);
  return QB({text:`Tìm số tự nhiên có hai chữ số, biết tổng hai chữ số của nó bằng <b>${a+b}</b> và nếu đổi chỗ hai chữ số thì được số mới ${m>n?'lớn':'nhỏ'} hơn số ban đầu <b>${D}</b> đơn vị.`,
    tpl:'Số cần tìm: [_]', ans:[n], hint:`Gọi chữ số hàng chục là ${tm('x')}, hàng đơn vị là ${tm('y')}: số đó bằng ${tm('10x + y')}, số đổi chỗ là ${tm('10y + x')}.`,
    sol:`Ta có hệ ${td(`${S2(`x + y = ${a+b}`,m>n?`(10y + x) - (10x + y) = ${D}`:`(10x + y) - (10y + x) = ${D}`)}${EQ}${S2(`x + y = ${a+b}`,m>n?`y - x = ${D/9}`:`x - y = ${D/9}`)}`)}Giải được ${tm(`x = ${a},\\ y = ${b}`)}. Số cần tìm là <b>${n}</b>.`});
};

lesson(1,'khai-niem-he','Bài 1. Khái niệm phương trình và hệ hai phương trình bậc nhất hai ẩn','Nhận biết PT bậc nhất hai ẩn; kiểm tra nghiệm của PT và của hệ; tìm tham số.',[g1a,g1b,g1c,g1d,g1e]);
lesson(1,'giai-he','Bài 2. Giải hệ hai phương trình bậc nhất hai ẩn','Phương pháp thế, phương pháp cộng đại số; số nghiệm của hệ; tìm hệ số a, b.',[g2a,g2b,g2c,g2d]);
lesson(1,'lap-he','Bài 3. Giải bài toán bằng cách lập hệ phương trình','Chọn hệ đúng cho bài toán; giải các bài toán thực tế bằng hệ phương trình.',[g3a,g3b,g3c]);
lesson(1,'on-tap-c1','Ôn tập chương I','Tổng hợp: nghiệm của PT, giải hệ, số nghiệm và bài toán lập hệ.',[g1d,g2a,g2b,g2c,g3b,g3c]);

/* =====================================================================
   CHƯƠNG II – BÀI 4. Phương trình quy về phương trình bậc nhất một ẩn
   ===================================================================== */
const TPL2 = `<span class="eq">Nghiệm nhỏ: ${tm('x =')} [_]</span><br><span class="eq">Nghiệm lớn: ${tm('x =')} [_]</span>`;
const g4a = lv => {   // phương trình tích
  let r1,r2,pt,sol;
  if(lv<3){ do{r1=R(-8,8);r2=R(-8,8)}while(r1===r2);
    const p=lv===1?1:R(2,5), f1=fac(p,-p*r1), f2=fac(1,-r2), [A,B]=r1===0?[f1,f2]:r2===0?[f2,f1]:[f1,f2];
    pt=`${A}${B} = 0`;
    sol=tm(`${pt}${EQ}${poly([p,X],[-p*r1,''])} = 0 \\text{ hoặc } ${poly([1,X],[-r2,''])} = 0${EQ}x = ${r1} \\text{ hoặc } x = ${r2}`)+'.';
  } else { const k=pick(['xx','chung','hdt']);
    if(k==='xx'){ r1=0; r2=sR(1,9); pt=`x^2 = ${poly([r2,X])}`;
      sol=tm(`${pt}${EQ}${poly([1,X2],[-r2,X])} = 0${EQ}x${fac(1,-r2)} = 0${EQ}x = 0 \\text{ hoặc } x = ${r2}`)+'.'; }
    else if(k==='chung'){ let a,b,c; do{a=R(-6,6);b=R(-6,6);c=sR(1,5)}while(c-b===a||b===0||a===-b); r1=a; r2=c-b;
      pt=`${fac(1,-a)}${fac(1,b)} = ${mulStr(c)}${fac(1,-a)}`;
      sol=td(`\\begin{aligned}&${pt}\\\\${EQ}&${fac(1,-a)}${fac(1,b)} ${c<0?'+':'-'} ${cf(c)}${fac(1,-a)} = 0\\\\${EQ}&${fac(1,-a)}${fac(1,b-c)} = 0${EQ}x = ${a} \\text{ hoặc } x = ${c-b}\\end{aligned}`)+`<i>Chú ý: không chia hai vế cho ${tm(fac(1,-a))} vì sẽ mất nghiệm.</i><br>`; }
    else { const t=R(1,9); r1=-t; r2=t; pt=`${poly([1,X2],[-t*t,''])} = 0`;
      sol=tm(`${pt}${EQ}${fac(1,-t)}${fac(1,t)} = 0`)+` (hằng đẳng thức ${tm('a^2-b^2')}) ${tm(`${EQ}x = ${t} \\text{ hoặc } x = -${t}`)}.`; }
  }
  const lo=Math.min(r1,r2), hi=Math.max(r1,r2);
  return QB({text:`Giải phương trình ${td(pt)}`, tpl:TPL2, ans:[lo,hi],
    hint:lv<3?'Tích bằng 0 khi một trong các thừa số bằng 0. Cho từng thừa số bằng 0 rồi giải.':'Chuyển hết sang vế trái, đặt nhân tử chung (hoặc dùng hằng đẳng thức) để đưa về phương trình tích.',
    sol:`${sol} Nghiệm nhỏ ${tb(lo)}, nghiệm lớn ${tb(hi)}.`});
};
const ne = v => `x \\ne ${v}`;
const g4b = lv => {   // điều kiện xác định
  let pt, good, opts;
  const both = (u,v) => `${ne(u)} \\text{ và } ${ne(v)}`;
  if(lv===1){ let p,a; do{p=sR(1,9);a=sR(1,9)}while(Math.abs(a)===Math.abs(p));
    pt=`${tf(poly([1,X],[a,'']),poly([1,X],[-p,'']))} = ${sR(1,5)}`; good=ne(p); opts=[good,ne(-p),ne(a),ne(-a)];
  } else if(lv===2){ let p,q; do{p=R(1,9);q=R(1,9)}while(p===q);
    const u=sR(1,5); pt=`${u<0?'-':''}${tf(Math.abs(u),poly([1,X],[-p,'']))} + ${tf(R(1,5),poly([1,X],[q,'']))} = ${-R(1,4)}`;
    good=both(p,-q); opts=[good,both(-p,q),both(p,q),both(-p,-q)];
  } else { const p=sR(1,6), k=R(2,5);
    pt=`${tf(poly([1,X],[R(1,5),'']),poly([k,X],[-k*p,'']))} - ${tf(R(1,4),'x')} = ${tf(1,`x(${poly([1,X],[-p,''])})`)}`;
    good=both(p,0); opts=[good,both(k*p,0),both(-p,0),ne(p)];
  }
  return QC({text:`Điều kiện xác định của phương trình ${td(pt)} là`, opts:opts.map(tm), ans:tm(good),
    hint:`Điều kiện xác định: <b>mọi mẫu thức</b> phải khác 0. Cho từng mẫu khác 0 rồi tìm ${tm('x')}.`,
    sol:`Các mẫu phải khác 0 nên ĐKXĐ là ${tb(good)}.`});
};
const g4c = lv => {   // giải phương trình chứa ẩn ở mẫu
  if(lv===1){ let x0,b,c,a; do{x0=R(-8,8);b=R(-6,6);c=pick([-3,-2,-1,2,3,4]);a=c*(x0-b)-x0}while(b===x0||a===0||b===0);
    return QB({text:`Giải phương trình ${td(`${tf(poly([1,X],[a,'']),poly([1,X],[-b,'']))} = ${c}`)}`, tpl:blank('x'), ans:[x0],
      hint:'Tìm ĐKXĐ, nhân hai vế với mẫu để khử mẫu, giải phương trình bậc nhất rồi đối chiếu điều kiện.',
      sol:`ĐKXĐ: ${tm(ne(b))}. Khử mẫu: ${tm(`${poly([1,X],[a,''])} = ${mulStr(c)}${fac(1,-b)}${EQ}${poly([1-c,X])} = ${-c*b-a}${EQ}x = ${x0}`)} (thoả mãn ĐKXĐ). Nghiệm: ${tb(`x = ${x0}`)}.`});
  }
  if(lv===2){ let x0,p,q; do{x0=R(-4,8);p=x0-R(1,6);q=x0-R(1,6)}while(p===q||p===0||q===0);
    const A=x0-p, B=x0-q;
    return QB({text:`Giải phương trình ${td(`${tf(A,poly([1,X],[-p,'']))} = ${tf(B,poly([1,X],[-q,'']))}`)}`, tpl:blank('x'), ans:[x0],
      hint:'ĐKXĐ: hai mẫu khác 0. Nhân chéo (hoặc quy đồng) để khử mẫu, giải rồi đối chiếu điều kiện.',
      sol:`ĐKXĐ: ${tm(`${ne(p)},\\ ${ne(q)}`)}. Khử mẫu: ${tm(`${mulStr(A)}${fac(1,-q)} = ${mulStr(B)}${fac(1,-p)}${EQ}${poly([A-B,X])} = ${A*q-B*p}${EQ}x = ${x0}`)} (thoả mãn). Nghiệm: ${tb(`x = ${x0}`)}.`});
  }
  let a,r,e,Q,p,T; do{a=sR(1,5);r=R(-6,6);e=pick([0,a]);Q=R(1,4);p=Q-e-r;T=Q*a-e*r}while(r===0||r===a||T===0);
  const den2=`x(${poly([1,X],[-a,''])})`;
  return QB({text:`Giải phương trình ${td(`${tf(poly([1,X],[p,'']),poly([1,X],[-a,'']))} - ${tf(Q,'x')} = ${T<0?'-':''}${tf(Math.abs(T),den2)}`)}`, tpl:blank('x'), ans:[r],
    hint:`Tìm ĐKXĐ (mọi mẫu khác 0). Quy đồng với mẫu chung ${tm(den2)}, khử mẫu, đưa về phương trình tích. Nhớ loại giá trị không thoả mãn ĐKXĐ.`,
    sol:`ĐKXĐ: ${tm(`x \\ne 0,\\ ${ne(a)}`)}. Quy đồng và khử mẫu: ${td(`\\begin{aligned}&${p===0?X2:'x'+fac(1,p)} - ${mulStr(Q)}${fac(1,-a)} = ${T}\\\\${EQ}&${poly([1,X2],[p-Q,X],[Q*a-T,''])} = 0\\\\${EQ}&${e===0?'x':fac(1,-e)}${fac(1,-r)} = 0\\end{aligned}`)}${tm(`x = ${e}`)} (loại vì không thoả mãn ĐKXĐ) hoặc ${tm(`x = ${r}`)} (nhận). Nghiệm: ${tb(`x = ${r}`)}.`});
};

/* =====================================================================
   BÀI 5. Bất đẳng thức và tính chất
   ===================================================================== */
const g5a = lv => {   // diễn đạt bằng lời
  const OPL=['≥','≤','>','<'];
  if(lv===1){ const v=pick(['a','x','m','b']), n=R(-9,15), [w,op]=pick([['không nhỏ hơn','≥'],['không lớn hơn','≤'],['nhỏ hơn','<'],['lớn hơn','>'],['không vượt quá','≤'],['không bé hơn','≥']]);
    const S=o=>tm(`${v} ${op_(o)} ${n}`);
    return QC({text:`Khẳng định “${tm(v)} ${w} ${tm(n)}” được viết là:`, opts:OPL.map(S), ans:S(op),
      hint:`“không nhỏ hơn” nghĩa là lớn hơn hoặc bằng (${tm('\\ge')}); “không lớn hơn”, “không vượt quá” nghĩa là nhỏ hơn hoặc bằng (${tm('\\le')}).`,
      sol:`“${w}” ứng với dấu ${tm(op_(op))}: ${tb(`${v} ${op_(op)} ${n}`)}.`});
  }
  if(lv===2){ const c=pick([
      ()=>{const n=pick([40,50,60,80]);return [`Biển báo giới hạn tốc độ <b>tối đa</b> ${n} km/h. Gọi ${tm('v')} (km/h) là tốc độ cho phép của xe.`,'v','≤',n]},
      ()=>{const n=pick([450,630,750,1000]);return [`Một thang máy chở được <b>tối đa</b> ${n} kg. Gọi ${tm('m')} (kg) là khối lượng được phép chở.`,'m','≤',n]},
      ()=>{const n=pick([20,25,30]);return [`Để vào vòng trong, đội cần ghi được <b>ít nhất</b> ${n} điểm. Gọi ${tm('s')} là số điểm đội cần có.`,'s','≥',n]},
      ()=>{const n=pick([4,5,8]);return [`Sữa chua cần bảo quản ở nhiệt độ <b>dưới</b> ${n} °C. Gọi ${tm('t')} (°C) là nhiệt độ bảo quản.`,'t','<',n]},
      ()=>{const n=pick([120,130,140]);return [`Trò chơi chỉ dành cho người cao <b>trên</b> ${n} cm. Gọi ${tm('h')} (cm) là chiều cao người chơi.`,'h','>',n]},
      ()=>{const n=pick([35,40,45]);return [`Mỗi lớp học có <b>không quá</b> ${n} học sinh. Gọi ${tm('n')} là số học sinh của một lớp.`,'n','≤',n]},
      ()=>{const n=pick([20,30,45]);return [`Mỗi ngày em đọc sách <b>không ít hơn</b> ${n} phút. Gọi ${tm('t')} là số phút đọc sách.`,'t','≥',n]},
    ])(); const [txt,v,op,n]=c, S=o=>tm(`${v} ${op_(o)} ${n}`);
    return QC({text:`${txt} Bất đẳng thức nào diễn tả đúng?`, opts:OPL.map(S), ans:S(op),
      hint:`“tối đa, không quá” → ${tm('\\le')}; “ít nhất, không ít hơn” → ${tm('\\ge')}; “dưới” → ${tm('\\lt')}; “trên” → ${tm('\\gt')}.`, sol:`Ta viết ${tb(`${v} ${op_(op)} ${n}`)}.`});
  }
  const a=R(2,9), b=R(3,20), k=R(2,5), c=pick([
    [`Tổng của ${tm('x')} và ${a} không nhỏ hơn ${b}`, `x + ${a}`, '≥', String(b)],
    [`Hiệu của ${tm('x')} và ${a} nhỏ hơn ${b}`, `x - ${a}`, '<', String(b)],
    [`${k} lần ${tm('x')} không lớn hơn ${b}`, `${k}x`, '≤', String(b)],
    [`${tm('x')} cộng ${a} thì lớn hơn ${k} lần ${tm('x')}`, `x + ${a}`, '>', `${k}x`],
    [`Bình phương của ${tm('x')} luôn không âm`, X2, '≥', '0'],
  ]); const S=o=>`${c[1]} ${op_(o)} ${c[3]}`;
  return QC({text:`Viết bất đẳng thức diễn tả: “${c[0]}”.`, opts:OPL.map(o=>tm(S(o))), ans:tm(S(c[2])),
    hint:`Viết biểu thức ở mỗi vế trước, rồi chọn dấu: không nhỏ hơn (${tm('\\ge')}), không lớn hơn (${tm('\\le')}), nhỏ hơn (${tm('\\lt')}), lớn hơn (${tm('\\gt')}), không âm (${tm('\\ge 0')}).`,
    sol:`Ta viết ${tb(S(c[2]))}.`});
};
const g5b = lv => {   // so sánh nhờ tính chất
  const rel=pick(['<','>']), s=rel==='<'?-1:1;
  let k=lv===1?1:lv===2?-R(2,6):sR(2,6), c1=sR(1,9), c2=c1;
  if(lv===1&&Math.random()<.5){ k=R(2,6); }
  if(lv===3){ const dir=Math.sign(k*s); c2=c1-dir*R(1,5); } // chênh hằng số cùng chiều → vẫn so sánh được
  const L=poly([k,'a'],[c1,'']), Rr=poly([k,'b'],[c2,'']), sgn=Math.sign(k*s), ansOp=sgn>0?'>':'<';
  const AB=tm(`a ${op_(rel)} b`);
  const step1=k===1?`Vì ${AB} nên cộng ${tm(c1)} vào hai vế, giữ nguyên chiều`:`Vì ${AB} và ${tm(`${k} ${k>0?'\\gt':'\\lt'} 0`)} nên ${tm(`${poly([k,'a'])} ${op_(k>0?rel:FLIP[rel])} ${poly([k,'b'])}`)}${k<0?' (nhân với số âm thì đổi chiều)':''}`;
  const sol = c1===c2 ? `${step1}. Vậy ${tb(`${L} ${op_(ansOp)} ${Rr}`)}.`
    : `${step1}, suy ra ${tm(`${L} ${op_(ansOp)} ${poly([k,'b'],[c1,''])}`)}. Mà ${tm(`${poly([k,'b'],[c1,''])} ${op_(ansOp)} ${Rr}`)} (vì ${tm(`${c1} ${op_(ansOp)} ${c2}`)}). Theo tính chất bắc cầu: ${tb(`${L} ${op_(ansOp)} ${Rr}`)}.`;
  return QCmp(`Cho ${AB}. So sánh hai biểu thức:`, tm(L), tm(Rr), sgn, 0,
    {hint:lv===1?'Cộng cùng một số vào hai vế thì giữ nguyên chiều; nhân với số dương cũng giữ nguyên chiều.':lv===2?'Nhân hai vế với một số âm thì bất đẳng thức <b>đổi chiều</b>.':'So sánh qua một biểu thức trung gian rồi dùng tính chất bắc cầu.', sol});
};
const g5c = lv => {   // khẳng định đúng
  if(lv===3){ const k=sR(2,6), c=sR(1,9), op=pick(['<','>','≤','≥']), d=k>0?op:FLIP[op], S=o=>`a ${op_(o)} b`;
    return QC({text:`Cho ${tm(`${poly([k,'a'],[c,''])} ${op_(op)} ${poly([k,'b'],[c,''])}`)}. Khẳng định nào sau đây đúng?`, opts:['<','>','≤','≥'].map(o=>tm(S(o))), ans:tm(S(d)),
      hint:`Cộng ${tm(-c)} vào hai vế, rồi chia hai vế cho ${tm(k)}. Chia cho số âm thì đổi chiều.`,
      sol:`Cộng ${tm(-c)} vào hai vế: ${tm(`${poly([k,'a'])} ${op_(op)} ${poly([k,'b'])}`)}. Chia hai vế cho ${tm(k)}${k<0?' (số âm, đổi chiều)':''}: ${tb(S(d))}.`}); }
  const rel=pick(['<','>']);
  const mk=()=>{const t=pick(lv===1?['add','sub','mul','mix']:['add','mul','neg','neg','mixneg']);const c=R(1,9);let k=R(2,6);
    if(t==='add')return [`a + ${c}`,`b + ${c}`,rel];
    if(t==='sub')return [`a - ${c}`,`b - ${c}`,rel];
    if(t==='mul')return [`${k}a`,`${k}b`,rel];
    if(t==='mix')return [poly([k,'a'],[-c,'']),poly([k,'b'],[-c,'']),rel];
    if(t==='neg')return [poly([-k,'a']),poly([-k,'b']),FLIP[rel]];
    return [poly([-k,'a'],[c,'']),poly([-k,'b'],[c,'']),FLIP[rel]];};
  const items=[];const seen=new Set();while(items.length<4){const it=mk();if(!seen.has(it[0])){seen.add(it[0]);items.push(it)}}
  const st=(it,right)=>`${it[0]} ${op_(right?it[2]:FLIP[it[2]])} ${it[1]}`;
  const good=st(items[0],true);
  return QC({text:`Cho ${tm(`a ${op_(rel)} b`)}. Khẳng định nào sau đây <b>đúng</b>?`, opts:[good,...items.slice(1).map(it=>st(it,false))].map(tm), ans:tm(good),
    hint:'Cộng/trừ cùng một số hoặc nhân với số dương: giữ chiều. Nhân với số âm: đổi chiều.',
    sol:`Khẳng định đúng: ${tb(good)}. Các khẳng định còn lại đều viết sai chiều.`});
};
const g5d = lv => {   // điền số
  if(lv<3){ const op=pick(['≥','≤']), m=R(-5,6), k=lv===1?R(2,6):-R(2,6), c=R(-9,9), v=k*m+c, op2=k>0?op:FLIP[op];
    return QB({text:`Cho ${tm(`a ${op_(op)} ${m}`)}. Điền số thích hợp vào ô trống:`, tpl:`<span class="eq">${tm(`${poly([k,'a'],[c,''])} ${op_(op2)}`)} [_]</span>`, ans:[v],
      hint:`Nhân hai vế của ${tm(`a ${op_(op)} ${m}`)} với ${tm(k)}${k<0?' (nhớ đổi chiều)':''}, sau đó cộng ${tm(c)} vào hai vế.`,
      sol:`${tm(`a ${op_(op)} ${m}${RA}${poly([k,'a'])} ${op_(op2)} ${k*m}${RA}${poly([k,'a'],[c,''])} ${op_(op2)} ${minus(k*m,-c)} = ${v}`)}. Số cần điền: ${tb(v)}.`}); }
  const op=pick(['≥','≤']), m=R(-3,5), n=R(-3,5), p=R(2,5), q=R(2,5), v=p*m+q*n;
  return QB({text:`Cho ${tm(`a ${op_(op)} ${m}`)} và ${tm(`b ${op_(op)} ${n}`)}. Điền số thích hợp:`, tpl:`<span class="eq">${tm(`${p}a + ${q}b ${op_(op)}`)} [_]</span>`, ans:[v],
    hint:'Nhân mỗi bất đẳng thức với số dương thích hợp, rồi cộng vế theo vế hai bất đẳng thức cùng chiều.',
    sol:`${tm(`${p}a ${op_(op)} ${p*m}`)}; ${tm(`${q}b ${op_(op)} ${q*n}`)}. Cộng vế theo vế: ${tm(`${p}a + ${q}b ${op_(op)} ${v}`)}. Số cần điền: ${tb(v)}.`});
};

/* =====================================================================
   BÀI 6. Bất phương trình bậc nhất một ẩn
   ===================================================================== */
const OP4=['<','>','≤','≥'];
const g6a = lv => {   // nhận biết
  const a=sR(1,7), b=sR(1,9), op=pick(OP4);
  const goods=[`${poly([a,X],[b,''])} ${op_(op)} 0`, `\\tfrac{1}{2}x - ${R(1,5)} \\le 0`, `${poly([-1,X],[R(1,9),''])} \\gt 0`, `${R(2,9)} - ${poly([R(2,5),X])} \\ge 0`, `${poly([R(2,6),X])} \\lt 0`];
  const W=shuffle([
    {s:`0x + ${R(1,9)} \\gt 0`, why:`hệ số của ${tm('x')} bằng 0`},
    {s:`${poly([1,X2],[-R(1,9),''])} \\lt 0`, why:`có ${tm('x^2')} (bậc hai)`},
    {s:`${tf(1,'x')} + ${R(1,5)} \\ge 0`, why:'ẩn nằm ở mẫu'},
    {s:`x + y \\gt ${R(1,5)}`, why:'có hai ẩn'},
  ]);
  const hint=`Bất phương trình bậc nhất một ẩn có dạng ${tm('ax + b \\gt 0')} (hoặc ${tm('\\lt,\\ \\le,\\ \\ge')}) với <b>${tm('a \\ne 0')}</b>.`;
  if(lv<3){ const good=lv===1?goods[0]:pick(goods);
    return QC({text:'Bất phương trình nào sau đây là <b>bất phương trình bậc nhất một ẩn</b>?', opts:[good,...W.slice(0,3).map(w=>w.s)].map(tm), ans:tm(good), hint,
      sol:`${tb(good)} đưa được về dạng ${tm('ax + b \\gt 0')} (hoặc ${tm('\\lt,\\ \\le,\\ \\ge')}) với ${tm('a \\ne 0')}.`}); }
  const w=W[0];
  return QC({text:'Bất phương trình nào sau đây <b>không phải</b> là bất phương trình bậc nhất một ẩn?', opts:[w.s,...shuffle(goods).slice(0,3)].map(tm), ans:tm(w.s), hint,
    sol:`${tb(w.s)} không phải bất phương trình bậc nhất một ẩn vì ${w.why}.`});
};
// Dựng BPT: lhs(x) op rhs(x). Trả về {s (LaTeX), f(x) đúng/sai, op2 (dạng x op2 ngưỡng), th (ngưỡng LaTeX), steps (LaTeX)}
const mkBPT = (lv, fracOK) => {
  let a,b,c,d,op=pick(OP4),t,num,den;
  do{ if(lv===1){a=R(2,6);c=0}else if(lv===2){a=-R(2,6);c=0}else{a=sR(1,7);c=sR(1,7)}
    b=R(-9,9); t=R(-6,6);
    if(fracOK&&lv>1){d=R(-12,12)} else d=(a-c)*t+b;   // (a−c)x op d−b
    num=d-b; den=a-c;
  }while(a===c||num===0);
  const L=poly([a,X],[b,'']), Rr=c?poly([c,X],[d,'']):String(d), A=a-c, op2=A>0?op:FLIP[op], th=frac(num,den);
  const steps=`${c?`${poly([A,X])} ${op_(op)} ${num}`:(b?`${poly([a,X])} ${op_(op)} ${minus(d,b)} = ${num}`:`${poly([a,X])} ${op_(op)} ${d}`)}${EQ}x ${op_(op2)} ${th}`;
  return {s:`${L} ${op_(op)} ${Rr}`, f:x=>TEST(a*x+b,op,c*x+d), op, op2, num, den, th, steps, neg:A<0};
};
const g6b = lv => {   // số nào là nghiệm
  const B=mkBPT(lv,false), t=Math.round(B.num/((B.den)));
  const cand=shuffle([...Array(9)].map((_,i)=>t-4+i)), good=cand.find(B.f), bad=cand.filter(x=>!B.f(x)).slice(0,3);
  return QC({text:`Số nào sau đây là nghiệm của bất phương trình ${td(B.s)}`, opts:[good,...bad].map(v=>tm(v)), ans:tm(good), compact:true,
    hint:'Thay từng số vào hai vế và kiểm tra khẳng định có đúng không. (Hoặc giải bất phương trình trước.)',
    sol:`Giải: ${tm(`${B.s}${EQ}${B.steps}`)}${B.neg?' (chia cho số âm, đổi chiều)':''}. Trong các số đã cho chỉ có ${tb(good)} thoả mãn.`});
};
const g6c = lv => {   // giải BPT – chọn tập nghiệm
  const B=mkBPT(lv,lv===3);
  const S=(o,v)=>`x ${op_(o)} ${v}`, mth=frac(-B.num,B.den);
  const opts=[S(B.op2,B.th),S(FLIP[B.op2],B.th),S(B.op2,mth),S(FLIP[B.op2],mth)];
  return QC({text:`Nghiệm của bất phương trình ${td(B.s)} là`, opts:opts.map(tm), ans:tm(opts[0]),
    hint:`Chuyển các hạng tử chứa ${tm('x')} sang một vế, số sang vế kia (nhớ đổi dấu), rồi chia hai vế cho hệ số của ${tm('x')}. Chia cho số âm phải <b>đổi chiều</b>.`,
    sol:`${tm(`${B.s}${EQ}${B.steps}`)}${B.neg?' (chia cho số âm, đổi chiều)':''}. Vậy nghiệm là ${tb(opts[0])}.`});
};
const g6d = lv => {   // nghiệm nguyên lớn nhất / nhỏ nhất
  let s,f,A,C,op; // dạng k(x − m) + n op px + q
  do{ const k=lv===1?R(2,5):sR(1,5), m=R(-5,5), n=R(-9,9), p=lv===3?sR(1,4):0, q=R(-9,9); op=pick(OP4);
    A=k-p; C=q+k*m-n;
    const nS=n?` ${sg(n)} ${Math.abs(n)}`:'';
    s=lv===1?`${poly([k,X],[-k*m+n,''])} ${op_(op)} ${q}`:`${mulStr(k)}${fac(1,-m)}${nS} ${op_(op)} ${p?poly([p,X],[q,'']):q}`;
    f=x=>TEST(k*(x-m)+n,op,p*x+q);
  }while(A===0||(lv===1&&(C%A!==0))||Math.abs(C/A)>12);
  const op2=A>0?op:FLIP[op], big=op2==='<'||op2==='≤';
  let ans=null; for(let x=-40;x<=40;x++) if(f(x)){ if(big) ans=x; else if(ans===null) ans=x; }
  return QB({text:`Tìm số nguyên ${tm('x')} <b>${big?'lớn nhất':'nhỏ nhất'}</b> thoả mãn ${td(s)}`, tpl:blank('x'), ans:[ans],
    hint:`Giải bất phương trình để được dạng ${tm(`x ${op_(op2)} \\ldots`)}, rồi chọn số nguyên ${big?'lớn nhất':'nhỏ nhất'} thoả mãn. Chú ý dấu ${/[≤≥]/.test(op2)?'có':'không có'} dấu bằng.`,
    sol:`Biến đổi: ${tm(`${poly([A,X])} ${op_(op)} ${C}${EQ}x ${op_(op2)} ${frac(C,A)}`)}${A<0?' (chia cho số âm, đổi chiều)':''}. Số nguyên ${big?'lớn nhất':'nhỏ nhất'} thoả mãn là ${tb(ans)}.`});
};
const g6e = lv => {   // bài toán thực tế
  const nm=pick(NAMES);
  if(lv===1){ if(Math.random()<.5){ const p=pick([15,20,25,30]), q=pick([6,8,9,12]), Mo=pick([100,150,200,250]), ans=Math.floor((Mo-p)/q);
      return QB({text:`${nm} có <b>${Mo} nghìn đồng</b>. ${nm} mua một hộp bút giá ${p} nghìn đồng, số tiền còn lại mua vở giá ${q} nghìn đồng một quyển. ${nm} mua được <b>nhiều nhất</b> bao nhiêu quyển vở?`,
        tpl:'[_] quyển', ans:[ans], hint:`Gọi ${tm('x')} là số quyển vở. Lập bất phương trình: tiền bút + tiền vở ${tm('\\le')} số tiền có. Giải rồi chọn số tự nhiên lớn nhất.`,
        sol:`${tm(`${p} + ${q}x \\le ${Mo}${EQ}x \\le ${frac(Mo-p,q)}`)}. Số tự nhiên lớn nhất là ${tb(ans)} quyển.`}); }
    const W=pick([450,630,750]), m=pick([60,65,70,75]), h=pick([40,45,50,55]), ans=Math.floor((W-m)/h);
    return QB({text:`Một thang máy chở tối đa <b>${W} kg</b>. Một người nặng ${m} kg cần chở các thùng hàng, mỗi thùng nặng ${h} kg. Mỗi chuyến chở được <b>nhiều nhất</b> bao nhiêu thùng hàng (kể cả người đi cùng)?`,
      tpl:'[_] thùng', ans:[ans], hint:`Gọi ${tm('x')} là số thùng. Tổng khối lượng người và hàng phải ${tm('\\le')} tải trọng tối đa.`,
      sol:`${tm(`${m} + ${h}x \\le ${W}${EQ}x \\le ${frac(W-m,h)}`)}. Nhiều nhất ${tb(ans)} thùng.`});
  }
  if(lv===2){ const O=pick([10,12,15]), r=pick([12,14,15,16]), Mo=pick([150,200,250,300]), ans=Math.floor((Mo-O)/r)+1;
    return QB({text:`Giá cước một hãng taxi: km đầu tiên ${O} nghìn đồng, mỗi km tiếp theo ${r} nghìn đồng. ${nm} có <b>${Mo} nghìn đồng</b>. Hỏi ${nm} đi được <b>tối đa</b> bao nhiêu km (số nguyên)?`,
      tpl:'[_] km', ans:[ans], hint:`Gọi ${tm('x')} là số km (${tm('x \\ge 1')}). Số tiền phải trả: km đầu + ${tm('(x - 1)')} km tiếp theo. Lập bất phương trình ${tm('\\le')} số tiền có.`,
      sol:`${tm(`${O} + ${r}(x - 1) \\le ${Mo}${EQ}${r}x \\le ${Mo-O+r}${EQ}x \\le ${frac(Mo-O+r,r)}`)}. Tối đa ${tb(ans)} km.`});
  }
  let a,b,T,need; do{a=R(5,10);b=R(5,10);T=pick([7,7.5,8,8.5]);need=Math.ceil((4*T-a-b)/2)}while(need>10||need<1);
  return QB({text:`Điểm trung bình môn của ${nm} tính theo công thức ${tm('(\\text{bài 1} + \\text{bài 2} + 2\\times\\text{bài 3}) : 4')}. ${nm} đã có bài 1 được <b>${a}</b> điểm, bài 2 được <b>${b}</b> điểm. Bài 3 phải được <b>ít nhất</b> bao nhiêu điểm (số nguyên) để điểm trung bình không dưới ${tm(tdec(T))}?`,
    tpl:'[_] điểm', ans:[need], hint:`Gọi ${tm('x')} là điểm bài 3. Lập bất phương trình ${tm('(a + b + 2x) : 4 \\ge T')} rồi giải, chọn số nguyên nhỏ nhất.`,
    sol:`${tm(`(${a} + ${b} + 2x) : 4 \\ge ${tdec(T)}${EQ}2x \\ge ${tdec(4*T-a-b)}${EQ}x \\ge ${tdec((4*T-a-b)/2)}`)}. Bài 3 cần ít nhất ${tb(need)} điểm.`});
};

lesson(2,'pt-quy-ve-bac-nhat','Bài 4. Phương trình quy về phương trình bậc nhất một ẩn','Phương trình tích; điều kiện xác định và cách giải phương trình chứa ẩn ở mẫu.',[g4a,g4b,g4c]);
lesson(2,'bat-dang-thuc','Bài 5. Bất đẳng thức và tính chất','Diễn đạt bằng lời; tính chất liên hệ với phép cộng, phép nhân; tính chất bắc cầu.',[g5a,g5b,g5c,g5d]);
lesson(2,'bat-phuong-trinh','Bài 6. Bất phương trình bậc nhất một ẩn','Nhận biết, kiểm tra nghiệm, giải BPT; nghiệm nguyên; bài toán thực tế.',[g6a,g6b,g6c,g6d,g6e]);
lesson(2,'on-tap-c2','Ôn tập chương II','Tổng hợp: phương trình tích, chứa ẩn ở mẫu, bất đẳng thức, bất phương trình.',[g4a,g4c,g5b,g6c,g6d,g6e]);

/* =====================================================================
   CHƯƠNG III – BÀI 7. Căn bậc hai và căn thức bậc hai
   ===================================================================== */
const SQF = [2,3,5,6,7,10,11,13,14,15];                 // số không có ước chính phương > 1
const sq = n => `\\sqrt{${n}}`;
const cb = n => `\\sqrt[3]{${n}}`;
const rt = (k,b) => b===1 ? String(k) : k===1 ? sq(b) : k===-1 ? `-${sq(b)}` : `${k}${sq(b)}`;   // k√b
const isSq = n => n>=0 && Number.isInteger(Math.sqrt(n));
const opT = (a,b) => a<b ? '\\lt' : a>b ? '\\gt' : '=';
const eqB = (lhs, unit='') => `<span class="eq">${tm(lhs+' =')} [_]${unit}</span>`;
const R1 = x => Math.round((x+1e-9)*10)/10;              // làm tròn đến hàng phần mười
const ansR = (a,b) => [R1(a)===R1(b) ? R1(a) : [R1(a),R1(b)]];   // chấp nhận cả kết quả bấm máy trực tiếp
const pickBy = (good, pool, n=3) => {                    // chọn n phương án sai có GIÁ TRỊ khác đáp án
  const out=[], seen=new Set([good.s]);
  for(const o of shuffle(pool)) if(out.length<n && !seen.has(o.s) && Math.abs(o.v-good.v)>1e-9){ seen.add(o.s); out.push(o); }
  return out; };

const g7a = lv => {   // căn bậc hai, căn bậc hai số học
  if(lv===1){ const n=R(2,15), N=n*n;
    return QB({text:`Tính ${tm(sq(N))}.`, tpl:eqB(sq(N)), ans:[n],
      hint:`${tm(sq('a'))} là số <b>không âm</b> mà bình phương của nó bằng ${tm('a')}. Tìm số không âm có bình phương bằng ${tm(N)}.`,
      sol:`Vì ${tm(`${n} \\ge 0`)} và ${tm(`${n}^2 = ${N}`)} nên ${tm(sq(N)+' =')} ${tb(n)}.`}); }
  if(lv===2){
    if(Math.random()<.5){ let k; do{k=R(2,19)}while(k===10); const v=k/10, N=+(v*v).toFixed(4);
      return QB({text:`Tính ${tm(sq(tdec(N)))}.`, tpl:eqB(sq(tdec(N))), ans:[v],
        hint:`Tìm số thập phân không âm mà bình phương lên bằng ${tm(tdec(N))}. Chú ý số chữ số sau dấu phẩy.`,
        sol:`Vì ${tm(`${tdec(v)}^2 = ${tdec(N)}`)} nên ${tm(sq(tdec(N))+' =')} ${tb(tdec(v))}.`}); }
    let p,q; do{p=R(1,12);q=R(2,15)}while(gcd(p,q)!==1);
    const e=sq(tf(p*p,q*q));
    return QB({text:`Tính ${tm(e)}.`, tpl:`<span class="eq">${tm(e+' =')} [F]</span>`, ans:[{frac:[p,q],mode:'eq'}],
      hint:`Khai căn tử và mẫu: ${tm('\\sqrt{\\dfrac{a}{b}} = \\dfrac{\\sqrt{a}}{\\sqrt{b}}')} (${tm('a \\ge 0,\\ b \\gt 0')}).`,
      sol:`${tm(`${e} = ${tf(sq(p*p),sq(q*q))} = `)}${tb(tf(p,q))}.`}); }
  const n=R(2,15), N=n*n, all=Math.random()<.5;
  const A=`${n} \\text{ và } {-${n}}`, B=String(n), C=`-${n}`, D=`${sq(n)} \\text{ và } {-${sq(n)}}`;
  return QC({text:all?`Các <b>căn bậc hai</b> của ${tm(N)} là`:`<b>Căn bậc hai số học</b> của ${tm(N)} là`, opts:[A,B,C,D].map(tm), ans:tm(all?A:B), keepOrder:true,
    hint:`Số dương ${tm('a')} có <b>hai</b> căn bậc hai là ${tm(sq('a'))} và ${tm('-'+sq('a'))}. Căn bậc hai số học chỉ là số <b>không âm</b> ${tm(sq('a'))}.`,
    sol:`Vì ${tm(`${n}^2 = (-${n})^2 = ${N}`)} nên ${N} có hai căn bậc hai là ${tm(`${n}`)} và ${tm(`-${n}`)}; căn bậc hai số học của ${N} là ${tm(`${sq(N)} = ${n}`)}. Đáp án: ${tb(all?A:B)}.`});
};
const g7b = lv => {   // so sánh căn bậc hai
  const put = (l,r,vl,vr,hint,why) => { const sw=Math.random()<.5; const [L,Rr,a,b]=sw?[r,l,vr,vl]:[l,r,vl,vr];
    return QCmp('So sánh hai số:', tm(L), tm(Rr), a, b, {hint, sol:`${why(sw)} Vậy ${tb(`${L} ${opT(a,b)} ${Rr}`)}.`}); };
  if(lv===1){ let a,b; do{a=R(2,60);b=R(2,60)}while(a===b);
    return put(sq(a),sq(b),a,b,`Với ${tm('a, b \\ge 0')}: ${tm('a \\lt b \\Leftrightarrow \\sqrt{a} \\lt \\sqrt{b}')}. So sánh hai số dưới dấu căn.`,
      ()=>`Vì ${tm(`${a} ${opT(a,b)} ${b}`)} nên ${tm(`${sq(a)} ${opT(a,b)} ${sq(b)}`)}.`); }
  if(lv===2){ const n=R(2,12); let a; do{a=n*n+sR(1,Math.min(4,n))}while(isSq(a)||a<2);
    return put(String(n),sq(a),n*n,a,`Viết số nguyên dưới dạng căn bậc hai: ${tm('n = \\sqrt{n^2}')} (${tm('n \\ge 0')}), rồi so sánh hai số dưới dấu căn.`,
      ()=>`Ta có ${tm(`${n} = ${sq(n*n)}`)}. Vì ${tm(`${n*n} ${opT(n*n,a)} ${a}`)} nên ${tm(`${n} ${opT(n*n,a)} ${sq(a)}`)}.`); }
  let k; do{k=R(11,39)}while(k%10===0); const v=k/10, V=+(v*v).toFixed(4); let a; do{a=Math.round(V)+pick([-1,0,1])}while(a<2||isSq(a));
  return put(tdec(v),sq(a),V,a,'Hai số đều dương: so sánh bình phương của chúng.',
    ()=>`Ta có ${tm(`${tdec(v)}^2 = ${tdec(V)}`)} và ${tm(`(${sq(a)})^2 = ${a}`)}. Vì ${tm(`${tdec(V)} ${opT(V,a)} ${a}`)} và hai số đều dương nên ${tm(`${tdec(v)} ${opT(V,a)} ${sq(a)}`)}.`);
};
const g7c = lv => {   // điều kiện xác định của căn thức bậc hai
  const S=(o,v)=>`x ${o} ${v}`; let e, good, opts, sol, hint=`${tm('\\sqrt{A}')} xác định khi ${tm('A \\ge 0')}.`;
  if(lv===1){ const a=R(1,4), r=sR(1,9), A=poly([a,X],[-a*r,'']); e=sq(A);
    good=S('\\ge',r); opts=[good,S('\\le',r),S('\\gt',r),S('\\ge',-r)];
    sol=`${tm(e)} xác định khi ${tm(`${A} \\ge 0${EQ}${a===1?'':`${poly([a,X])} \\ge ${a*r}${EQ}`}x \\ge ${r}`)}.`; }
  else if(lv===2){ const a=-R(1,5), b=R(1,12), A=poly([b,''],[a,X]), th=frac(b,-a); e=sq(A);
    good=S('\\le',th); opts=[good,S('\\ge',th),S('\\lt',th),S('\\le',frac(-b,-a))];
    hint+=' Khi chia hai vế cho số âm, nhớ <b>đổi chiều</b>.';
    sol=`${tm(e)} xác định khi ${tm(`${A} \\ge 0${EQ}${poly([a,X])} \\ge ${-b}${EQ}x \\le ${th}`)} (chia cho số âm, đổi chiều).`; }
  else { const a=sR(1,4), r=R(-6,6), c=R(1,9), A=poly([a,X],[-a*r,'']); e=sq(tf(c,A));
    const o=a>0?'\\gt':'\\lt'; good=S(o,r); opts=[S('\\gt',r),S('\\ge',r),S('\\lt',r),S('\\le',r)];
