      hint:`Tử là bình phương của một hiệu: ${tm('A^2 - 2AB + B^2 = (A - B)^2')} với ${tm('A = \\sqrt{x}')}.`,
      sol:`${tm(`x - ${2*k}${sx} + ${k*k} = (${sx} - ${k})^2`)} nên ${tm(`${e} = `)}${tb(good)}.`}); }
  let k,m; do{k=R(1,4);m=R(k+1,9)}while(m===k);
  const A=`${tf(`${sx} + ${k}`,`${sx} - ${k}`)} - ${tf(`${sx} - ${k}`,`${sx} + ${k}`)}`, p=4*k*m, q=m*m-k*k;
  return QB({text:`Cho biểu thức ${td(`A = ${A}`)}với ${tm(`x \\ge 0,\\ x \\ne ${k*k}`)}. Rút gọn ${tm('A')} rồi tính giá trị của ${tm('A')} khi ${tm(`x = ${m*m}`)}.`,
    tpl:`<span class="eq">${tm('A =')} [F]</span>`, ans:[{frac:[p,q],mode:'eq'}],
    hint:`Quy đồng với mẫu chung ${tm(`(${sx} - ${k})(${sx} + ${k}) = x - ${k*k}`)}, khai triển tử rồi rút gọn. Sau đó thay ${tm(`\\sqrt{x} = \\sqrt{${m*m}}`)}.`,
    sol:`${tm(`A = ${tf(`(${sx} + ${k})^2 - (${sx} - ${k})^2`,`x - ${k*k}`)} = ${tf(`${4*k}${sx}`,`x - ${k*k}`)}`)}. Khi ${tm(`x = ${m*m}`)} thì ${tm(`\\sqrt{x} = ${m}`)}: ${tm(`A = ${tf(`${4*k}\\cdot ${m}`,`${m*m} - ${k*k}`)} = `)}${tb(tfrac(p,q))}.`});
};

/* =====================================================================
   BÀI 10. Căn bậc ba và căn thức bậc ba
   ===================================================================== */
const g10a = lv => {   // tính căn bậc ba
  if(lv===1){ const n=R(2,10), e=cb(n**3);
    return QB({text:`Tính ${tm(e)}.`, tpl:eqB(e), ans:[n], hint:`${tm(cb('a'))} là số ${tm('x')} sao cho ${tm('x^3 = a')}.`,
      sol:`Vì ${tm(`${n}^3 = ${n**3}`)} nên ${tm(e+' =')} ${tb(n)}.`}); }
  if(lv===2){ if(Math.random()<.5){ const n=R(2,10), e=cb(-(n**3));
      return QB({text:`Tính ${tm(e)}.`, tpl:eqB(e), ans:[-n], hint:`Số âm cũng có căn bậc ba (là một số âm). Tìm ${tm('x')} sao cho ${tm(`x^3 = ${-(n**3)}`)}.`,
        sol:`Vì ${tm(`(-${n})^3 = ${-(n**3)}`)} nên ${tm(e+' =')} ${tb(-n)}.`}); }
    const k=R(1,9), sgn=pick([1,-1]), v=sgn*k/10, N=+(v**3).toFixed(4), e=cb(tdec(N));
    return QB({text:`Tính ${tm(e)}.`, tpl:eqB(e), ans:[v], hint:`Tìm số thập phân ${tm('x')} sao cho ${tm(`x^3 = ${tdec(N)}`)}. Chú ý số chữ số sau dấu phẩy.`,
      sol:`Vì ${tm(`${v<0?`(${tdec(v)})`:tdec(v)}^3 = ${tdec(N)}`)} nên ${tm(e+' =')} ${tb(tdec(v))}.`}); }
  let T,val; do{ T=[...Array(3)].map((_,i)=>({c:R(1,3),n:R(-5,5)||2,s:i&&Math.random()<.5?-1:1})); val=T.reduce((t,x)=>t+x.s*x.c*x.n,0); }while(new Set(T.map(t=>t.n)).size<3);
  const term=(t,i,f)=>(i?(t.s<0?' - ':' + '):(t.s<0?'-':''))+f(t);
  const E=T.map((t,i)=>term(t,i,x=>(x.c>1?x.c:'')+cb(x.n**3))).join(''), E2=T.map((t,i)=>term(t,i,x=>(x.c>1?`${x.c}\\cdot`:'')+tp(x.n))).join('');
  return QB({text:`Tính giá trị biểu thức ${td(`E = ${E}`)}`, tpl:eqB('E'), ans:[val], hint:'Tính từng căn bậc ba trước (chú ý căn bậc ba của số âm là số âm), rồi thực hiện phép tính.',
    sol:`${tm(`E = ${E2} = `)}${tb(val)}.`});
};
const g10b = lv => {   // so sánh căn bậc ba
  const put=(l,r,vl,vr,hint,why)=>{const sw=Math.random()<.5,[L,Rr,a,b]=sw?[r,l,vr,vl]:[l,r,vl,vr];
    return QCmp('So sánh hai số:', tm(L), tm(Rr), a, b, {hint, sol:`${why} Vậy ${tb(`${L} ${opT(a,b)} ${Rr}`)}.`})};
  const H=`${tm('a \\lt b \\Leftrightarrow \\sqrt[3]{a} \\lt \\sqrt[3]{b}')} (đúng với mọi số ${tm('a, b')}, kể cả số âm).`;
  if(lv===1){ const n=R(2,6); let a; do{a=n**3+sR(1,6)}while(a<2);
    return put(String(n),cb(a),n**3,a,`Viết ${tm(n)} dưới dạng căn bậc ba: ${tm(`${n} = ${cb('\\ldots')}`)}. `+H, `Ta có ${tm(`${n} = ${cb(n**3)}`)} và ${tm(`${n**3} ${opT(n**3,a)} ${a}`)}.`); }
  if(lv===2){ let a,b; do{a=R(-60,60);b=R(-60,60)}while(a===b||!a||!b);
    return put(cb(a),cb(b),a,b,H,`Vì ${tm(`${a} ${opT(a,b)} ${b}`)} nên ${tm(`${cb(a)} ${opT(a,b)} ${cb(b)}`)}.`); }
  const k=R(2,4), a=R(2,6), A=k**3*a; let b; do{b=A+sR(1,8)}while(b<2);
  return put(`${k}${cb(a)}`,cb(b),A,b,`Đưa thừa số vào trong dấu căn bậc ba: ${tm('A\\sqrt[3]{B} = \\sqrt[3]{A^3B}')}. `+H,
    `Ta có ${tm(`${k}${cb(a)} = \\sqrt[3]{${k}^3\\cdot ${a}} = ${cb(A)}`)}; so sánh ${tm(A)} với ${tm(b)}.`);
};
const g10c = lv => {   // giải phương trình chứa căn bậc ba
  if(lv===1){ const c=sR(1,5), x=c**3, e=`${cb('x')} = ${c}`;
    return QB({text:`Tìm ${tm('x')}, biết ${td(e)}`, tpl:blank('x'), ans:[x], hint:`Lập phương hai vế: ${tm('\\sqrt[3]{x} = c \\Leftrightarrow x = c^3')}.`,
      sol:`${tm(`${e}${EQ}x = ${tp(c)}^3`)}, nên ${tb(`x = ${x}`)}.`}); }
  if(lv===2){ const b=sR(1,20), c=R(-4,4), x=c**3-b, A=poly([1,X],[b,'']), e=`${cb(A)} = ${c}`;
    return QB({text:`Giải phương trình ${td(e)}`, tpl:blank('x'), ans:[x], hint:'Lập phương hai vế để bỏ căn bậc ba, rồi giải phương trình bậc nhất.',
      sol:`${tm(`${e}${EQ}${A} = ${tp(c)}^3 = ${c**3}${EQ}x = ${x}`)}. Nghiệm: ${tb(`x = ${x}`)}.`}); }
  let x,a,c,b; do{x=R(-10,10);a=R(2,5);c=R(-4,4);b=c**3-a*x}while(!b);
  const A=poly([a,X],[b,'']), e=`${cb(A)} = ${c}`;
  return QB({text:`Giải phương trình ${td(e)}`, tpl:blank('x'), ans:[x], hint:'Lập phương hai vế để bỏ căn bậc ba, rồi giải phương trình bậc nhất.',
    sol:`${tm(`${e}${EQ}${A} = ${c**3}${EQ}${poly([a,X])} = ${c**3-b}${EQ}x = ${x}`)}. Nghiệm: ${tb(`x = ${x}`)}.`});
};
const g10d = lv => {   // rút gọn căn thức bậc ba
  const uq=a=>[...new Set(a)];
  if(lv===1){ const k=R(2,5), s=pick([1,-1]), good=`${s<0?'-':''}${k}x`, e=cb(`${s*k**3}x^3`);
    return QC({text:`Rút gọn ${tm(e)}.`, opts:[`${k}x`,`-${k}x`,`${k**3}x`,`${k}x^3`].map(tm), ans:tm(good),
      hint:`${tm('\\sqrt[3]{A^3} = A')} với mọi ${tm('A')}. Viết biểu thức dưới dấu căn thành lập phương của một biểu thức.`,
      sol:`${tm(`${s*k**3}x^3 = (${s<0?'-':''}${k}x)^3`)} nên ${tm(`${e} = `)}${tb(good)}.`}); }
  if(lv===2){ const k=sR(1,4), A=poly([1,'x^3'],[3*k,X2],[3*k*k,X],[k**3,'']), good=poly([1,X],[k,'']);
    const opts=uq([good,poly([1,X],[-k,'']),poly([1,X],[3*k,'']),poly([1,X],[k**3,'']),poly([-1,X],[k,''])]).slice(0,4);
    return QC({text:`Rút gọn ${tm(cb(A))}.`, opts:opts.map(tm), ans:tm(good),
      hint:`Biểu thức dưới dấu căn có dạng ${tm('A^3 + 3A^2B + 3AB^2 + B^3 = (A + B)^3')}.`,
      sol:`${tm(`${A} = ${fac(1,k)}^3`)} nên ${tm(`${cb(A)} = `)}${tb(good)}.`}); }
  let k,m; do{k=R(2,4);m=R(2,6)}while(k===m);
  const e=`${cb(`${k**3}x^3`)} - ${sq(`${m*m}x^2`)}`, good=poly([k+m,X]);
  const opts=uq([good,poly([k-m,X]),poly([-(k+m),X]),poly([m-k,X])]);
  return QC({text:`Rút gọn ${tm(e)} với ${tm('x \\lt 0')}.`, opts:opts.map(tm), ans:tm(good),
    hint:`${tm('\\sqrt[3]{A^3} = A')} với mọi ${tm('A')}; còn ${tm('\\sqrt{A^2} = |A|')}. Chú ý ${tm('x \\lt 0')}.`,
    sol:`${tm(`${cb(`${k**3}x^3`)} = ${k}x`)}; ${tm(`${sq(`${m*m}x^2`)} = ${m}|x| = -${m}x`)} (vì ${tm('x \\lt 0')}). Vậy ${tm(`${e} = ${k}x + ${m}x = `)}${tb(good)}.`});
};

lesson(3,'can-bac-hai','Bài 7. Căn bậc hai và căn thức bậc hai','Căn bậc hai, căn bậc hai số học; so sánh; điều kiện xác định; hằng đẳng thức √(A²) = |A|.',[g7a,g7b,g7c,g7d]);
lesson(3,'khai-can-nhan-chia','Bài 8. Khai căn bậc hai với phép nhân và phép chia','Khai căn một tích, một thương; nhân, chia các căn bậc hai; rút gọn biểu thức chứa chữ.',[g8a,g8b,g8c]);
lesson(3,'bien-doi-can-thuc','Bài 9. Biến đổi đơn giản và rút gọn biểu thức chứa căn thức bậc hai','Đưa thừa số ra ngoài, vào trong dấu căn; căn đồng dạng; trục căn thức ở mẫu; rút gọn.',[g9a,g9b,g9c,g9d,g9e]);
lesson(3,'can-bac-ba','Bài 10. Căn bậc ba và căn thức bậc ba','Tính căn bậc ba; so sánh; giải phương trình chứa căn bậc ba; rút gọn.',[g10a,g10b,g10c,g10d]);
lesson(3,'on-tap-c3','Ôn tập chương III','Tổng hợp: so sánh căn, khai căn thương, biến đổi, trục căn thức, căn bậc ba.',[g7b,g8b,g9a,g9c,g9d,g10c]);

/* =====================================================================
   CHƯƠNG IV – BÀI 11. Tỉ số lượng giác của góc nhọn
   Tam giác vuông tại N[0]; góc nhọn N[1] (trên), N[2] (phải) – hình vẽ bằng rtTriSVG (figures.js).
   ===================================================================== */
const NAMESETS = [['A','B','C'],['M','N','P'],['D','E','F'],['H','I','K'],['A','D','E']];
const TRIPLES = [[3,4,5],[5,12,13],[8,15,17],[7,24,25],[20,21,29],[9,40,41],[6,8,10],[9,12,15]];
const DEG = d => `${d}^\\circ`;
const FN = ['sin','cos','tan','cot'];
const OTHER = {sin:'cos',cos:'sin',tan:'cot',cot:'tan'};
const DEF = `${tm('\\sin = \\dfrac{\\text{đối}}{\\text{huyền}}')}, ${tm('\\cos = \\dfrac{\\text{kề}}{\\text{huyền}}')}, ${tm('\\tan = \\dfrac{\\text{đối}}{\\text{kề}}')}, ${tm('\\cot = \\dfrac{\\text{kề}}{\\text{đối}}')}`;
// Thông tin các cạnh đối với góc nhọn V (V = 1 hoặc 2 là chỉ số đỉnh trong N)
const sides = (N,V) => { const hyp=N[1]+N[2], leg1=N[0]+N[1], leg2=N[0]+N[2];   // leg1 thẳng đứng, leg2 nằm ngang
  return V===1 ? {opp:leg2, adj:leg1, hyp} : {opp:leg1, adj:leg2, hyp}; };
const ratio = (f,s) => ({sin:[s.opp,s.hyp],cos:[s.adj,s.hyp],tan:[s.opp,s.adj],cot:[s.adj,s.opp]})[f];
const tri = lv => { const t=pick(lv===1?[[3,4,5],[6,8,10],[5,12,13]]:TRIPLES), k=lv===1?R(1,2):1, sw=Math.random()<.5;
  return {v:t[sw?0:1]*k, h:t[sw?1:0]*k, c:t[2]*k}; };   // v: cạnh đứng N0N1, h: cạnh ngang N0N2, c: huyền
const g11a = lv => {   // nhận biết tỉ số lượng giác
  const N=lv===3?pick(NAMESETS):NAMESETS[0], V=pick([1,2]), f=pick(FN), s=sides(N,V), name=N.join('');
  let opts, good, fig, t;
  if(lv===2){ t=tri(2); const len={[N[0]+N[1]]:t.v,[N[0]+N[2]]:t.h,[N[1]+N[2]]:t.c};
    const val=f=>{const [a,b]=ratio(f,s);return tfrac(len[a],len[b])};
    opts=FN.map(val); good=val(f);
    fig=rtTriSVG({n:N,w:t.h,h:t.v,ab:t.v,ac:t.h,bc:t.c,[V===1?'aB':'aC']:true}); }
  else { opts=FN.map(g=>{const [a,b]=ratio(g,s);return tf(a,b)}); const [a,b]=ratio(f,s); good=tf(a,b);
    fig=rtTriSVG({n:N,[V===1?'aB':'aC']:true}); }
  const ang=`\\${f} ${N[V]}`;
  return QC({text:`Cho tam giác ${tm(name)} vuông tại ${tm(N[0])} (hình bên). Khi đó ${tm(ang)} bằng`, fig, opts:opts.map(tm), ans:tm(good), keepOrder:lv===1,
    hint:`Xác định cạnh đối, cạnh kề của góc ${tm(N[V])} và cạnh huyền. Nhớ: ${DEF}.`,
    sol:`Với góc ${tm(N[V])}: cạnh đối là ${tm(s.opp)}, cạnh kề là ${tm(s.adj)}, cạnh huyền là ${tm(s.hyp)}. Vậy ${lv===2?tm(`${ang} = ${tf(...ratio(f,s))} =`):tm(ang+' =')} ${tb(good)}.`});
};
const g11b = lv => {   // tính tỉ số lượng giác
  if(lv<3){ const N=NAMESETS[0], V=pick([1,2]), f=pick(FN), s=sides(N,V), t=tri(lv), len={AB:t.v,AC:t.h,BC:t.c};
    let hide=null; const [a,b]=ratio(f,s); if(lv===2) hide=pick([a,b]);
    const lab=k=>k===hide?'?':len[k], known=Object.keys(len).filter(k=>k!==hide);
    const fig=rtTriSVG({n:N,w:t.h,h:t.v,ab:lab('AB'),ac:lab('AC'),bc:lab('BC'),[V===1?'aB':'aC']:true});
    const given=known.map(k=>tm(`${k} = ${len[k]}`)).join(', ');
    let py='';
    if(hide) py = hide==='BC' ? `Theo định lí Pythagore: ${tm(`BC = \\sqrt{AB^2 + AC^2} = \\sqrt{${t.v*t.v} + ${t.h*t.h}} = ${t.c}`)}. `
      : `Theo định lí Pythagore: ${tm(`${hide} = \\sqrt{BC^2 - ${known.find(k=>k!=='BC')}^2} = \\sqrt{${t.c*t.c} - ${(hide==='AB'?t.h:t.v)**2}} = ${len[hide]}`)}. `;
    return QB({text:`Cho tam giác ${tm('ABC')} vuông tại ${tm('A')} có ${given} (cùng đơn vị độ dài). Tính ${tm(`\\${f} ${N[V]}`)}.`, fig,
      tpl:`<span class="eq">${tm(`\\${f} ${N[V]} =`)} [F]</span>`, ans:[{frac:[len[a],len[b]],mode:'eq'}],
      hint:(hide?'Dùng định lí Pythagore để tính cạnh còn thiếu trước. ':'')+`Xác định cạnh đối, kề, huyền của góc ${tm(N[V])}; ${DEF}.`,
      sol:`${py}${tm(`\\${f} ${N[V]} = ${tf(a,b)} = ${tf(len[a],len[b])}`)} ${tm('=')} ${tb(tfrac(len[a],len[b]))}.`}); }
  const [p,q,h]=pick(TRIPLES.slice(0,6)), sw=Math.random()<.5, o=sw?p:q, a=sw?q:p;   // o: đối, a: kề, h: huyền
  const V={sin:[o,h],cos:[a,h],tan:[o,a],cot:[a,o]}, f1=pick(['sin','cos','tan']), f2=pick(FN.filter(g=>g!==f1));
  const [n1,d1]=V[f1], [n2,d2]=V[f2];
  const known = f1==='sin'?`cạnh đối ${tm(o+'k')}, cạnh huyền ${tm(h+'k')}`:f1==='cos'?`cạnh kề ${tm(a+'k')}, cạnh huyền ${tm(h+'k')}`:`cạnh đối ${tm(o+'k')}, cạnh kề ${tm(a+'k')}`;
  const third = f1==='sin'?`cạnh kề ${tm(`\\sqrt{${h}^2 - ${o}^2}\\,k = ${a}k`)}`:f1==='cos'?`cạnh đối ${tm(`\\sqrt{${h}^2 - ${a}^2}\\,k = ${o}k`)}`:`cạnh huyền ${tm(`\\sqrt{${o}^2 + ${a}^2}\\,k = ${h}k`)}`;
  return QB({text:`Cho ${tm('\\alpha')} là góc nhọn và ${tm(`\\${f1}\\alpha = ${tf(n1,d1)}`)}. Tính ${tm(`\\${f2}\\alpha`)}.`,
    tpl:`<span class="eq">${tm(`\\${f2}\\alpha =`)} [F]</span>`, ans:[{frac:[n2,d2],mode:'eq'}],
    hint:`Vẽ một tam giác vuông có góc nhọn ${tm('\\alpha')} với hai cạnh tỉ lệ theo ${tm(`\\${f1}\\alpha`)}, dùng định lí Pythagore tính cạnh thứ ba rồi lập tỉ số cần tìm.`,
    sol:`Xét tam giác vuông có góc nhọn ${tm('\\alpha')} với ${known} (${tm('k \\gt 0')}). Theo định lí Pythagore, ${third}. Vậy ${tm(`\\${f2}\\alpha = ${tf(n2+'k',d2+'k')} =`)} ${tb(tf(n2,d2))}.`});
};
const g11c = lv => {   // tỉ số lượng giác của hai góc phụ nhau
  const HP=`Hai góc phụ nhau (tổng bằng ${tm(DEG(90))}): sin góc này bằng cos góc kia, tan góc này bằng cot góc kia.`;
  let a; do{a=R(10,80)}while(a===45);
  if(lv===1){ const f=pick(FN), g=OTHER[f];
    return QB({text:'Điền số thích hợp vào ô trống:', tpl:`<span class="eq">${tm(`\\${f} ${DEG(a)} = \\${g}`)} [_]°</span>`, ans:[90-a], hint:HP,
      sol:`Vì ${tm(`${DEG(a)} + ${DEG(90-a)} = ${DEG(90)}`)} nên ${tm(`\\${f} ${DEG(a)} = \\${g} ${DEG(90-a)}`)}. Số cần điền: ${tb(90-a)}.`}); }
  if(lv===2){ const b=90-a, T=[`\\sin ${DEG(a)} = \\cos ${DEG(b)}`,`\\tan ${DEG(a)} = \\cot ${DEG(b)}`,`\\cos ${DEG(a)} = \\sin ${DEG(b)}`,`\\cot ${DEG(a)} = \\tan ${DEG(b)}`];
    const Fz=[`\\sin ${DEG(a)} = \\sin ${DEG(b)}`,`\\sin ${DEG(a)} = \\cos ${DEG(a)}`,`\\tan ${DEG(a)} = \\tan ${DEG(b)}`,`\\cos ${DEG(a)} = \\cos ${DEG(b)}`,`\\tan ${DEG(a)} = \\cot ${DEG(a)}`,`\\cot ${DEG(a)} = \\cot ${DEG(b)}`];
    const good=pick(T);
    return QC({text:'Khẳng định nào sau đây <b>đúng</b>?', opts:[good,...shuffle(Fz).slice(0,3)].map(tm), ans:tm(good), hint:HP,
      sol:`${tm(`${DEG(a)} + ${DEG(b)} = ${DEG(90)}`)} nên ${tb(good)}. Các khẳng định còn lại chỉ đúng khi góc bằng ${tm(DEG(45))}.`}); }
  let c,d; do{c=R(10,80);d=R(10,80)}while(c===45||d===45||c===a||d===a||c===d);
  const k=[R(1,4),R(1,4),R(1,4)], s=[1,pick([1,-1]),pick([1,-1])], v=k[0]*s[0]+k[1]*s[1]+k[2]*s[2];
  const K=(i,e,wrap)=>(i?(s[i]<0?' - ':' + '):'')+(k[i]>1?(wrap?`${k[i]}\\cdot`:`${k[i]}`):'')+e;
  const T1=tf(`\\sin ${DEG(a)}`,`\\cos ${DEG(90-a)}`), T2=`\\tan ${DEG(c)}\\cdot\\tan ${DEG(90-c)}`, T3=tf(`\\cot ${DEG(d)}`,`\\tan ${DEG(90-d)}`);
  const E=K(0,T1,true)+K(1,T2,true)+K(2,T3,true);
  return QB({text:`Tính giá trị biểu thức (không dùng máy tính): ${td(`E = ${E}`)}`, tpl:eqB('E'), ans:[v],
    hint:HP+` Ngoài ra ${tm('\\tan\\alpha\\cdot\\cot\\alpha = 1')}.`,
    sol:`${tm(`\\cos ${DEG(90-a)} = \\sin ${DEG(a)}`)} nên ${tm(`${T1} = 1`)}; ${tm(`\\tan ${DEG(90-c)} = \\cot ${DEG(c)}`)} nên ${tm(`${T2} = 1`)}; ${tm(`\\tan ${DEG(90-d)} = \\cot ${DEG(d)}`)} nên ${tm(`${T3} = 1`)}. Vậy ${tm(`E = ${k[0]}${s[1]<0?' - ':' + '}${k[1]}${s[2]<0?' - ':' + '}${k[2]} =`)} ${tb(v)}.`});
};
const SV = {sin:{30:tf(1,2),45:tf(sq(2),2),60:tf(sq(3),2)}, cos:{30:tf(sq(3),2),45:tf(sq(2),2),60:tf(1,2)},
            tan:{30:tf(sq(3),3),45:'1',60:sq(3)}, cot:{30:sq(3),45:'1',60:tf(sq(3),3)}};
const SVPOOL = [tf(1,2),tf(sq(2),2),tf(sq(3),2),'1',sq(3),tf(sq(3),3)];
const SVTERMS = [['2\\sin 30^\\circ',`2\\cdot${tf(1,2)}`,1],['2\\cos 60^\\circ',`2\\cdot${tf(1,2)}`,1],['\\tan 45^\\circ','1',1],['\\cot 45^\\circ','1',1],
  ['4\\sin^2 60^\\circ',`4\\cdot\\left(${tf(sq(3),2)}\\right)^2`,3],['4\\cos^2 30^\\circ',`4\\cdot\\left(${tf(sq(3),2)}\\right)^2`,3],
  ['2\\sin^2 45^\\circ',`2\\cdot\\left(${tf(sq(2),2)}\\right)^2`,1],['\\tan^2 60^\\circ',`(${sq(3)})^2`,3],['3\\tan^2 30^\\circ',`3\\cdot\\left(${tf(sq(3),3)}\\right)^2`,1],
  ['\\cot^2 30^\\circ',`(${sq(3)})^2`,3],[`${sq(3)}\\tan 60^\\circ`,`${sq(3)}\\cdot${sq(3)}`,3],[`${sq(2)}\\cos 45^\\circ`,`${sq(2)}\\cdot${tf(sq(2),2)}`,1],['6\\sin 30^\\circ',`6\\cdot${tf(1,2)}`,3]];
const g11d = lv => {   // tỉ số lượng giác của góc đặc biệt
  const HT=`Nhớ bảng giá trị: ${tm(`\\sin 30^\\circ = \\cos 60^\\circ = ${tf(1,2)}`)}, ${tm(`\\sin 45^\\circ = \\cos 45^\\circ = ${tf(sq(2),2)}`)}, ${tm(`\\sin 60^\\circ = \\cos 30^\\circ = ${tf(sq(3),2)}`)}; ${tm('\\tan = \\dfrac{\\sin}{\\cos}')}, ${tm('\\cot = \\dfrac{\\cos}{\\sin}')}.`;
  const f=pick(FN), t=pick([30,45,60]), good=SV[f][t];
  if(lv===1) return QC({text:`${tm(`\\${f} ${DEG(t)}`)} bằng`, opts:[good,...shuffle(SVPOOL.filter(x=>x!==good)).slice(0,3)].map(tm), ans:tm(good), hint:HT,
    sol:`Theo bảng giá trị lượng giác của các góc đặc biệt: ${tm(`\\${f} ${DEG(t)} =`)} ${tb(good)}.`});
  if(lv===2) return QB({text:`Tìm góc nhọn ${tm('\\alpha')}, biết ${tm(`\\${f}\\alpha = ${good}`)}.`, tpl:`<span class="eq">${tm('\\alpha =')} [_]°</span>`, ans:[t], hint:HT,
    sol:`Vì ${tm(`\\${f} ${DEG(t)} = ${good}`)} nên ${tb(`\\alpha = ${DEG(t)}`)}.`});
  let T; do{T=shuffle(SVTERMS).slice(0,3)}while(new Set(T.map(x=>x[1])).size<3);
  const s=[1,pick([1,-1]),pick([1,-1])], v=T.reduce((a,x,i)=>a+s[i]*x[2],0);
  const J=f=>T.map((x,i)=>(i?(s[i]<0?' - ':' + '):'')+f(x)).join('');
  return QB({text:`Tính giá trị biểu thức (không dùng máy tính): ${td(`E = ${J(x=>x[0])}`)}`, tpl:eqB('E'), ans:[v], hint:HT,
    sol:`${tm(`E = ${J(x=>x[1])} = ${J(x=>x[2])} =`)} ${tb(v)}.`});
};

/* =====================================================================
   BÀI 12. Một số hệ thức giữa cạnh, góc trong tam giác vuông và ứng dụng
   ===================================================================== */
const TR = `${tm('\\text{cạnh góc vuông} = \\text{huyền}\\cdot\\sin(\\text{góc đối}) = \\text{huyền}\\cdot\\cos(\\text{góc kề})')}; ${tm('\\text{cạnh góc vuông} = \\text{cạnh kia}\\cdot\\tan(\\text{góc đối}) = \\text{cạnh kia}\\cdot\\cot(\\text{góc kề})')}`;
const g12a = lv => {   // chọn hệ thức đúng
  const N=lv===3?pick(NAMESETS):NAMESETS[0], V=lv===3?pick([1,2]):1, W=3-V, s=sides(N,V);   // hỏi cạnh s.opp (đối diện góc V)
  const L=s.opp, H=s.hyp, O=s.adj, P=N[V], Q=N[W], eq=r=>`${L} = ${r}`;
  const T={hs:`${H}\\cdot\\sin ${P}`, hc:`${H}\\cdot\\cos ${Q}`, ot:`${O}\\cdot\\tan ${P}`, oc:`${O}\\cdot\\cot ${Q}`};
  const Fz={hc2:`${H}\\cdot\\cos ${P}`, hs2:`${H}\\cdot\\sin ${Q}`, ot2:`${O}\\cdot\\tan ${Q}`, oc2:`${O}\\cdot\\cot ${P}`, ht:`${H}\\cdot\\tan ${P}`, os:`${O}\\cdot\\sin ${P}`};
  let good, bad;
  if(lv===1){ good=pick([T.hs,T.hc]); bad=[Fz.hc2,Fz.hs2,Fz.ht]; }
  else if(lv===2){ good=pick([T.ot,T.oc]); bad=[Fz.ot2,Fz.oc2,Fz.os]; }
  else { good=pick(Object.values(T)); bad=shuffle(Object.values(Fz)).slice(0,3); }
  return QC({text:`Cho tam giác ${tm(N.join(''))} vuông tại ${tm(N[0])} (hình bên). Khẳng định nào sau đây <b>đúng</b>?`, fig:rtTriSVG({n:N}),
    opts:[good,...bad].map(r=>tm(eq(r))), ans:tm(eq(good)), hint:TR,
    sol:`Cạnh ${tm(L)} đối diện góc ${tm(P)}, kề góc ${tm(Q)}. Do đó ${tm(`${L} = ${T.hs} = ${T.hc}`)} và ${tm(`${L} = ${T.ot} = ${T.oc}`)}. Đáp án: ${tb(eq(good))}.`});
};
const g12b = lv => {   // tính cạnh với góc đặc biệt
  const k=R(2,12), fg=(b,o)=>rtTriSVG({n:['A','B','C'],w:Math.tan(b*Math.PI/180),h:1,aB:`${b}°`,...o});
  const U='&nbsp;cm';
  if(lv===1){ const b=pick([30,60]), a=2*k, leg=b===30?'AC':'AB', f=b===30?'\\sin':'\\cos';
    return QB({text:`Cho tam giác ${tm('ABC')} vuông tại ${tm('A')} có ${tm(`BC = ${a}`)} cm và ${tm(`\\widehat{B} = ${DEG(b)}`)}. Tính độ dài cạnh ${tm(leg)}.`,
      fig:fg(b,{bc:`${a} cm`,[leg==='AC'?'ac':'ab']:'?'}), tpl:eqB(leg,U), ans:[k], hint:TR,
      sol:`${tm(`${leg} = BC\\cdot${f} B = ${a}\\cdot${f} ${DEG(b)} = ${a}\\cdot${tf(1,2)} = ${k}`)}. Vậy ${tb(`${leg} = ${k}\\text{ cm}`)}.`}); }
  if(lv===2){ const c=pick(['ac60','bc60','bc45']);
    if(c==='ac60') return QB({text:`Cho tam giác ${tm('ABC')} vuông tại ${tm('A')} có ${tm(`AB = ${k}`)} cm và ${tm(`\\widehat{B} = ${DEG(60)}`)}. Tính ${tm('AC')}.`,
      fig:fg(60,{ab:`${k} cm`,ac:'?'}), tpl:`<span class="eq">${tm('AC =')} [_] ${tm(sq(3))} cm</span>`, ans:[k], hint:TR,
      sol:`${tm(`AC = AB\\cdot\\tan B = ${k}\\cdot\\tan ${DEG(60)} = ${k}${sq(3)}`)}. Vậy ${tb(`AC = ${k}${sq(3)}\\text{ cm}`)}.`});
    const b=c==='bc60'?60:45;
    return QB({text:`Cho tam giác ${tm('ABC')} vuông tại ${tm('A')} có ${tm(`AB = ${k}`)} cm và ${tm(`\\widehat{B} = ${DEG(b)}`)}. Tính ${tm('BC')}.`,
      fig:fg(b,{ab:`${k} cm`,bc:'?'}), tpl:b===60?eqB('BC',U):`<span class="eq">${tm('BC =')} [_] ${tm(sq(2))} cm</span>`, ans:[b===60?2*k:k],
      hint:`${tm('AB = BC\\cdot\\cos B')}, suy ra ${tm('BC = \\dfrac{AB}{\\cos B}')}.`,
      sol:b===60?`${tm(`BC = ${tf('AB','\\cos B')} = ${tf(k,`\\cos ${DEG(60)}`)} = ${tf(k,tf(1,2))} = ${2*k}`)}. Vậy ${tb(`BC = ${2*k}\\text{ cm}`)}.`
        :`${tm(`BC = ${tf('AB','\\cos B')} = ${tf(k,tf(sq(2),2))} = ${tf(2*k,sq(2))} = ${k}${sq(2)}`)}. Vậy ${tb(`BC = ${k}${sq(2)}\\text{ cm}`)}.`}); }
  return QB({text:`Giải tam giác vuông: tam giác ${tm('ABC')} vuông tại ${tm('A')} có ${tm(`AC = ${k}`)} cm và ${tm(`\\widehat{B} = ${DEG(30)}`)}. Tính ${tm('BC')} và ${tm('AB')}.`,
    fig:fg(30,{ac:`${k} cm`,bc:'?',ab:'?'}), tpl:`<span class="eq">${tm('BC =')} [_] cm</span><br><span class="eq">${tm('AB =')} [_] ${tm(sq(3))} cm</span>`, ans:[2*k,k],
    hint:`${tm('AC = BC\\cdot\\sin B')} cho ta ${tm('BC')}; ${tm('AC = AB\\cdot\\tan B')} cho ta ${tm('AB')}.`,
    sol:`${tm(`BC = ${tf('AC','\\sin B')} = ${tf(k,tf(1,2))} = ${2*k}`)}; ${tm(`AB = ${tf('AC','\\tan B')} = ${tf(k,tf(sq(3),3))} = ${tf(3*k,sq(3))} = ${k}${sq(3)}`)}. Vậy ${tb(`BC = ${2*k}\\text{ cm}`)}, ${tb(`AB = ${k}${sq(3)}\\text{ cm}`)}.`});
};
const trig = (f,d) => Math[f==='cot'?'tan':f](d*Math.PI/180)**(f==='cot'?-1:1);
const r2 = x => Math.round(x*100)/100;
const g12c = lv => {   // giải tam giác vuông (dùng giá trị gần đúng cho sẵn)
  let b; do{b=R(20,70)}while(b===30||b===45||b===60);
  const fg=o=>rtTriSVG({n:['A','B','C'],w:Math.tan(b*Math.PI/180),h:1,aB:`${b}°`,...o});
  if(lv===1) return QB({text:`Cho tam giác ${tm('ABC')} vuông tại ${tm('A')} có ${tm(`\\widehat{B} = ${DEG(b)}`)}. Tính số đo góc ${tm('C')}.`, fig:fg({aC:'?'}),
    tpl:`<span class="eq">${tm('\\widehat{C} =')} [_]°</span>`, ans:[90-b], hint:`Trong tam giác vuông, hai góc nhọn phụ nhau: ${tm(`\\widehat{B} + \\widehat{C} = ${DEG(90)}`)}.`,
    sol:`${tm(`\\widehat{C} = ${DEG(90)} - ${DEG(b)} = ${DEG(90-b)}`)}. Vậy ${tb(`\\widehat{C} = ${DEG(90-b)}`)}.`});
  if(lv===2){ const a=R(5,30), f=pick(['sin','cos']), leg=f==='sin'?'AC':'AB', v=r2(trig(f,b)), res=a*v;
    return QB({text:`Cho tam giác ${tm('ABC')} vuông tại ${tm('A')} có ${tm(`BC = ${a}`)} cm, ${tm(`\\widehat{B} = ${DEG(b)}`)}. Biết ${tm(`\\${f} ${DEG(b)} \\approx ${tdec(v)}`)}. Tính ${tm(leg)} (làm tròn đến hàng phần mười).`,
      fig:fg({bc:`${a} cm`,[leg==='AC'?'ac':'ab']:'?'}), tpl:eqB(leg,'&nbsp;cm'), ans:ansR(res,a*trig(f,b)), hint:TR,
      sol:`${tm(`${leg} = BC\\cdot\\${f} B \\approx ${a}\\cdot ${tdec(v)} = ${tdec(res)}`)}. Vậy ${tb(`${leg} \\approx ${tdec(R1(res))}\\text{ cm}`)}.`}); }
  const c=R(4,20), t=r2(trig('tan',b)), co=r2(trig('cos',b)), ac=c*t, bc=c/co;
  return QB({text:`Cho tam giác ${tm('ABC')} vuông tại ${tm('A')} có ${tm(`AB = ${c}`)} cm, ${tm(`\\widehat{B} = ${DEG(b)}`)}. Biết ${tm(`\\tan ${DEG(b)} \\approx ${tdec(t)}`)}, ${tm(`\\cos ${DEG(b)} \\approx ${tdec(co)}`)}. Tính ${tm('AC')} và ${tm('BC')} (làm tròn đến hàng phần mười).`,
    fig:fg({ab:`${c} cm`,ac:'?',bc:'?'}), tpl:`<span class="eq">${tm('AC \\approx')} [_] cm</span><br><span class="eq">${tm('BC \\approx')} [_] cm</span>`,
    ans:[...ansR(ac,c*trig('tan',b)),...ansR(bc,c/trig('cos',b))],
    hint:`${tm('AC = AB\\cdot\\tan B')}; ${tm('AB = BC\\cdot\\cos B')} nên ${tm('BC = \\dfrac{AB}{\\cos B}')}.`,
    sol:`${tm(`AC = AB\\cdot\\tan B \\approx ${c}\\cdot ${tdec(t)} = ${tdec(ac)}`)}; ${tm(`BC = ${tf('AB','\\cos B')} \\approx ${tf(c,tdec(co))} \\approx ${tdec(Math.round(bc*1000)/1000)}`)}. Vậy ${tb(`AC \\approx ${tdec(R1(ac))}\\text{ cm}`)}, ${tb(`BC \\approx ${tdec(R1(bc))}\\text{ cm}`)}.`});
};
const g12d = lv => {   // bài toán thực tế
  if(lv===1){ if(Math.random()<.5){ const L=R(4,9), v=L/2;
      return QB({text:`Một chiếc thang dài <b>${L} m</b> dựa vào tường, thang tạo với mặt đất một góc ${tm(DEG(60))}. Hỏi chân thang cách chân tường bao nhiêu mét?`,
        fig:rtTriSVG({n:['A','B','C'],w:.5,h:.866,bc:`${L} m`,ac:'?',aC:'60°'}), tpl:'[_] m', ans:[v],
        hint:`Thang, tường và mặt đất tạo thành tam giác vuông tại chân tường ${tm('A')}. Khoảng cách cần tìm là cạnh kề với góc ${tm(DEG(60))}.`,
        sol:`${tm(`AC = BC\\cdot\\cos C = ${L}\\cdot\\cos ${DEG(60)} = ${L}\\cdot${tf(1,2)} = ${tdec(v)}`)}. Chân thang cách tường ${tb(`${tdec(v)}\\text{ m}`)}.`}); }
    const s=R(5,20);
    return QB({text:`Bóng của một cây trên mặt đất dài <b>${s} m</b>, tia nắng mặt trời tạo với mặt đất một góc ${tm(DEG(45))}. Tính chiều cao của cây.`,
      fig:rtTriSVG({n:['A','B','C'],w:1,h:1,ac:`${s} m`,ab:'?',aC:'45°'}), tpl:'[_] m', ans:[s],
      hint:`Cây (${tm('AB')}), bóng (${tm('AC')}) và tia nắng tạo thành tam giác vuông tại gốc cây ${tm('A')}. Dùng ${tm('AB = AC\\cdot\\tan C')}.`,
      sol:`${tm(`AB = AC\\cdot\\tan C = ${s}\\cdot\\tan ${DEG(45)} = ${s}\\cdot 1 = ${s}`)}. Cây cao ${tb(`${s}\\text{ m}`)}.`}); }
  let al; do{al=R(25,65)}while(al===45);
  if(lv===2){ const s=R(6,25), t=r2(trig('tan',al)), h=s*t, obj=pick(['một cột cờ','một toà nhà','một cây thông']);
    return QB({text:`Bóng của ${obj} trên mặt đất dài <b>${s} m</b>, tia nắng tạo với mặt đất góc ${tm(DEG(al))}. Biết ${tm(`\\tan ${DEG(al)} \\approx ${tdec(t)}`)}. Tính chiều cao của ${obj.replace('một ','')} (làm tròn đến hàng phần mười).`,
      fig:rtTriSVG({n:['A','B','C'],w:1,h:trig('tan',al),ac:`${s} m`,ab:'?',aC:`${al}°`}), tpl:'[_] m', ans:ansR(h,s*trig('tan',al)),
      hint:`Chiều cao ${tm('AB')}, bóng ${tm('AC')} và tia nắng tạo thành tam giác vuông tại ${tm('A')}. Chiều cao là cạnh đối, bóng là cạnh kề của góc ${tm(DEG(al))}.`,
      sol:`${tm(`AB = AC\\cdot\\tan C \\approx ${s}\\cdot ${tdec(t)} = ${tdec(h)}`)}. Chiều cao khoảng ${tb(`${tdec(R1(h))}\\text{ m}`)}.`}); }
  const L=R(30,80), hh=pick([1,1.2,1.5]), sv=r2(trig('sin',al)), H=L*sv+hh, nm=pick(NAMES);
  return QB({text:`${nm} thả diều với sợi dây dài <b>${L} m</b> (coi như căng thẳng), dây tạo với phương nằm ngang góc ${tm(DEG(al))}. Tay ${nm} cầm dây ở độ cao ${tm(tdec(hh))} m so với mặt đất. Biết ${tm(`\\sin ${DEG(al)} \\approx ${tdec(sv)}`)}. Hỏi diều bay cao bao nhiêu mét so với mặt đất (làm tròn đến hàng phần mười)?`,
    fig:rtTriSVG({n:['A','B','C'],w:trig('cos',al),h:trig('sin',al),bc:`${L} m`,ab:'?',aC:`${al}°`}), tpl:'[_] m', ans:ansR(H,L*trig('sin',al)+hh),
    hint:`Gọi ${tm('C')} là tay cầm dây, ${tm('B')} là diều, ${tm('A')} là hình chiếu của ${tm('B')} trên đường nằm ngang qua ${tm('C')}. Tính ${tm('AB')} trong tam giác vuông rồi cộng thêm độ cao của tay.`,
    sol:`${tm(`AB = BC\\cdot\\sin C \\approx ${L}\\cdot ${tdec(sv)} = ${tdec(L*sv)}`)}. Độ cao của diều: ${tm(`${tdec(L*sv)} + ${tdec(hh)} = ${tdec(H)}`)}, khoảng ${tb(`${tdec(R1(H))}\\text{ m}`)}.`});
};

lesson(4,'ti-so-luong-giac','Bài 11. Tỉ số lượng giác của góc nhọn','Định nghĩa sin, cos, tan, cot; tính tỉ số; hai góc phụ nhau; giá trị của góc đặc biệt.',[g11a,g11b,g11c,g11d]);
lesson(4,'he-thuc-canh-goc','Bài 12. Một số hệ thức giữa cạnh, góc trong tam giác vuông và ứng dụng','Hệ thức cạnh – góc; tính cạnh, giải tam giác vuông; bài toán thực tế.',[g12a,g12b,g12c,g12d]);
lesson(4,'on-tap-c4','Ôn tập chương IV','Tổng hợp: tỉ số lượng giác, góc phụ nhau, góc đặc biệt, giải tam giác vuông, ứng dụng.',[g11b,g11c,g11d,g12b,g12c,g12d]);
})();

<script>/* data/lop10.js */
/* =====================================================================
   DỮ LIỆU LỚP 10 – Toán, Kết nối tri thức
   Chương I. Mệnh đề và tập hợp (Bài 1 Mệnh đề · Bài 2 Tập hợp và các phép toán trên tập hợp)
   Chương II. Bất phương trình và hệ bất phương trình bậc nhất hai ẩn (Bài 3 · Bài 4)
   Chương III. Hệ thức lượng trong tam giác (Bài 5 · Bài 6)
   Mỗi dạng bài: lv => câu hỏi. Chọn đáp án trước rồi mới dựng đề.
   Công thức viết LaTeX: tm() trong dòng, td() riêng dòng, tb() đáp án đậm (xem core.js).
   ===================================================================== */
(() => {
const G = App.addGrade({
  id: 'lop10', name: 'Lớp 10', subject: 'Toán', book: 'Kết nối tri thức',
  topics: [ {id:1, hk:1, name:'Mệnh đề và tập hợp'}, {id:2, hk:1, name:'Bất phương trình và hệ bất phương trình bậc nhất hai ẩn'}, {id:3, hk:1, name:'Hệ thức lượng trong tam giác'} ],
});
const lesson = G.lesson;

/* ---------- Tiện ích ---------- */
const RR='\\mathbb{R}', NN='\\mathbb{N}', NS='\\mathbb{N}^*', ZZ='\\mathbb{Z}', QQ='\\mathbb{Q}';
const sR = (a,b) => pick([-1,1])*R(a,b);
const isPrime = n => { if(n<2) return false; for(let i=2;i*i<=n;i++) if(n%i===0) return false; return true; };
const isSq = n => n>=0 && Number.isInteger(Math.sqrt(n));
const TF = ['Đúng','Sai'];
const tfQ = (text, truth, hint, why) => QC({text, opts:TF, ans:truth?'Đúng':'Sai', keepOrder:true, hint,
  sol:`${why} Vậy mệnh đề <b>${truth?'đúng':'sai'}</b>.`});
const setT = a => a.length ? `\\{${a.map(x=>`{${x}}`).join(';\\ ')}\\}` : '\\varnothing';        // tập hợp LaTeX
const range = (a,b) => { const r=[]; for(let i=a;i<=b;i++) r.push(i); return r; };
const divisors = n => range(1,n).filter(d=>n%d===0);
const OPS = {'>':'\\gt','<':'\\lt','≥':'\\ge','≤':'\\le','=':'=','≠':'\\ne'};
const op_ = o => OPS[o];
const NOT = {'>':'≤','<':'≥','≥':'<','≤':'>','=':'≠','≠':'='};
const RA = '\\;\\Rightarrow\\;';

/* =====================================================================
   BÀI 1. MỆNH ĐỀ
   ===================================================================== */
// Mệnh đề (câu khẳng định có tính đúng sai xác định). Viết bằng HTML + tm().
const propPool = () => { const n=R(2,60), a=R(2,30), b=R(2,9), c=R(2,40);

    hint:`Giải phương trình tích rồi chỉ giữ các nghiệm thuộc ${tm(set)}. Các nghiệm trùng nhau chỉ tính một lần.`,
    sol:`Nghiệm: ${tm(`x = ${a},\\ x = \\pm\\sqrt{${c}}`)}. Các phần tử thuộc ${tm(set)}: ${tm(setT(rl))}. ${tm('A')} có <b>${cnt}</b> phần tử.`});
};
const g2b = lv => {   // tập con
  const L=['a','b','c','d','e','f'];
  if(lv===1){ if(Math.random()<.5){ const n=R(2,5), A=L.slice(0,n);
      return QB({text:`Tập hợp ${td(`A = ${setT(A)}`)} có bao nhiêu tập hợp con?`, tpl:'[_] tập con', ans:[2**n],
        hint:`Tập có ${tm('n')} phần tử thì có ${tm('2^n')} tập con (kể cả ${tm('\\varnothing')} và chính nó).`, sol:`${tm('A')} có ${n} phần tử nên có ${tm(`2^{${n}} = ${2**n}`)} tập con. Đáp số: ${tb(2**n)}.`}); }
    const A=shuffle(range(1,9)).slice(0,4).sort((u,v)=>u-v), z=range(1,9).find(x=>!A.includes(x)), a=pick(A);
    const good=pick([`${a} \\in A`,`\\{${a}\\} \\subset A`,'\\varnothing \\subset A']);

      hint:`Dùng ${tm('\\in')} giữa một phần tử và một tập hợp; dùng ${tm('\\subset')} giữa hai tập hợp. Tập rỗng là tập con của mọi tập hợp.`,
      sol:`${tb(good)} đúng. Chú ý: ${tm(`\\{${a}\\}`)} là tập hợp nên không viết ${tm(`\\{${a}\\} \\in A`)}; ${tm(`${z} \\notin A`)} nên ${tm(`\\{${a};\\ ${z}\\} \\not\\subset A`)}.`}); }
  if(lv===2){ const nB=R(4,6), B=range(1,nB), m=R(1,nB-2), A=B.slice(0,m);

      hint:`${tm('X')} phải chứa mọi phần tử của ${tm('A')}; với mỗi phần tử còn lại của ${tm('B')}, ${tm('X')} có thể lấy hoặc không lấy.`,
      sol:`${tm('X = A \\cup Y')} với ${tm('Y')} là tập con của ${tm(setT(B.slice(m)))} (${nB-m} phần tử). Số tập ${tm('X')} là ${tm(`2^{${nB-m}} = ${2**(nB-m)}`)}. Đáp số: ${tb(2**(nB-m))}.`}); }
  const a=R(-3,1), b=a+R(2,4), el=range(a+1,b), ne=Math.random()<.5, v=2**el.length-(ne?1:0);
  return QB({text:`Tập hợp ${td(`A = \\{x \\in ${ZZ} \\mid ${a} \\lt x \\le ${b}\\}`)} có bao nhiêu tập con${ne?' <b>khác rỗng</b>':''}?`, tpl:'[_] tập con', ans:[v],
    hint:`Liệt kê ${tm('A')} trước để biết số phần tử ${tm('n')}, rồi dùng ${tm('2^n')}${ne?' (bỏ tập rỗng)':''}.`,
    sol:`${tm(`A = ${setT(el)}`)} có ${el.length} phần tử. Số tập con${ne?' khác rỗng':''}: ${tm(`2^{${el.length}}${ne?' - 1':''} = ${v}`)}. Đáp số: ${tb(v)}.`});

const inter=(A,B)=>A.filter(x=>B.includes(x)), uni=(A,B)=>[...new Set([...A,...B])].sort((u,v)=>u-v), diff=(A,B)=>A.filter(x=>!B.includes(x));
const g2c = lv => {   // phép toán trên tập hữu hạn
  let A,B,E=range(1,10);

  else if(lv===2){ [name,val]=pick(ops.slice(2)); }
  else { const c=pick([['C_E A',diff(E,A)],['C_E (A \\cup B)',diff(E,uni(A,B))],['(A \\setminus B) \\cup (B \\setminus A)',uni(diff(A,B),diff(B,A))],['C_E A \\cap B',inter(diff(E,A),B)]]);
    [name,val]=c; pool=[...pool,diff(E,A),diff(E,B),diff(E,inter(A,B))]; }

    hint:`${tm('A \\cap B')}: phần tử thuộc cả ${tm('A')} và ${tm('B')}. ${tm('A \\cup B')}: thuộc ${tm('A')} hoặc ${tm('B')}. ${tm('A \\setminus B')}: thuộc ${tm('A')} nhưng không thuộc ${tm('B')}. ${tm('C_E A = E \\setminus A')}.`,
    sol:`${tb(`${name} = ${good}`)}.`});
};
// Khoảng, đoạn, nửa khoảng
const ivs = (l,lc,r,rc) => `${lc&&l!==-Infinity?'[':'('}{${l===-Infinity?'-\\infty':l}};\\ {${r===Infinity?'+\\infty':r}}${rc&&r!==Infinity?']':')'}`;
const g2d = lv => {
  if(lv<3){ const a=R(-8,2), c=a+R(1,5), b=c+R(1,5), d=b+R(1,5);
    const alc=Math.random()<.5, arc=Math.random()<.5, blc=Math.random()<.5, brc=Math.random()<.5;
    const A=ivs(a,alc,b,arc), B=ivs(c,blc,d,brc);
    const ops={ 'A \\cap B':[c,blc,b,arc], 'A \\cup B':[a,alc,d,brc], 'A \\setminus B':[a,alc,c,!blc], 'B \\setminus A':[b,!arc,d,brc] };
    const name=lv===1?pick(['A \\cap B','A \\cup B']):pick(['A \\setminus B','B \\setminus A']), [l,lc,r,rc]=ops[name], good=ivs(l,lc,r,rc);
    const W=[...new Set([ivs(l,!lc,r,rc),ivs(l,lc,r,!rc),ivs(l,!lc,r,!rc),...Object.values(ops).map(v=>ivs(...v))])].filter(s=>s!==good);
    return QC({text:`Cho ${td(`A = ${A},\\quad B = ${B}`)} Tìm ${tm(name)}.`, opts:[good,...shuffle(W).slice(0,3)].map(tm), ans:tm(good),
      hint:`Vẽ hai tập trên cùng một trục số. Dấu ${tm('[\\ ]')} là lấy đầu mút, dấu ${tm('(\\ )')} là không lấy. Với ${tm('A \\setminus B')}: điểm đầu mút nào thuộc ${tm('B')} thì phải bỏ đi.`,
      sol:`Biểu diễn trên trục số ta được ${tb(`${name} = ${good}`)}.`}); }
  const t=pick(['bounded','half']);
  if(t==='bounded'){ const a=R(-6,2), b=a+R(2,7), lc=Math.random()<.5, rc=Math.random()<.5;
    const S=(p,q)=>`${ivs(-Infinity,false,a,p)} \\cup ${ivs(b,q,Infinity,false)}`, good=S(!lc,!rc);
    return QC({text:`Cho ${td(`A = ${ivs(a,lc,b,rc)}`)} Tìm ${tm(`C_${RR} A`)}.`, opts:[good,S(lc,rc),S(!lc,rc),S(lc,!rc)].map(tm), ans:tm(good),
      hint:`${tm(`C_${RR} A = ${RR} \\setminus A`)} gồm hai nửa khoảng hai bên. Đầu mút nào thuộc ${tm('A')} thì không thuộc phần bù (và ngược lại).`, sol:`${tb(`C_${RR} A = ${good}`)}.`}); }
  const a=R(-6,6), c=Math.random()<.5, left=Math.random()<.5;
  const A=left?ivs(-Infinity,false,a,c):ivs(a,c,Infinity,false), good=left?ivs(a,!c,Infinity,false):ivs(-Infinity,false,a,!c);
  const W=left?[ivs(a,c,Infinity,false),ivs(-Infinity,false,a,!c),ivs(-Infinity,false,a,c)]:[ivs(-Infinity,false,a,c),ivs(a,!c,Infinity,false),ivs(a,c,Infinity,false)];
  return QC({text:`Cho ${td(`A = ${A}`)} Tìm ${tm(`C_${RR} A`)}.`, opts:[good,...W].map(tm), ans:tm(good),
    hint:'Phần bù của một nửa khoảng là nửa khoảng “phía bên kia”; đầu mút đổi từ lấy thành không lấy và ngược lại.', sol:`${tb(`C_${RR} A = ${good}`)}.`});
};
const g2e = lv => {   // bài toán thực tế (biểu đồ Ven)
  const nm=pick([['bóng đá','cầu lông'],['Toán','Văn'],['câu lạc bộ Tiếng Anh','câu lạc bộ Tin học'],['bơi','cờ vua']]);
  if(lv<3){ const both=R(3,10), a=both+R(4,15), b=both+R(4,15), none=R(0,8), N=a+b-both+none;
    if(lv===1) return QB({text:`Lớp 10A có ${a} bạn thích ${nm[0]}, ${b} bạn thích ${nm[1]}, trong đó ${both} bạn thích cả hai. Hỏi có bao nhiêu bạn thích ít nhất một trong hai môn đó?`,
      tpl:'[_] bạn', ans:[a+b-both], hint:`Dùng ${tm('|A \\cup B| = |A| + |B| - |A \\cap B|')} (các bạn thích cả hai bị đếm hai lần).`, sol:`${tm(`${a} + ${b} - ${both} = ${a+b-both}`)}. Đáp số: ${tb(a+b-both)} bạn.`});
    const ask=pick(['none','only']);
    return ask==='none'
      ? QB({text:`Lớp 10A có ${N} học sinh, trong đó ${a} bạn thích ${nm[0]}, ${b} bạn thích ${nm[1]}, ${both} bạn thích cả hai. Hỏi có bao nhiêu bạn không thích cả hai?`,
          tpl:'[_] bạn', ans:[none], hint:'Tính số bạn thích ít nhất một môn trước, rồi lấy sĩ số trừ đi.', sol:`Thích ít nhất một môn: ${tm(`${a} + ${b} - ${both} = ${a+b-both}`)}. Không thích cả hai: ${tm(`${N} - ${a+b-both} = ${none}`)}. Đáp số: ${tb(none)} bạn.`})
      : QB({text:`Lớp 10A có ${a} bạn thích ${nm[0]}, ${b} bạn thích ${nm[1]}, trong đó ${both} bạn thích cả hai. Hỏi có bao nhiêu bạn chỉ thích ${nm[0]}?`,
          tpl:'[_] bạn', ans:[a-both], hint:`“Chỉ thích ${nm[0]}” là thuộc ${tm('A')} nhưng không thuộc ${tm('B')}: ${tm('|A \\setminus B| = |A| - |A \\cap B|')}.`, sol:`${tm(`${a} - ${both} = ${a-both}`)}. Đáp số: ${tb(a-both)} bạn.`}); }
  const r=[R(2,8),R(2,8),R(2,8),R(1,5),R(1,5),R(1,5),R(1,4)]; // chỉ A, chỉ B, chỉ C, AB, BC, CA, ABC
  const A=r[0]+r[3]+r[5]+r[6], B=r[1]+r[3]+r[4]+r[6], C=r[2]+r[4]+r[5]+r[6], AB=r[3]+r[6], BC=r[4]+r[6], CA=r[5]+r[6], ABC=r[6], U=r.reduce((s,x)=>s+x,0);
  const ask=pick(['union','one']), v=ask==='union'?U:r[0]+r[1]+r[2];
  return QB({text:`Trong một nhóm học sinh: ${A} bạn giỏi Toán, ${B} bạn giỏi Lí, ${C} bạn giỏi Hoá; ${AB} bạn giỏi Toán và Lí, ${BC} bạn giỏi Lí và Hoá, ${CA} bạn giỏi Hoá và Toán; ${ABC} bạn giỏi cả ba môn. Hỏi có bao nhiêu bạn ${ask==='union'?'giỏi ít nhất một môn':'giỏi <b>đúng một</b> môn'}?`,
    tpl:'[_] bạn', ans:[v],
    hint:ask==='union'?tm('|A \\cup B \\cup C| = |A| + |B| + |C| - |A \\cap B| - |B \\cap C| - |C \\cap A| + |A \\cap B \\cap C|'):'Vẽ biểu đồ Ven, điền số từ trong ra ngoài: phần giữa (cả ba) → phần chỉ hai môn → phần chỉ một môn.',
    sol:ask==='union'?`${tm(`${A} + ${B} + ${C} - ${AB} - ${BC} - ${CA} + ${ABC} = ${U}`)}. Đáp số: ${tb(U)} bạn.`:`Chỉ giỏi Toán: ${tm(`${A} - ${AB} - ${CA} + ${ABC} = ${r[0]}`)}; chỉ Lí: ${r[1]}; chỉ Hoá: ${r[2]}. Tổng: ${tb(v)} bạn.`});
};

/* =====================================================================
   CHƯƠNG II – BÀI 3. Bất phương trình bậc nhất hai ẩn
   Quy ước KNTT: miền nghiệm là phần KHÔNG bị gạch; bờ nét đứt = không thuộc miền nghiệm.
   Một bất phương trình được lưu dạng [a, b, c, op] nghĩa là ax + by op c.
   ===================================================================== */
const OP4 = ['<','>','≤','≥'];
const FLIP = {'<':'>','>':'<','≤':'≥','≥':'≤'};
const STRICT = {'<':'≤','≤':'<','>':'≥','≥':'>'};
const L2 = (a,b) => tpoly([a,'x'],[b,'y']);
const bpt = (a,b,c,op) => `${L2(a,b)} ${op_(op)} ${c}`;
const bptR = r => bpt(...r);
const test = (v,op,c) => op==='<'?v<c-1e-9:op==='>'?v>c+1e-9:op==='≤'?v<=c+1e-9:v>=c-1e-9;
const sat = ([a,b,c,op],x,y) => test(a*x+b*y,op,c);
const P2 = (x,y) => `({${x}};\\,{${y}})`;
const hatchOf = ([a,b,c,op]) => (op==='<'||op==='≤') ? [a,b,c] : [-a,-b,-c];      // gạch phần KHÔNG thoả
const lineOf = ([a,b,c,op],lab) => [a,b,c,op==='<'||op==='>',lab];
const sub2 = (a,b,x,y) => `${a}\\cdot${tp(x)} ${b<0?'-':'+'} ${Math.abs(b)}\\cdot${tp(y)}`;
const cf = c => Math.abs(c)===1 ? '' : Math.abs(c);
// đường thẳng qua (p;0) và (0;q): qx + py = pq, rút gọn
const byIntercepts = (p,q) => { let a=q, b=p, c=p*q; const g=gcd(gcd(Math.abs(a),Math.abs(b)),Math.abs(c)); a/=g; b/=g; c/=g; if(a<0){a=-a;b=-b;c=-c;} return [a,b,c]; };
const rowC = (a,b,x,y,op,lo,hi) => { const v=a*x+b*y; const m=R(lo,hi); return op==='<'?v+Math.max(1,m):op==='≤'?v+m:op==='>'?v-Math.max(1,m):v-m; }; // hằng số c để (x;y) thoả
const view = (xs,ys) => [[Math.min(-1,...xs)-(Math.min(...xs)<0?1:0), Math.max(5,...xs)+1],[Math.min(-1,...ys)-(Math.min(...ys)<0?1:0), Math.max(5,...ys)+1]];
const gridPts = (lo,hi) => { const out=[]; for(let x=lo;x<=hi;x++) for(let y=lo;y<=hi;y++) out.push([x,y]); return shuffle(out); };
const DEF_BPT = `Bất phương trình bậc nhất hai ẩn có dạng ${tm('ax + by \\lt c')} (hoặc ${tm('\\gt,\\ \\le,\\ \\ge')}), trong đó ${tm('a, b')} không đồng thời bằng 0.`;
const MN = `Vẽ đường thẳng ${tm('d: ax + by = c')}, lấy một điểm không nằm trên ${tm('d')} (thường là gốc ${tm('O')}) thay vào: nếu thoả mãn thì nửa mặt phẳng chứa điểm đó là miền nghiệm. Bờ ${tm('d')} thuộc miền nghiệm khi có dấu “=” (${tm('\\le, \\ge')}) và được vẽ nét liền.`;

const nonLin = (op) => { const a=R(1,5), b=R(1,5), c=R(1,9), o=op_(op); return shuffle([
  {s:`${tpoly([a,'x^2'],[b,'y'])} ${o} ${c}`, why:`có ${tm('x^2')}`},
  {s:`${tpoly([a,'xy'],[b,'x'])} ${o} ${c}`, why:`có tích ${tm('xy')}`},
  {s:`${tf(a,'x')} + ${b===1?'':b}y ${o} ${c}`, why:'có ẩn ở mẫu'},
  {s:`${tpoly([a,'x'],[b,'y^2'])} ${o} ${c}`, why:`có ${tm('y^2')}`},
  {s:`0x + 0y ${o} ${c}`, why:`${tm('a = b = 0')}`, zero:true},
]); };
const g3a = lv => {   // nhận biết
  const op=pick(OP4), a=sR(1,6), b=sR(1,6), c=R(-9,9);
  const goods=[bpt(a,b,c,op), `${tpoly([a,'x'],[b,'y'],[sR(1,9),''])} ${op_(op)} 0`, `${R(2,5)}(x - ${R(1,5)}) ${op_(op)} ${poly2(b)}`, `${tpoly([R(2,5),'x'])} ${op_(op)} ${tpoly([sR(1,5),'y'],[R(1,9),''])}`];
  const W=nonLin(op);
  if(lv<3){ const good=lv===1?goods[0]:pick(goods), bad=(lv===1?W.filter(w=>!w.zero):W).slice(0,3).map(w=>w.s);
    return QC({text:'Bất phương trình nào sau đây là <b>bất phương trình bậc nhất hai ẩn</b>?', opts:[good,...bad].map(tm), ans:tm(good), hint:DEF_BPT,
      sol:`${tb(good)} đưa được về dạng ${tm('ax + by \\lt c')} (hoặc ${tm('\\gt,\\ \\le,\\ \\ge')}) với ${tm('a, b')} không đồng thời bằng 0. Các bất phương trình còn lại có ${tm('x^2')}, ${tm('y^2')}, tích ${tm('xy')}, ẩn ở mẫu hoặc ${tm('a = b = 0')}.`}); }
  const w=W[0];
  return QC({text:'Bất phương trình nào sau đây <b>không phải</b> là bất phương trình bậc nhất hai ẩn?', opts:[w.s,...shuffle(goods).slice(0,3)].map(tm), ans:tm(w.s), hint:DEF_BPT,
    sol:`${tb(w.s)} không phải bất phương trình bậc nhất hai ẩn vì ${w.why}.`});
};
const poly2 = b => tpoly([b,'y']);
const g3b = lv => {   // nghiệm của bất phương trình
  if(lv<3){ const op=pick(OP4), a=lv===1?R(1,5):sR(1,5), b=lv===1?R(1,5):sR(1,5), lo=lv===1?0:-4, hi=lv===1?5:4, x=R(lo,hi), y=R(lo,hi), c=rowC(a,b,x,y,op,0,3), r=[a,b,c,op];
    const bad=gridPts(lo,hi).filter(([p,q])=>!sat(r,p,q)).slice(0,3);
    if(bad.length<3) return g3b(lv);
    return QC({text:`Cặp số nào sau đây là nghiệm của bất phương trình ${td(bptR(r))}`, opts:[P2(x,y),...bad.map(([p,q])=>P2(p,q))].map(tm), ans:tm(P2(x,y)),

  const {rows,V}=genPoly(), [,, [a1,b1,c1], [a2,b2,c2]]=rows;
  const al=pick([20,30,40,50]), be=pick([30,40,50,60].filter(v=>v!==al));
  const story=`Một xưởng làm hai loại sản phẩm I và II. Mỗi sản phẩm I cần ${a1} giờ trên máy A và ${a2} giờ trên máy B; mỗi sản phẩm II cần ${b1} giờ trên máy A và ${b2} giờ trên máy B. Mỗi ngày máy A làm được <b>tối đa ${c1} giờ</b>, máy B <b>tối đa ${c2} giờ</b>. Gọi ${tm('x, y')} là số sản phẩm I, II làm trong một ngày.`;
  const good=sysR(rows);
  if(lv===1){ const opts=[...new Set([good, sysR([X0,Y0,[a1,b1,c1,'≥'],[a2,b2,c2,'≥']]), sysR([X0,Y0,[a1,a2,c1,'≤'],[b1,b2,c2,'≤']]), sysR([X0,Y0,[b1,a1,c1,'≤'],[b2,a2,c2,'≤']]), sysR([X0,Y0,[a1,b1,c2,'≤'],[a2,b2,c1,'≤']]), sysR([X0,Y0,[a1,b1,c1,'≤'],[a2,b2,c2,'≥']])])].slice(0,4);
    return QC({text:`${story} Hệ bất phương trình nào mô tả điều kiện của bài toán?`, opts:opts.map(tm), ans:tm(good),
      hint:`Mỗi máy cho một bất phương trình: (giờ cho sản phẩm I)·${tm('x')} + (giờ cho sản phẩm II)·${tm('y')} ${tm('\\le')} số giờ tối đa. Nhớ thêm ${tm('x \\ge 0,\\ y \\ge 0')}.`,
      sol:`Máy A: ${tm(`${L2(a1,b1)} \\le ${c1}`)}; máy B: ${tm(`${L2(a2,b2)} \\le ${c2}`)}; cùng với ${tm('x \\ge 0,\\ y \\ge 0')}. Đáp án: ${tb(good)}.`}); }
  const {best,table}=optSol(V,al,be,true), vt=V.map(([n,x,y])=>tm(`${n}${P2(x,y)}`)).join(', ');
  return QB({text:`${story} Tiền lãi mỗi sản phẩm I là ${al} nghìn đồng, mỗi sản phẩm II là ${be} nghìn đồng.`+(lv===2?` Biết miền nghiệm của hệ điều kiện là tứ giác ${tm('OABC')} với ${vt}.`:'')+' Hỏi mỗi ngày xưởng lãi <b>nhiều nhất</b> bao nhiêu?',
    tpl:'[_] nghìn đồng', ans:[best], wide:true,
    hint:`Tiền lãi ${tm(`F = ${al}x + ${be}y`)} (nghìn đồng). `+OPT_HINT+(lv===3?` Trước hết lập hệ bất phương trình và tìm các đỉnh của miền nghiệm.`:''),
    sol:`${lv===3?`Hệ điều kiện ${tm(good)}; miền nghiệm là tứ giác ${tm('OABC')} với ${vt}. `:''}Tiền lãi ${tm(`F = ${al}x + ${be}y`)}: ${table}. Lãi nhiều nhất <b>${fmt(best)} nghìn đồng</b>.`});
};

lesson(2,'bat-phuong-trinh-hai-an','Bài 3. Bất phương trình bậc nhất hai ẩn','Nhận biết; nghiệm của bất phương trình; miền nghiệm trên mặt phẳng toạ độ; bài toán thực tế.',[g3a,g3b,g3c,g3d]);
lesson(2,'he-bat-phuong-trinh-hai-an','Bài 4. Hệ bất phương trình bậc nhất hai ẩn','Nhận biết hệ; nghiệm của hệ; miền nghiệm (hình); giá trị lớn nhất, nhỏ nhất của F = ax + by; bài toán tối ưu.',[g4a,g4b,g4c,g4d,g4e]);

/* =====================================================================
   CHƯƠNG III – HỆ THỨC LƯỢNG TRONG TAM GIÁC (Bài 5 · Bài 6)
   Viết trong khối { } để tên hằng không trùng với các chương trước.
   ===================================================================== */
{
const DG = d => `${d}^\\circ`;
const H = tf(1,2), R2 = tf('\\sqrt{2}',2), R3 = tf('\\sqrt{3}',2), T3 = tf('\\sqrt{3}',3), S3 = '\\sqrt{3}';
const neg = v => v === '0' ? '0' : '-' + v;
const VAL = {                                   // giá trị lượng giác (LaTeX); null = không xác định
  sin:{0:'0',30:H,45:R2,60:R3,90:'1',120:R3,135:R2,150:H,180:'0'},
  cos:{0:'1',30:R3,45:R2,60:H,90:'0',120:neg(H),135:neg(R2),150:neg(R3),180:'-1'},
  tan:{0:'0',30:T3,45:'1',60:S3,90:null,120:neg(S3),135:'-1',150:neg(T3),180:'0'},
  cot:{0:null,30:S3,45:'1',60:T3,90:'0',120:neg(T3),135:'-1',150:neg(S3),180:null},
};
const NUM = {sin:d=>Math.sin(d*Math.PI/180), cos:d=>Math.cos(d*Math.PI/180)};
const POOLV = ['0','1','-1',H,neg(H),R2,neg(R2),R3,neg(R3),S3,neg(S3),T3,neg(T3)];
const blank = v => `<span class="eq">${tm(`${v} =`)} [_]</span>`;
const fblank = v => `<span class="eq">${tm(`${v} =`)} [F]</span>`;
const TABLE = `${tm(`\\sin(180^\\circ - \\alpha) = \\sin\\alpha`)}, ${tm(`\\cos(180^\\circ - \\alpha) = -\\cos\\alpha`)}, ${tm(`\\tan(180^\\circ - \\alpha) = -\\tan\\alpha`)}, ${tm(`\\cot(180^\\circ - \\alpha) = -\\cot\\alpha`)}`;
const TRIP = [[3,4,5],[5,12,13],[8,15,17],[7,24,25],[20,21,29]];

/* ---------------- BÀI 5. Giá trị lượng giác của một góc từ 0° đến 180° ---------------- */
const g5a = lv => {   // giá trị lượng giác của góc đặc biệt
  const hint = `Dùng bảng giá trị của ${tm('0^\\circ, 30^\\circ, 45^\\circ, 60^\\circ, 90^\\circ')} và công thức góc bù: ${TABLE}.`;
  if(lv < 3){ let f, d; do{ f = pick(['sin','cos','tan','cot']); d = pick(lv===1 ? [0,30,45,60,90] : [120,135,150,180]); }while(VAL[f][d] == null);
    const good = VAL[f][d], opp = good.startsWith('-') ? good.slice(1) : neg(good);
    const others = [...new Set([opp, ...shuffle(POOLV)])].filter(v => v !== good).slice(0,3);
    return QC({text:`${tm(`\\${f} ${DG(d)}`)} bằng`, opts:[good,...others].map(tm), ans:tm(good), hint,
      sol:(d > 90 ? `${tm(`\\${f} ${DG(d)} = ${f==='sin'?'':'-'}\\${f} ${DG(180-d)}`)} ${tm('=')} ` : `Theo bảng giá trị: ${tm(`\\${f} ${DG(d)} =`)} `) + `${tb(good)}.`}); }
  const bad = pick([['tan',90],['cot',0],['cot',180]]), goods = shuffle([['sin',90],['cos',90],['tan',0],['cot',90],['tan',180],['sin',180],['cos',0]]).slice(0,3);
  const S = ([f,d]) => `\\${f} ${DG(d)}`;
  return QC({text:'Giá trị lượng giác nào sau đây <b>không xác định</b>?', opts:[bad,...goods].map(x => tm(S(x))), ans:tm(S(bad)),
    hint:`${tm('\\tan\\alpha = \\dfrac{\\sin\\alpha}{\\cos\\alpha}')} chỉ xác định khi ${tm('\\cos\\alpha \\ne 0')}; ${tm('\\cot\\alpha = \\dfrac{\\cos\\alpha}{\\sin\\alpha}')} chỉ xác định khi ${tm('\\sin\\alpha \\ne 0')}.`,
    sol:`${tm(S(bad))}: ${bad[0]==='tan' ? tm('\\cos 90^\\circ = 0') : tm(`\\sin ${DG(bad[1])} = 0`)} nên ${tb(S(bad))} không xác định.`});
};
const g5b = lv => {   // hai góc bù nhau
  let a; do{ a = R(10,80) }while(a === 45);
  if(lv === 1){ const f = pick(['sin','cos','tan','cot']), sgn = f === 'sin' ? '' : '-';
    return QB({text:'Điền số thích hợp vào ô trống:', tpl:`<span class="eq">${tm(`\\${f} ${DG(180-a)} = ${sgn}\\${f}`)} [_]°</span>`, ans:[a],
      hint:`Hai góc bù nhau có tổng ${tm('180^\\circ')}. ${TABLE}.`, sol:`${tm(`\\${f} ${DG(180-a)} = \\${f}(180^\\circ - ${DG(a)}) = ${sgn}\\${f} ${DG(a)}`)}. Số cần điền: ${tb(a)}.`}); }
  if(lv === 2){ const b = 180 - a;
    const T = [`\\sin ${DG(b)} = \\sin ${DG(a)}`, `\\cos ${DG(b)} = -\\cos ${DG(a)}`, `\\tan ${DG(b)} = -\\tan ${DG(a)}`, `\\cot ${DG(b)} = -\\cot ${DG(a)}`];
    const F = [`\\sin ${DG(b)} = -\\sin ${DG(a)}`, `\\cos ${DG(b)} = \\cos ${DG(a)}`, `\\tan ${DG(b)} = \\tan ${DG(a)}`, `\\cot ${DG(b)} = \\cot ${DG(a)}`, `\\sin ${DG(b)} = \\cos ${DG(a)}`];
    const good = pick(T);
    return QC({text:'Khẳng định nào sau đây <b>đúng</b>?', opts:[good,...shuffle(F).slice(0,3)].map(tm), ans:tm(good), hint:TABLE + '.',
      sol:`${tm(`${DG(a)} + ${DG(b)} = 180^\\circ`)} (hai góc bù nhau) nên ${tb(good)}.`}); }
  let b, c; do{ b = R(10,80); c = R(10,80) }while(new Set([a,b,c]).size < 3 || b === 45 || c === 45);
  const k = [R(1,3),R(1,3),R(1,3)], s = [1,pick([1,-1]),pick([1,-1])];
  const T = [[tf(`\\sin ${DG(180-a)}`,`\\sin ${DG(a)}`), 1], [tf(`\\cos ${DG(180-b)}`,`\\cos ${DG(b)}`), -1], [tf(`\\tan ${DG(c)}`,`\\tan ${DG(180-c)}`), -1]];
  const v = T.reduce((t,[,x],i) => t + s[i]*k[i]*x, 0);
  const E = T.map(([e],i) => (i ? (s[i]<0?' - ':' + ') : '') + (k[i]>1 ? `${k[i]}\\cdot` : '') + e).join('');
  const E2 = T.map(([,x],i) => (i ? (s[i]<0?' - ':' + ') : '') + (k[i]>1 ? `${k[i]}\\cdot` : '') + tp(x)).join('');
  return QB({text:`Tính giá trị biểu thức (không dùng máy tính): ${td(`E = ${E}`)}`, tpl:blank('E'), ans:[v], hint:TABLE + '.',
    sol:`${tm(`\\sin ${DG(180-a)} = \\sin ${DG(a)}`)}; ${tm(`\\cos ${DG(180-b)} = -\\cos ${DG(b)}`)}; ${tm(`\\tan ${DG(180-c)} = -\\tan ${DG(c)}`)}. Các phân số lần lượt bằng ${tm('1,\\ -1,\\ -1')}. ${tm(`E = ${E2} =`)} ${tb(v)}.`});
};
const g5c = lv => {   // dấu và tính giá trị khi biết một giá trị
  if(lv === 1){ const T = ['\\sin\\alpha \\gt 0','\\cos\\alpha \\lt 0','\\tan\\alpha \\lt 0','\\cot\\alpha \\lt 0'], F = ['\\sin\\alpha \\lt 0','\\cos\\alpha \\gt 0','\\tan\\alpha \\gt 0','\\cot\\alpha \\gt 0'];
    const good = pick(T);
    return QC({text:`Cho ${tm('\\alpha')} là góc tù (${tm('90^\\circ \\lt \\alpha \\lt 180^\\circ')}). Khẳng định nào sau đây đúng?`, opts:[good,...shuffle(F).slice(0,3)].map(tm), ans:tm(good),
      hint:`Điểm ${tm('M(x_0;\\,y_0)')} trên nửa đường tròn đơn vị với góc tù có hoành độ âm, tung độ dương: ${tm('\\sin\\alpha = y_0,\\ \\cos\\alpha = x_0')}.`,
      sol:`Với góc tù: ${tm('\\sin\\alpha \\gt 0')}, ${tm('\\cos\\alpha \\lt 0')} nên ${tm('\\tan\\alpha \\lt 0')}, ${tm('\\cot\\alpha \\lt 0')}. Đáp án: ${tb(good)}.`}); }
  const [p,q,h] = pick(TRIP), sw = Math.random() < .5, o = sw ? p : q, a = sw ? q : p;   // sin = o/h, |cos| = a/h
  if(lv === 2){ const givenSin = Math.random() < .5;
    return givenSin
      ? QB({text:`Cho ${tm(`\\sin\\alpha = ${tf(o,h)}`)} với ${tm('90^\\circ \\lt \\alpha \\lt 180^\\circ')}. Tính ${tm('\\cos\\alpha')}.`, tpl:fblank('\\cos\\alpha'), ans:[{frac:[-a,h],mode:'eq'}],
          hint:`Dùng ${tm('\\sin^2\\alpha + \\cos^2\\alpha = 1')}; góc tù nên ${tm('\\cos\\alpha \\lt 0')}.`,
          sol:`${tm(`\\cos^2\\alpha = 1 - ${tf(o*o,h*h)} = ${tf(a*a,h*h)}`)}; vì ${tm('\\alpha')} tù nên ${tm(`\\cos\\alpha = `)}${tb(`-${tf(a,h)}`)}.`})
      : QB({text:`Cho ${tm(`\\cos\\alpha = -${tf(a,h)}`)} với ${tm('0^\\circ \\le \\alpha \\le 180^\\circ')}. Tính ${tm('\\sin\\alpha')}.`, tpl:fblank('\\sin\\alpha'), ans:[{frac:[o,h],mode:'eq'}],
          hint:`Dùng ${tm('\\sin^2\\alpha + \\cos^2\\alpha = 1')}; với ${tm('0^\\circ \\le \\alpha \\le 180^\\circ')} thì ${tm('\\sin\\alpha \\ge 0')}.`,
          sol:`${tm(`\\sin^2\\alpha = 1 - ${tf(a*a,h*h)} = ${tf(o*o,h*h)}`)}; vì ${tm('\\sin\\alpha \\ge 0')} nên ${tm('\\sin\\alpha = ')}${tb(tf(o,h))}.`}); }
  const askTan = Math.random() < .5;
  return askTan
    ? QB({text:`Cho ${tm(`\\cos\\alpha = -${tf(a,h)}`)} với ${tm('0^\\circ \\le \\alpha \\le 180^\\circ')}. Tính ${tm('\\tan\\alpha')}.`, tpl:fblank('\\tan\\alpha'), ans:[{frac:[-o,a],mode:'eq'}],
        hint:`Tính ${tm('\\sin\\alpha')} từ ${tm('\\sin^2\\alpha + \\cos^2\\alpha = 1')} (chú ý ${tm('\\sin\\alpha \\ge 0')}), rồi ${tm('\\tan\\alpha = \\dfrac{\\sin\\alpha}{\\cos\\alpha}')}.`,
        sol:`${tm(`\\sin\\alpha = \\sqrt{1 - ${tf(a*a,h*h)}} = ${tf(o,h)}`)}; ${tm(`\\tan\\alpha = ${tf(o,h)} : \\left(-${tf(a,h)}\\right) = `)}${tb(`-${tf(o,a)}`)}.`})
    : QB({text:`Cho ${tm(`\\tan\\alpha = -${tf(o,a)}`)} với ${tm('0^\\circ \\le \\alpha \\le 180^\\circ')}. Tính ${tm('\\cos\\alpha')}.`, tpl:fblank('\\cos\\alpha'), ans:[{frac:[-a,h],mode:'eq'}],
        hint:`${tm('\\tan\\alpha \\lt 0')} nên ${tm('\\alpha')} tù, ${tm('\\cos\\alpha \\lt 0')}. Dùng ${tm('1 + \\tan^2\\alpha = \\dfrac{1}{\\cos^2\\alpha}')}.`,
        sol:`${tm(`\\dfrac{1}{\\cos^2\\alpha} = 1 + ${tf(o*o,a*a)} = ${tf(h*h,a*a)}${'\\;\\Rightarrow\\;'}\\cos^2\\alpha = ${tf(a*a,h*h)}`)}; ${tm('\\alpha')} tù nên ${tm('\\cos\\alpha = ')}${tb(`-${tf(a,h)}`)}.`});
};
const TERMS5 = [['2\\sin 150^\\circ',`2\\cdot${H}`,1],['2\\cos 120^\\circ',`2\\cdot\\left(${neg(H)}\\right)`,-1],['\\tan 135^\\circ','-1',-1],['\\cot 135^\\circ','-1',-1],
  ['4\\sin^2 120^\\circ',`4\\cdot\\left(${R3}\\right)^2`,3],['2\\cos^2 135^\\circ',`2\\cdot\\left(${neg(R2)}\\right)^2`,1],[`${S3}\\tan 150^\\circ`,`${S3}\\cdot\\left(${neg(T3)}\\right)`,-1],
  [`${S3}\\cot 150^\\circ`,`${S3}\\cdot(${neg(S3)})`,-3],['\\cos 180^\\circ','-1',-1],['\\sin 90^\\circ','1',1],['\\cos 0^\\circ','1',1],['2\\sin 30^\\circ',`2\\cdot${H}`,1],['\\tan 45^\\circ','1',1],['4\\cos^2 150^\\circ',`4\\cdot\\left(${neg(R3)}\\right)^2`,3]];
const g5d = lv => {   // tính giá trị biểu thức
  const n = lv === 1 ? 2 : 3, pool = lv === 1 ? TERMS5.filter(t => !/\^2|\\sqrt/.test(t[0])) : TERMS5;
  const T = shuffle(pool).slice(0,n), s = [1, pick([1,-1]), pick([1,-1])], v = T.reduce((t,x,i) => t + s[i]*x[2], 0);
  const J = f => T.map((x,i) => (i ? (s[i]<0?' - ':' + ') : '') + f(x)).join('');
  return QB({text:`Tính giá trị biểu thức (không dùng máy tính): ${td(`E = ${J(x => x[0])}`)}`, tpl:blank('E'), ans:[v],
    hint:`Thay giá trị lượng giác của từng góc (dùng bảng giá trị đặc biệt và góc bù). Chú ý ${tm('\\sin^2\\alpha = (\\sin\\alpha)^2')}.`,
    sol:`${tm(`E = ${J(x => x[1].startsWith('-') ? `(${x[1]})` : x[1])} = ${J(x => tp(x[2]))} =`)} ${tb(v)}.`});
};

/* ---------------- BÀI 6. Hệ thức lượng trong tam giác ---------------- */
const isSqN = n => n > 0 && Number.isInteger(Math.sqrt(n));
const pairs = (A, lo=2, hi=16) => { const out = []; for(let b = lo; b <= hi; b++) for(let c = lo; c <= hi; c++){ if(b === c) continue;
  const a2 = A === 60 ? b*b + c*c - b*c : A === 120 ? b*b + c*c + b*c : b*b + c*c; if(isSqN(a2) && (A !== 90 || true)) out.push([b,c,Math.sqrt(a2)]); } return out; };
const P60 = pairs(60), P120 = pairs(120), P90 = pairs(90);
const COS = {60:'\\dfrac{1}{2}', 120:'-\\dfrac{1}{2}', 90:'0'};
const lawA = (b,c,A) => A === 60 ? `${b}^2 + ${c}^2 - 2\\cdot ${b}\\cdot ${c}\\cdot ${COS[60]}` : A === 120 ? `${b}^2 + ${c}^2 - 2\\cdot ${b}\\cdot ${c}\\cdot\\left(${COS[120]}\\right)` : `${b}^2 + ${c}^2`;
const COSLAW = `${tm('a^2 = b^2 + c^2 - 2bc\\cos A')}`;
const g6a = lv => {   // định lí côsin: tính cạnh
  if(lv < 3){ const A = lv === 1 ? pick([60,90]) : 120, [b,c,a] = pick(A===60?P60:A===120?P120:P90);
    return QB({text:`Cho tam giác ${tm('ABC')} có ${tm(`AB = ${c}`)}, ${tm(`AC = ${b}`)} và ${tm(`\\widehat{A} = ${DG(A)}`)}. Tính độ dài cạnh ${tm('BC')}.`,
      fig:triSVG({a,b,c,la:'?',lb:String(b),lc:String(c),gA:`${A}°`}), tpl:blank('BC'), ans:[a], hint:`Dùng định lí côsin: ${COSLAW}.`,
      sol:`${tm(`BC^2 = ${lawA(b,c,A)} = ${a*a}`)}, nên ${tm('BC = ')}${tb(a)}.`}); }
  // cos A cho dạng phân số
  let b,c,p,q,a2; const CS = [[1,3],[1,4],[-1,4],[2,3],[-1,3],[1,5],[-1,5],[3,4]];
  do{ b = R(2,15); c = R(2,15); [p,q] = pick(CS); a2 = b*b + c*c - 2*b*c*p/q; }while(!Number.isInteger(a2) || !isSqN(a2) || b === c);
  const a = Math.sqrt(a2), cA = p < 0 ? `-${tf(-p,q)}` : tf(p,q);
  return QB({text:`Cho tam giác ${tm('ABC')} có ${tm(`AB = ${c}`)}, ${tm(`AC = ${b}`)} và ${tm(`\\cos A = ${cA}`)}. Tính ${tm('BC')}.`, fig:triSVG({a,b,c,la:'?',lb:String(b),lc:String(c),gA:true}),
    tpl:blank('BC'), ans:[a], hint:`Dùng định lí côsin ${COSLAW} với giá trị ${tm('\\cos A')} đã cho.`,
    sol:`${tm(`BC^2 = ${b}^2 + ${c}^2 - 2\\cdot ${b}\\cdot ${c}\\cdot\\left(${cA}\\right) = ${b*b+c*c} ${p<0?'+':'-'} ${Math.abs(2*b*c*p/q)} = ${a2}`)}, nên ${tm('BC = ')}${tb(a)}.`});
};
const g6b = lv => {   // tính góc, nhận dạng tam giác
  const CF = tm('\\cos A = \\dfrac{b^2 + c^2 - a^2}{2bc}');
  if(lv === 1){ let a,b,c; do{ a = R(3,12); b = R(3,12); c = R(3,12); }while(a >= b+c || b >= a+c || c >= a+b || (b*b+c*c-a*a) === 0);
    const num = b*b + c*c - a*a, den = 2*b*c;
    return QB({text:`Cho tam giác ${tm('ABC')} có ${tm(`BC = ${a},\\ CA = ${b},\\ AB = ${c}`)}. Tính ${tm('\\cos A')}.`, fig:triSVG({a,b,c,la:String(a),lb:String(b),lc:String(c),gA:'?'}),
      tpl:fblank('\\cos A'), ans:[{frac:[num,den],mode:'eq'}], hint:`Hệ quả của định lí côsin: ${CF}.`,
      sol:`${tm(`\\cos A = \\dfrac{${b}^2 + ${c}^2 - ${a}^2}{2\\cdot ${b}\\cdot ${c}} = ${tf(num,den)} = `)}${tb(tfrac(num,den))}.`}); }
  if(lv === 2){ const A = pick([60,120,90]), [b,c,a] = pick(A===60?P60:A===120?P120:P90);
    return QB({text:`Cho tam giác ${tm('ABC')} có ${tm(`BC = ${a},\\ CA = ${b},\\ AB = ${c}`)}. Tính số đo góc ${tm('A')}.`, fig:triSVG({a,b,c,la:String(a),lb:String(b),lc:String(c),gA:'?'}),
      tpl:`<span class="eq">${tm('\\widehat{A} =')} [_]°</span>`, ans:[A], hint:`Tính ${CF} rồi suy ra góc.`,
      sol:`${tm(`\\cos A = \\dfrac{${b*b} + ${c*c} - ${a*a}}{2\\cdot ${b}\\cdot ${c}} = ${tfrac(b*b+c*c-a*a,2*b*c)}`)}, nên ${tb(`\\widehat{A} = ${DG(A)}`)}.`}); }
  const K = ['Tam giác nhọn','Tam giác vuông','Tam giác tù'];
  let a,b,c,t; do{ const s = [R(3,15),R(3,15),R(3,15)].sort((x,y) => x-y); [c,b,a] = s; t = pick([0,1,2]); if(t===1){ const [p,q,h] = pick(TRIP); const k = R(1,2); [c,b,a] = [p*k,q*k,h*k]; } }

  if(lv < 3){ const A = lv === 1 ? 60 : 120, k = pick([1,2,3]), [b0,c0,a0] = pick(A===60?P60:P120), [b,c,a] = [b0*k,c0*k,a0*k];

const g1a = lv => {   // độ ↔ radian, độ dài cung

      hint:`Hai góc có cùng điểm biểu diễn khi hơn kém nhau một bội của ${tm('360^\\circ')}. Cộng hoặc trừ ${tm('360^\\circ')} nhiều lần.`, sol:`${tm(`${a}^\\circ = ${b}^\\circ ${lv===1?'+':'-'} ${k}\\cdot 360^\\circ`)}. Vậy ${tb(`\\beta = ${b}^\\circ`)}.`}); }

  let fnS,mx,mn,why;
  if(lv<3){ const k=lv===1?R(2,6):sR(2,6), c=R(-5,6), f=pick(['\\sin x','\\cos x',...(lv===2?['\\sin 2x',`\\cos\\left(x - ${piStr(PI/3)}\\right)`]:[])]);
    fnS=c?`y = ${c} ${k<0?'-':'+'} ${Math.abs(k)}${f}`:`y = ${k<0?'-':''}${Math.abs(k)}${f}`;
    mx=Math.abs(k)+c; mn=c-Math.abs(k); why=`Vì ${tm(`-1 \\le ${f} \\le 1`)} nên ${tm(`${mn} \\le y \\le ${mx}`)}.`; }
  else { const k=sR(2,6), c=R(-4,6), f=pick(['\\sin^2 x','\\cos^2 x']);
    fnS=`y = ${k<0?'-':''}${Math.abs(k)}${f}${c?` ${c<0?'-':'+'} ${Math.abs(c)}`:''}`; mx=Math.max(k,0)+c; mn=Math.min(k,0)+c; why=`Vì ${tm(`0 \\le ${f} \\le 1`)} nên ${tm(`${mn} \\le y \\le ${mx}`)}.`; }
  return QB({text:`Tìm giá trị lớn nhất và giá trị nhỏ nhất của hàm số ${td(fnS)}`, tpl:'<span class="eq">GTLN = [_]</span><br><span class="eq">GTNN = [_]</span>', ans:[mx,mn],
    hint:lv<3?`Dùng ${tm('-1 \\le \\sin, \\cos \\le 1')} rồi nhân (chú ý hệ số âm thì đổi chiều) và cộng hằng số.`:`Dùng ${tm('0 \\le \\sin^2 x,\\ \\cos^2 x \\le 1')}.`,
    sol:`${why} GTLN ${tb(`= ${mx}`)}, GTNN ${tb(`= ${mn}`)}.`}); };

/* =====================================================================
   BÀI 4. PHƯƠNG TRÌNH LƯỢNG GIÁC CƠ BẢN
   ===================================================================== */
const ASIN={'0':0,'1/2':30,'√2/2':45,'√3/2':60,'1':90}, ACOS={'1':0,'√3/2':30,'√2/2':45,'1/2':60,'0':90}, ATAN={'0':0,'√3/3':30,'1':45,'√3':60};
// Nghiệm của f(t) = m: trả về {pm:[α,P]} hoặc {list:[[b,P],…]} (đơn vị U)
function solveT(f,key){ const s=key.startsWith(M), b=s?key.slice(1):key;
  if(f==='sin'){ const a=(s?-1:1)*ASIN[b]*D; if(b==='1') return {list:[[a,P2]]}; if(b==='0') return {list:[[0,PI]]}; return {list:[[a,P2],[PI-a,P2]]}; }
  if(f==='cos'){ const a=s?PI-ACOS[b]*D:ACOS[b]*D; if(b==='1') return {list:[[s?PI:0,P2]]}; if(b==='0') return {list:[[PI/2,PI]]}; return {pm:[a,P2]}; }
  if(f==='tan') return {list:[[(s?-1:1)*ATAN[b]*D,PI]]};
  const c={'0':90,'√3':30,'1':45,'√3/3':60}[b]; return {list:[[(s?-1:1)*c*D,PI]]}; }
// đổi từ t = a·x + b sang x
function toX(sol,a,b){ if(sol.pm&&b===0) return {pm:[sol.pm[0]/a,sol.pm[1]/a]};
  const L=sol.pm?[[sol.pm[0],sol.pm[1]],[-sol.pm[0],sol.pm[1]]]:sol.list; return {list:L.map(([t,P])=>[(t-b)/a,P/a])}; }
const per = P => P===P2?'k2\\pi':P===PI?'k\\pi':`k${piStr(P)}`;
const fam = (b,P) => b===0?per(P):`${piStr(b)} + ${per(P)}`;
const showSol = s => s.pm ? `x = \\pm ${piStr(s.pm[0])} + ${per(s.pm[1])}` : s.list.map(([b,P])=>`x = ${fam(b,P)}`).join(';\\quad ');
const argStr = (a,b) => { const ax=a===1?'x':`${a}x`; return b===0?ax:`${ax} ${b<0?'-':'+'} ${piStr(Math.abs(b))}`; };
const eqStr = (f,a,b,k) => `${fn(f)}${a===1&&b===0?' x':`\\left(${argStr(a,b)}\\right)`} = ${valH(k)}`;
const pickEq = lv => { let f,k;
  if(lv===1){ f=pick(['sin','cos']); k=pick(['1/2','√2/2','√3/2']); }
  else { f=pick(['sin','cos','tan','cot']); k=pick(f==='sin'||f==='cos'?withNeg(['1/2','√2/2','√3/2','1','0']):withNeg(['√3/3','1','√3','0'])); }
  const a=lv===3?pick([1,2,3]):1, b=lv===3?pick([PI/6,PI/4,PI/3])*pick([-1,1]):0; if(lv===3&&a===1&&Math.random()<.3) return pickEq(lv);
  return {f,k,a,b,sol:toX(solveT(f,k),a,b)}; };
const HINT4 = `${tm('\\sin u = \\sin\\alpha \\Leftrightarrow u = \\alpha + k2\\pi')} hoặc ${tm('u = \\pi - \\alpha + k2\\pi')}; ${tm('\\cos u = \\cos\\alpha \\Leftrightarrow u = \\pm\\alpha + k2\\pi')}; ${tm('\\tan u = \\tan\\alpha \\Leftrightarrow u = \\alpha + k\\pi')}; ${tm('\\cot u = \\cot\\alpha \\Leftrightarrow u = \\alpha + k\\pi')} ${tm('(k \\in \\mathbb{Z})')}.`;
const g4a = lv => { const {f,k,a,b,sol}=pickEq(lv), good=showSol(sol);
  const W=new Set(); const t0=solveT(f,k);
  const per2 = s => s.pm?{pm:[s.pm[0],s.pm[1]/2]}:{list:s.list.map(([x,P])=>[x,f==='tan'||f==='cot'?P*2:P/2])};
  W.add(showSol(per2(sol)));
  if(t0.pm) W.add(showSol(toX({list:[[t0.pm[0],P2],[PI-t0.pm[0],P2]]},a,b))); else if(t0.list.length===2) W.add(showSol(toX({pm:[t0.list[0][0],P2]},a,b)));
  const k2=(f==='tan'||f==='cot'?{'√3/3':'√3','√3':'√3/3','1':'√3','0':'1'}:{'1/2':'√3/2','√3/2':'1/2','√2/2':'√3/2','1':'1/2','0':'1/2'})[k.replace(M,'')]; if(k2) W.add(showSol(toX(solveT(f,(k.startsWith(M)?M:'')+k2),a,b)));
  if(a>1) W.add(showSol(toX(solveT(f,k),1,b)));
  W.add(showSol(toX(solveT(f==='sin'?'cos':f==='cos'?'sin':f==='tan'?'cot':'tan',k),a,b)));
  const flip = x => x.pm?{pm:[PI-x.pm[0],x.pm[1]]}:{list:x.list.map(([u,P])=>[-u,P])};
  W.add(showSol(flip(sol))); W.add(showSol(per2(flip(sol))));
  const Wl=[...W].filter(s=>s!==good);
  return QC({text:`Giải phương trình ${td(eqStr(f,a,b,k))}`, opts:[good,...shuffle(Wl).slice(0,3)].map(tm), ans:tm(good),
    hint:HINT4+(a>1||b?` Giải theo ${tm('u')} rồi chuyển vế, chia để tìm ${tm('x')}.`:''),
    sol:`Nghiệm: ${tb(good)} ${tm('(k \\in \\mathbb{Z})')}.`}); };
const countIn = (sol,L,Rr) => { const L2=sol.pm?[[sol.pm[0],sol.pm[1]],[-sol.pm[0],sol.pm[1]]]:sol.list, s=new Set();
  L2.forEach(([b,P])=>{ for(let k=-80;k<=80;k++){ const x=b+k*P; if(x>=L-1e-9&&x<=Rr+1e-9) s.add(Math.round(x*1000)); } }); return [...s].sort((u,v)=>u-v); };
const g4b = lv => { const {f,k,a,b,sol}=pickEq(lv);
  const [L,Rr]=lv===1?[0,P2]:lv===2?pick([[-PI,PI],[0,3*PI],[-PI,2*PI]]):pick([[0,PI],[0,P2],[-PI/2,PI]]);
  const xs=countIn(sol,L,Rr);
  return QB({text:`Phương trình ${td(eqStr(f,a,b,k))} có bao nhiêu nghiệm thuộc đoạn ${tm(`[{${piStr(L)}};\\ {${piStr(Rr)}}]`)}?`, tpl:'[_] nghiệm', ans:[xs.length],
    hint:`Viết công thức nghiệm, rồi với từng họ nghiệm tìm các số nguyên ${tm('k')} để ${tm('x')} nằm trong đoạn (hoặc dùng đường tròn lượng giác).`,
    sol:`${tm(showSol(sol))}. Các nghiệm thuộc đoạn: ${xs.length?tm(xs.map(x=>`{${piStr(x/1000)}}`).join(';\\ ')):'không có'}. Có ${tb(xs.length)} nghiệm.`}); };
const g4c = lv => {   // sin f = sin g, cos f = cos g
  if(lv===1){ const f=pick(['sin','cos','tan']), d=5*R(2,17);
    const good=f==='sin'?`x = ${dg(d)} + k360^\\circ;\\quad x = ${dg(180-d)} + k360^\\circ`:f==='cos'?`x = \\pm ${dg(d)} + k360^\\circ`:`x = ${dg(d)} + k180^\\circ`;
    const all=[`x = ${dg(d)} + k360^\\circ;\\quad x = ${dg(180-d)} + k360^\\circ`,`x = \\pm ${dg(d)} + k360^\\circ`,`x = ${dg(d)} + k180^\\circ`,`x = ${dg(d)} + k360^\\circ;\\quad x = ${dg(90-d)} + k360^\\circ`,`x = ${dg(d)} + k360^\\circ;\\quad x = -${dg(d)} + k180^\\circ`].filter(s=>s!==good);
    return QC({text:`Giải phương trình ${td(`${fn(f)} x = ${fn(f)} ${dg(d)}`)}`, opts:[good,...shuffle(all).slice(0,3)].map(tm), ans:tm(good),
      hint:`${tm('\\sin x = \\sin\\alpha \\Leftrightarrow x = \\alpha + k360^\\circ')} hoặc ${tm('x = 180^\\circ - \\alpha + k360^\\circ')}; ${tm('\\cos x = \\cos\\alpha \\Leftrightarrow x = \\pm\\alpha + k360^\\circ')}; ${tm('\\tan x = \\tan\\alpha \\Leftrightarrow x = \\alpha + k180^\\circ')}.`,
      sol:`Nghiệm: ${tb(good)} ${tm('(k \\in \\mathbb{Z})')}.`}); }
  let a,b; do{a=R(2,5);b=R(1,4)}while(a<=b||a+b>6);
  const ax=kx(a), bx=kx(b); let eq,good,W,why;
  const two = (s1,s2) => `${showSol(s1)};\\quad ${showSol(s2)}`;
  if(lv===2){ const f=pick(['sin','cos']); eq=`${fn(f)} ${ax} = ${fn(f)} ${bx}`;
    const A={list:[[0,P2/(a-b)]]}, Bc={list:[[0,P2/(a+b)]]}, Bs={list:[[PI/(a+b),P2/(a+b)]]};
    good=f==='cos'?two(A,Bc):two(A,Bs);
    W=[f==='cos'?two(A,Bs):two(A,Bc), two({list:[[0,PI/(a-b)]]},f==='cos'?Bc:Bs), showSol(A), two({list:[[0,P2/(a+b)]]},{list:[[PI/(a-b),P2/(a-b)]]})];
    why=f==='cos'?tm(`${ax} = \\pm ${bx} + k2\\pi`):`${tm(`${ax} = ${bx} + k2\\pi`)} hoặc ${tm(`${ax} = \\pi - ${bx} + k2\\pi`)}`; }
  else { eq=`\\sin ${ax} = \\cos ${bx}`;
    const A={list:[[PI/2/(a+b),P2/(a+b)]]}, B={list:[[PI/2/(a-b),P2/(a-b)]]};
    good=two(A,B);
    W=[two({list:[[PI/2/(a+b),PI/(a+b)]]},B), two(A,{list:[[-PI/2/(a-b),P2/(a-b)]]}), two({list:[[PI/(a+b),P2/(a+b)]]},{list:[[PI/(a-b),P2/(a-b)]]}), showSol(A)];
    why=`${tm(`\\cos ${bx} = \\sin\\left(${piStr(PI/2)} - ${bx}\\right)`)} nên ${tm(`${ax} = ${piStr(PI/2)} - ${bx} + k2\\pi`)} hoặc ${tm(`${ax} = ${piStr(PI/2)} + ${bx} + k2\\pi`)}`; }
  W=[...new Set(W)].filter(s=>s!==good);
  return QC({text:`Giải phương trình ${td(eq)}`, opts:[good,...shuffle(W).slice(0,3)].map(tm), ans:tm(good),
    hint:lv===3?`Đưa về cùng một hàm: ${tm('\\cos v = \\sin\\left(\\frac{\\pi}{2} - v\\right)')}, rồi dùng ${tm('\\sin u = \\sin v')}.`:`Dùng ${tm('\\sin u = \\sin v \\Leftrightarrow u = v + k2\\pi')} hoặc ${tm('u = \\pi - v + k2\\pi')}; ${tm('\\cos u = \\cos v \\Leftrightarrow u = \\pm v + k2\\pi')}. Sau đó chuyển vế, chia cho hệ số của ${tm('x')}.`,
    sol:`${why}. Vậy ${tb(good)} ${tm('(k \\in \\mathbb{Z})')}.`}); };

/* =====================================================================
   CHƯƠNG II. DÃY SỐ. CẤP SỐ CỘNG VÀ CẤP SỐ NHÂN (Bài 5 · Bài 6 · Bài 7)
   Viết trong một khối { } để tên hằng không trùng với chương I.
   ===================================================================== */
{
const u = k => `u_{${k}}`;
const blankU = k => `<span class="eq">${tm(`${u(k)} =`)} [_]</span>`;
const blankV = v => `<span class="eq">${tm(`${v} =`)} [_]</span>`;
const two = (a,b) => `<span class="eq">${tm(`${a} =`)} [_]${tm(`;\\quad ${b} =`)} [_]</span>`;
const rat = (p,q) => tfrac(p,q);                                // phân số rút gọn (LaTeX)
const lst = (a, more=true) => a.map(x => `{${x}}`).join(';\\ ') + (more ? ';\\ \\ldots' : '');
const sgnT = (c, first) => first ? (c<0?'-':'') : (c<0?' - ':' + ');
const nz = (a,b) => { let x; do{ x = R(a,b) }while(!x); return x; };
const EQ2 = '\\;\\Leftrightarrow\\;', RA2 = '\\;\\Rightarrow\\;';

/* ---------------- BÀI 5. DÃY SỐ ---------------- */
// Công thức mẫu: s (LaTeX của u_n), f(n) → [tử, mẫu]
const SEQ = {
  '2n':            {f:n=>[2*n,1]},        '2n-1':          {f:n=>[2*n-1,1]},     '2n+1':          {f:n=>[2*n+1,1]},
  '3n-2':          {f:n=>[3*n-2,1]},      '5-n':           {f:n=>[5-n,1]},        'n^2':           {f:n=>[n*n,1]},
  'n^2+1':         {f:n=>[n*n+1,1]},      'n(n+1)':        {f:n=>[n*(n+1),1]},    '2^n':           {f:n=>[2**n,1]},
  '2^{n-1}':       {f:n=>[2**(n-1),1]},   '3^{n-1}':       {f:n=>[3**(n-1),1]},   '(-1)^n':        {f:n=>[(-1)**n,1]},
  '(-1)^{n+1}n':   {f:n=>[(-1)**(n+1)*n,1]}, '(-1)^n\\cdot 2n': {f:n=>[(-1)**n*2*n,1]},
  '\\dfrac{1}{n}': {f:n=>[1,n]},          '\\dfrac{n}{n+1}': {f:n=>[n,n+1]},     '\\dfrac{n+1}{n}': {f:n=>[n+1,n]},
  '\\dfrac{1}{2^n}': {f:n=>[1,2**n]},     '\\dfrac{(-1)^n}{n}': {f:n=>[(-1)**n,n]},
};
const termT = (k,n) => rat(...SEQ[k].f(n));
const firstT = (k,m=5) => [...Array(m)].map((_,i) => termT(k,i+1));
const g5a = lv => {   // tính số hạng
  if(lv===1){ if(Math.random()<.5){ const a=nz(-5,6), b=R(-9,9), k=R(3,15), e=tpoly([a,'n'],[b,'']);
      return QB({text:`Cho dãy số ${tm(`(u_n)`)} với ${tm(`u_n = ${e}`)}. Tính ${tm(u(k))}.`, tpl:blankU(k), ans:[a*k+b],
        hint:`Thay ${tm(`n = ${k}`)} vào công thức của ${tm('u_n')}.`, sol:`${tm(`${u(k)} = ${a}\\cdot ${k} ${sgnT(b)}${Math.abs(b)} = `)}${tb(a*k+b)}.`.replace(' + 0 = ',' = ')}); }
    const c=R(-9,9), k=R(3,12), e=`n^2 ${sgnT(c)}${Math.abs(c)}`.replace(/ \+ 0$/,'');
    return QB({text:`Cho dãy số ${tm(`(u_n)`)} với ${tm(`u_n = ${c?e:'n^2'}`)}. Tính ${tm(u(k))}.`, tpl:blankU(k), ans:[k*k+c],
      hint:`Thay ${tm(`n = ${k}`)} vào công thức của ${tm('u_n')}.`, sol:`${tm(`${u(k)} = ${k}^2${c?` ${sgnT(c)}${Math.abs(c)}`:''} = `)}${tb(k*k+c)}.`}); }
  if(lv===2){ const t=R(1,3), k=R(2,9);
    if(t===1){ let a,b,c,d; do{a=nz(-4,5);b=R(-6,6);c=R(1,4);d=R(0,6)}while(a*d===b*c); const p=a*k+b, q=c*k+d;
      const e=tf(tpoly([a,'n'],[b,'']),tpoly([c,'n'],[d,'']));
      return QB({text:`Cho dãy số ${tm(`(u_n)`)} với ${tm(`u_n = ${e}`)}. Tính ${tm(u(k))}.`, tpl:`<span class="eq">${tm(`${u(k)} =`)} [F]</span>`, ans:[{frac:[p,q],mode:'eq'}],
        hint:`Thay ${tm(`n = ${k}`)} vào tử và mẫu rồi rút gọn.`, sol:`${tm(`${u(k)} = ${tf(`${a}\\cdot ${k} ${sgnT(b)}${Math.abs(b)}`,`${c}\\cdot ${k} ${sgnT(d)}${Math.abs(d)}`)} = ${tf(p,q)} = `)}${tb(rat(p,q))}.`}); }
    if(t===2){ const a=R(1,4), b=R(-5,5), v=(-1)**k*(a*k+b), e=`(-1)^n(${tpoly([a,'n'],[b,''])})`;
      return QB({text:`Cho dãy số ${tm(`(u_n)`)} với ${tm(`u_n = ${e}`)}. Tính ${tm(u(k))}.`, tpl:blankU(k), ans:[v],
        hint:`${tm('(-1)^n')} bằng ${tm('1')} khi ${tm('n')} chẵn, bằng ${tm('-1')} khi ${tm('n')} lẻ.`, sol:`${tm(`${u(k)} = (-1)^{${k}}(${a}\\cdot ${k} ${sgnT(b)}${Math.abs(b)}) = ${(-1)**k}\\cdot ${a*k+b} = `)}${tb(v)}.`}); }
    const c=R(1,5), kk=R(3,8), v=2**kk-c*kk, e=`2^n - ${c===1?'':c}n`;
    return QB({text:`Cho dãy số ${tm(`(u_n)`)} với ${tm(`u_n = ${e}`)}. Tính ${tm(u(kk))}.`, tpl:blankU(kk), ans:[v],
      hint:`Thay ${tm(`n = ${kk}`)}; nhớ ${tm(`2^{${kk}}`)} là tích của ${kk} thừa số 2.`, sol:`${tm(`${u(kk)} = 2^{${kk}} - ${c}\\cdot ${kk} = ${2**kk} - ${c*kk} = `)}${tb(v)}.`}); }
  // Truy hồi
  const a=R(-3,4), p=pick([2,3,-1,-2]), q=R(-4,4), K=p===-1?5:4, vals=[a]; for(let i=1;i<K;i++) vals.push(p*vals[i-1]+q);
  const rec=`${p===-1?'-':p===1?'':p}u_n${q?` ${sgnT(q)}${Math.abs(q)}`:''}`;
  return QB({text:`Cho dãy số ${tm('(u_n)')} xác định bởi ${td(`\\begin{cases}u_1 = ${a}\\\\ u_{n+1} = ${rec}\\ \\ (n \\ge 1)\\end{cases}`)}Tính ${tm(u(K))}.`, tpl:blankU(K), ans:[vals[K-1]],
    hint:`Dãy cho bằng hệ thức truy hồi: tính lần lượt ${tm('u_2')} từ ${tm('u_1')}, rồi ${tm('u_3')} từ ${tm('u_2')}, …`,
    sol:`${vals.slice(1).map((v,i)=>tm(`${u(i+2)} = ${p===-1?'-':p}${p===-1?`${tp(vals[i])}`:`\\cdot ${tp(vals[i])}`}${q?` ${sgnT(q)}${Math.abs(q)}`:''} = ${v}`)).join('; ')}. Vậy ${tb(`${u(K)} = ${vals[K-1]}`)}.`});
};
const g5b = lv => {   // tìm công thức số hạng tổng quát
  const pools = {1:['2n','2n-1','2n+1','3n-2','5-n','n^2','n^2+1','n(n+1)'], 2:['2^n','2^{n-1}','3^{n-1}','(-1)^n','(-1)^{n+1}n','(-1)^n\\cdot 2n','2n','n^2','2n-1'],
    3:['\\dfrac{1}{n}','\\dfrac{n}{n+1}','\\dfrac{n+1}{n}','\\dfrac{1}{2^n}','\\dfrac{(-1)^n}{n}','2^{n-1}','(-1)^n','n(n+1)']};
  const P=pools[lv], good=pick(P), show=4, key=k=>firstT(k,show).join('|');
  const others=shuffle(Object.keys(SEQ).filter(k=>k!==good&&key(k)!==key(good)))
    .sort((x,y)=>(termT(y,1)===termT(good,1))-(termT(x,1)===termT(good,1))).slice(0,3);

const MONO = ['Dãy số tăng','Dãy số giảm','Dãy số không tăng, không giảm'];
const g5c = lv => {   // tính tăng, giảm
  let e, ans, sol; const t = lv===1 ? 'lin' : lv===2 ? pick(['frac','frac','pow']) : pick(['alt','quad','frac','pow','lin']);
  if(t==='lin'){ const a=nz(-5,5), b=R(-9,9); e=tpoly([a,'n'],[b,'']); ans=a>0?0:1;
    sol=`${tm(`u_{n+1} - u_n = ${a} ${a>0?'\\gt':'\\lt'} 0`)} với mọi ${tm('n')}.`; }
  if(t==='frac'){ let p,q; do{p=R(-3,6);q=R(0,6)}while(p===q); e=tf(`n ${sgnT(p)}${Math.abs(p)}`.replace(' + 0',''),`n ${sgnT(q)}${Math.abs(q)}`.replace(' + 0','')); ans=q>p?0:1;
    sol=`${tm(`u_n = 1 ${q>p?'-':'+'} ${tf(Math.abs(q-p),`n${q?` + ${q}`:''}`)}`)}. Khi ${tm('n')} tăng, ${tm(tf(Math.abs(q-p),`n${q?` + ${q}`:''}`))} giảm nên ${tm('u_n')} ${q>p?'tăng':'giảm'} (hoặc xét ${tm(`u_{n+1} - u_n = ${tf(q-p,`(n + ${q+1})(n${q?` + ${q}`:''})`)}`)}).`; }
  if(t==='pow'){ const b=pick([2,3,5]), inv=Math.random()<.5; e=inv?tf(1,`${b}^n`):`${b}^n`; ans=inv?1:0;

  return QC({text:`Dãy số ${tm(`(u_n)`)} với ${tm(`u_n = ${e}`)} là`, opts:MONO, ans:MONO[ans], keepOrder:true,
    hint:`Xét dấu của ${tm('u_{n+1} - u_n')} (hoặc so sánh ${tm(tf('u_{n+1}','u_n'))} với 1 khi các số hạng dương). Luôn dương → tăng; luôn âm → giảm; đổi dấu → không tăng, không giảm.`,
    sol:`${sol} Vậy đó là <b>${MONO[ans].toLowerCase()}</b>.`});
};
const BND = [

/* ---------------- BÀI 6. CẤP SỐ CỘNG ---------------- */
const CSC = 'Cấp số cộng: mỗi số hạng (từ số hạng thứ hai) bằng số hạng đứng ngay trước cộng với một số không đổi ' + tm('d') + ' (công sai).';
const nearMiss = a => { const b=a.slice(), i=R(2,a.length-1); b[i]=b[i]+pick([-1,1]); return b; };

    hint:`Dãy ${tm('(u_n)')} là cấp số cộng khi ${tm('u_{n+1} - u_n')} là một hằng số (không phụ thuộc ${tm('n')}).`,
    sol:`Với ${tm(`u_n = ${good}`)}, hiệu ${tm('u_{n+1} - u_n')} là hằng số nên đây là cấp số cộng: ${tb(`u_n = ${good}`)}. Các dãy khác có hiệu phụ thuộc ${tm('n')}.`});

const cf1 = c => Math.abs(c)===1 ? '' : Math.abs(c);
const g6b = lv => {   // số hạng tổng quát u_n = u_1 + (n − 1)d

      sol:`${tm(`${u(k)} = ${a} + (${k} - 1)\\cdot ${tp(d)} = ${a} ${sgnT((k-1)*d)}${Math.abs((k-1)*d)} = `)}${tb(v)}.`}); }

const g6c = lv => {   // tổng n số hạng đầu

const g6d = lv => {   // bài toán thực tế

const g6e = lv => {   // ba số lập thành cấp số cộng

    hint:`Dãy ${tm('(u_n)')} (các số hạng khác 0) là cấp số nhân khi ${tm(tf('u_{n+1}','u_n'))} là một hằng số.`,
