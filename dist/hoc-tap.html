<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Học mà chơi – Bài tập củng cố theo bài</title>
<meta name="description" content="Bài tập củng cố theo từng bài cho học sinh tiểu học: câu hỏi sinh ngẫu nhiên, gợi ý khi sai, lời giải chi tiết, tối ưu cho iPad.">
<meta property="og:title" content="Học mà chơi – Bài tập củng cố theo bài">
<meta property="og:description" content="Luyện tập theo từng bài, 3 mức độ, có gợi ý và lời giải.">
<meta name="theme-color" content="#14213d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Học mà chơi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6fb; --dot:#cfd9e8; --surface:#ffffff; --ink:#14213d; --muted:#556079; --line:#14213d;
  --primary:#2f6fe4; --primary-ink:#ffffff; --primary-soft:#e2ebfd;
  --ok:#17804a; --ok-soft:#e1f5e9; --warn:#8a5a00; --warn-soft:#fff3cf; --bad:#c23636; --bad-soft:#fde7e7;
  --s-blue:#a9c4ec; --s-pink:#efb2c9; --s-yellow:#f4d57a; --shade:#5b8def; --star:#f2b01e;
  --r-lg:22px; --r-md:14px; --r-pill:999px;
  --sp1:4px; --sp2:8px; --sp3:16px; --sp4:24px; --sp5:40px;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,sans-serif; --f-head:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --shadow:6px 6px 0 var(--line); --shadow-sm:3px 3px 0 var(--line);
  --pet-ink:#14213d; --pet-white:#ffffff; --pet-egg:#fff6df; --pet-spot:#f4c86a; --pet-belly:#fff4e6; --pet-cheek:#ff9fb2; --pet-crown:#f6c032; --pet-gem:#e2466b; --pet-horn:#ffd66b; --pet-shadow:#14213d22;
  --pet-meo:#ffb56b; --pet-rong:#7fd4a4; --pet-cu:#b39ddb; --pet-tho:#f7c6d9; --pet-wing:#ffd9a0;
  --pv-bg:#ffffff; --pv-ink:#000000; --pv-muted:#3b4254; --pv-line:#1b2240; --pv-accent:#1f5fd6; --pv-soft:#e3ecff; --pv-bar:#eef2f8;
  --ws-ink:#000000; --ws-paper:#ffffff; --ws-line:#9aa0aa; --ws-soft:#f2f4f7; --ws-muted:#444a55;
  --pv-ok:#e1f5e9; --pv-bad:#fde7e7; --pv-warn:#fff3cf; --pv-dok:#153526; --pv-dbad:#3d1a1d; --pv-dwarn:#3a2f10;
  --pv-dbg:#0b1020; --pv-dink:#ffffff; --pv-dmuted:#c8d0e0; --pv-dline:#9fb3dd; --pv-daccent:#7fb0ff; --pv-dsoft:#1d2c55; --pv-dbar:#151c33;
  --acc-red:#e5484d; --acc-blue:#3e7bfa; --acc-yellow:#ffcf40; --acc-pink:#ff7eb6; --acc-purple:#9b6cff; --acc-dark:#23283a; --acc-gold:#f2b01e; --acc-gold-dark:#b77d00; --acc-white:#ffffff;
  --acc-sky:#d6ecff; --acc-grass:#8fd694; --acc-grass2:#6cc37a; --acc-sea:#5cb8ea; --acc-sand:#f5dfae; --acc-night:#1d2550; --acc-moon:#fff3c4; --acc-board:#2f5d50; --acc-wall:#fdf1dc; --acc-wood:#c99a6b; --acc-tear:#6cc3f0;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1524; --dot:#1f2b44; --surface:#16213a; --ink:#e8eefa; --muted:#a7b3cc; --line:#7f96c4;
  --primary:#6b9bff; --primary-ink:#0e1524; --primary-soft:#1f3160;
  --ok:#5fd394; --ok-soft:#153526; --warn:#f3c95a; --warn-soft:#3a2f10; --bad:#ff8a8a; --bad-soft:#3d1a1d; --shade:#6b9bff;
  --pet-ink:#0e1524; --pet-white:#ffffff; --pet-egg:#f3ead2; --pet-spot:#d9a94a; --pet-belly:#fbeedd; --pet-cheek:#ff8fa6; --pet-crown:#f6c032; --pet-gem:#ff6b8e; --pet-horn:#ffd66b; --pet-shadow:#00000055;
  --pet-meo:#f5a55a; --pet-rong:#6cc795; --pet-cu:#a28ad4; --pet-tho:#eeb3cb; --pet-wing:#f3c98c;
  --acc-red:#e5484d; --acc-blue:#5a8dff; --acc-yellow:#ffcf40; --acc-pink:#ff7eb6; --acc-purple:#a483ff; --acc-dark:#0b0f1c; --acc-gold:#f2b01e; --acc-gold-dark:#b77d00; --acc-white:#f4f6fb;
  --acc-sky:#27406b; --acc-grass:#3f8f55; --acc-grass2:#347a47; --acc-sea:#2a6f9e; --acc-sand:#a88d5a; --acc-night:#0f1636; --acc-moon:#f6e7a8; --acc-board:#244a3f; --acc-wall:#3a3326; --acc-wood:#7a5a3c; --acc-tear:#7cc8f2;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1524; --dot:#1f2b44; --surface:#16213a; --ink:#e8eefa; --muted:#a7b3cc; --line:#7f96c4;
  --primary:#6b9bff; --primary-ink:#0e1524; --primary-soft:#1f3160;
  --ok:#5fd394; --ok-soft:#153526; --warn:#f3c95a; --warn-soft:#3a2f10; --bad:#ff8a8a; --bad-soft:#3d1a1d; --shade:#6b9bff;
  --pet-ink:#0e1524; --pet-white:#ffffff; --pet-egg:#f3ead2; --pet-spot:#d9a94a; --pet-belly:#fbeedd; --pet-cheek:#ff8fa6; --pet-crown:#f6c032; --pet-gem:#ff6b8e; --pet-horn:#ffd66b; --pet-shadow:#00000055;
  --pet-meo:#f5a55a; --pet-rong:#6cc795; --pet-cu:#a28ad4; --pet-tho:#eeb3cb; --pet-wing:#f3c98c;
  --acc-red:#e5484d; --acc-blue:#5a8dff; --acc-yellow:#ffcf40; --acc-pink:#ff7eb6; --acc-purple:#a483ff; --acc-dark:#0b0f1c; --acc-gold:#f2b01e; --acc-gold-dark:#b77d00; --acc-white:#f4f6fb;
  --acc-sky:#27406b; --acc-grass:#3f8f55; --acc-grass2:#347a47; --acc-sea:#2a6f9e; --acc-sand:#a88d5a; --acc-night:#0f1636; --acc-moon:#f6e7a8; --acc-board:#244a3f; --acc-wall:#3a3326; --acc-wood:#7a5a3c; --acc-tear:#7cc8f2;
  color-scheme:dark;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(var(--dot) 1.3px,transparent 1.4px);background-size:22px 22px;
  color:var(--ink);font:500 18px/1.55 var(--f-body);-webkit-tap-highlight-color:transparent;touch-action:manipulation;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px;border-radius:8px}
.wrap{max-width:920px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 60px max(16px,env(safe-area-inset-right))}

/* Header */
.top{background:color-mix(in srgb,var(--s-blue) 45%,var(--surface));text-align:center;padding:calc(18px + env(safe-area-inset-top)) 16px 16px;position:relative}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;background:linear-gradient(90deg,var(--s-blue) 0 25%,var(--s-pink) 25% 75%,var(--s-yellow) 75%)}
.brand{font:800 clamp(30px,5vw,42px)/1.1 var(--f-head);margin:0;color:var(--ink);letter-spacing:.3px}
.brand span{color:var(--primary)}
.sub{margin:6px 0 10px;font:700 13px/1.3 var(--f-body);letter-spacing:2.5px;text-transform:uppercase;color:var(--primary)}
.author{font-size:14px;color:var(--muted)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 8px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--primary);font-weight:700;text-decoration:none;min-height:44px;font-size:18px}
.back:hover{text-decoration:underline}

/* Pills & buttons */
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--bg);border-radius:var(--r-pill);padding:8px 18px;font:700 14px/1.2 var(--f-body);letter-spacing:.4px;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 22px;border-radius:var(--r-pill);border:2.5px solid var(--line);background:var(--surface);
  font-weight:700;font-size:17px;box-shadow:var(--shadow-sm);transition:transform .12s ease-out,box-shadow .12s ease-out}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.small{min-height:44px;padding:6px 16px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.theme-btn{width:48px;height:48px;border-radius:50%;border:2.5px solid var(--line);background:var(--surface);box-shadow:var(--shadow-sm);font-size:20px}

/* Home */
h1{font:800 clamp(28px,4.4vw,38px)/1.2 var(--f-head);margin:16px 0 6px}
.lead{color:var(--muted);margin:0 0 18px;font-size:18px}
.stat{display:inline-flex;gap:8px;align-items:center;background:var(--surface);border:2.5px solid var(--line);border-radius:var(--r-pill);padding:8px 16px;font-weight:700;box-shadow:var(--shadow-sm)}
.tabs{display:inline-flex;border:2.5px solid var(--line);border-radius:var(--r-pill);background:var(--surface);padding:4px;gap:4px;box-shadow:var(--shadow-sm)}
.tabs button{border:0;background:transparent;border-radius:var(--r-pill);min-height:44px;padding:6px 20px;font-weight:700}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.topic{margin:28px 0 0}
.topic h2{font:800 23px/1.25 var(--f-head);margin:0 0 12px;display:flex;gap:10px;align-items:baseline}
.topic h2 small{font:700 13px/1 var(--f-body);letter-spacing:1.5px;color:var(--primary);text-transform:uppercase;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:10px;text-align:left;background:var(--surface);border:2.5px solid var(--line);border-radius:var(--r-md);
  padding:14px 16px;box-shadow:var(--shadow-sm);text-decoration:none;color:var(--ink);min-height:92px;transition:transform .12s ease-out,box-shadow .12s ease-out}
.tile:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--line)}
.tile:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.tile b{font-size:17px;line-height:1.35}
.tile .meta{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.stars{letter-spacing:1px;color:var(--star);font-size:16px}
.stars .off{color:var(--dot)}

/* Lesson */
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.lvl{border:2.5px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:10px 12px;text-align:left;min-height:64px;box-shadow:var(--shadow-sm)}
.lvl b{display:block;font:800 18px/1.2 var(--f-head)}
.lvl span{font-size:14px;color:var(--muted)}
.lvl[aria-pressed="true"]{background:var(--primary);border-color:var(--line);color:var(--primary-ink)}
.lvl[aria-pressed="true"] span{color:var(--primary-ink);opacity:.9}
.progress{position:sticky;top:0;z-index:5;margin:6px -4px 16px;padding:10px 4px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.bar{height:14px;border:2.5px solid var(--line);border-radius:var(--r-pill);background:var(--surface);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--shade));transition:width .25s ease-out}
.progress .txt{display:flex;justify-content:space-between;font-size:15px;font-weight:600;color:var(--muted);margin-top:6px}

.card{background:var(--surface);border:2.5px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:20px 22px 22px;margin:0 0 26px;transition:border-color .2s}
.card.ok{border-color:var(--ok);box-shadow:6px 6px 0 var(--ok)}
.card.fail{border-color:var(--bad);box-shadow:6px 6px 0 var(--bad)}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{background:var(--primary);color:var(--primary-ink);border-radius:var(--r-pill);padding:3px 14px;font-weight:700;font-size:15px}
.chip{background:var(--primary-soft);color:var(--ink);border-radius:var(--r-pill);padding:3px 12px;font-weight:600;font-size:14px}
.qhead .spacer{flex:1}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:15px;min-height:44px;padding:0 4px}
.qtext{font-weight:600;font-size:20px;margin:12px 0 8px}
.qbody{display:grid;gap:14px;align-items:center}
@media (min-width:900px){.qbody.has-fig{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
.fig{display:flex;justify-content:center}
.fig svg{width:100%;max-width:380px;max-height:280px;height:auto;overflow:visible}
.answer{font-size:24px;font-weight:600;line-height:2.2}
.answer .eq{white-space:nowrap}
.blank{width:5.2ch;min-width:64px;height:52px;border:0;border-bottom:3px dashed var(--primary);background:var(--primary-soft);border-radius:10px 10px 0 0;text-align:center;
  font:700 24px/1 var(--f-body);padding:0 6px;margin:0 4px;vertical-align:middle;-moz-appearance:textfield}
.blank.wide{width:8.5ch}
.blank:focus{outline:none;border-bottom-style:solid;background:color-mix(in srgb,var(--primary-soft) 70%,var(--surface))}
.blank.wrong{border-bottom-color:var(--bad);background:var(--bad-soft)}
.blank.right{border-bottom-color:var(--ok);background:var(--ok-soft)}
.blank:disabled{opacity:1;-webkit-text-fill-color:var(--ink)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 3px;font-weight:700}
.fr>span:first-child{border-bottom:2.5px solid currentColor;padding:0 4px}
.fr>span{padding:0 4px}
.fbar{display:block;width:100%;min-width:60px;height:3px;background:var(--ink);border-radius:2px}
.fr .blank{height:44px;width:3.6ch;min-width:54px;margin:3px 0;font-size:22px}
.big{font-size:28px;font-weight:700}
.choices{display:flex;flex-wrap:wrap;gap:12px;margin-top:4px}
.choice{min-height:56px;min-width:64px;padding:10px 20px;border:2.5px solid var(--line);border-radius:var(--r-md);background:var(--surface);font-weight:700;font-size:19px;box-shadow:var(--shadow-sm);text-align:left}
.choices.compact .choice{min-width:76px;font-size:28px;text-align:center;padding:6px 10px}
.choice[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary);box-shadow:3px 3px 0 var(--primary)}
.choice.right{background:var(--ok-soft);border-color:var(--ok);box-shadow:3px 3px 0 var(--ok)}
.choice.wrong{background:var(--bad-soft);border-color:var(--bad);box-shadow:3px 3px 0 var(--bad)}
.choice:disabled{cursor:default}
.ctrls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px}
.fb{margin-top:14px;border-radius:var(--r-md);padding:12px 16px;font-size:17px;display:none;border:2px solid transparent}
.fb.show{display:block;animation:pop .2s ease-out}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.hint{background:var(--warn-soft);border-color:var(--warn)}
.fb.sol{background:var(--bad-soft);border-color:var(--bad)}
.fb.note{background:var(--primary-soft);border-color:var(--primary)}
.fb b.t{display:block;font:800 19px/1.3 var(--f-head);margin-bottom:2px}
.fb.ok b.t{color:var(--ok)} .fb.hint b.t{color:var(--warn)} .fb.sol b.t{color:var(--bad)}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}
.summary{text-align:center}
.summary .stars{font-size:46px;letter-spacing:6px}
.summary h3{font:800 28px/1.2 var(--f-head);margin:6px 0}
.foot{text-align:center;color:var(--muted);font-size:14px;margin-top:30px;letter-spacing:1px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(30px);opacity:0;background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:var(--r-pill);font-weight:700;transition:.2s ease-out;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%)}

/* SVG */
.sv-ink{stroke:var(--ink);fill:none}
.sv-txt{fill:var(--ink);font-family:var(--f-body);font-weight:700}
.sv-muted{fill:var(--muted);font-family:var(--f-body)}
.sv-prot{fill:color-mix(in srgb,var(--primary-soft) 60%,transparent);stroke:var(--primary);stroke-width:1.5}
.sv-tick{stroke:var(--primary)}
.sv-part{fill:var(--surface);stroke:var(--ink);stroke-width:2.5}
.sv-part.on{fill:var(--shade)}
.interactive .sv-part{cursor:pointer}
.sv-bar{fill:var(--shade);stroke:var(--ink);stroke-width:2}
.sv-grid{stroke:var(--dot);stroke-width:1.5}
.sv-ray{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.sv-ray.mov{stroke:var(--primary)}
.sv-handle{fill:var(--primary);stroke:var(--surface);stroke-width:3;cursor:grab}
.sv-dot{fill:var(--star)}
.sv-axis{stroke:var(--ink);stroke-width:2}
.sv-hatch{stroke:var(--muted);stroke-width:1.6}
.sv-excl{fill:var(--muted);fill-opacity:.12;stroke:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:600px){.levels{grid-template-columns:1fr}.answer{font-size:21px}.card{padding:16px}}

/* Chọn lớp */
.tile.grade{min-height:150px;gap:6px}
.tile.grade .gname{font:800 34px/1.1 var(--f-head);color:var(--primary)}
.tile.grade.soon{opacity:.55;box-shadow:none;border-style:dashed}
.tile.grade.soon:hover{transform:none}

/* ---------- Biểu thức THCS: hệ phương trình, dòng công thức (Lớp 9+) ---------- */
.mx{display:block;margin:10px 0 4px;font-size:22px;font-weight:600;overflow-x:auto;white-space:nowrap}
.sys{display:inline-grid;grid-template-columns:auto auto;align-items:center;vertical-align:middle;margin:4px 6px;line-height:1.5;white-space:nowrap;text-align:left}
.sys::before{content:'{';grid-row:1 / 3;font-size:2.7em;font-weight:300;line-height:1;margin-right:2px;transform:scaleX(.65);transform-origin:right}
.sys>span{grid-column:2;display:block}
.sys small{color:var(--muted);font-size:.7em;margin-left:6px}
.choice .sys{margin:0}
.fb .sys{font-size:1em}

/* ---------- Đăng nhập ---------- */
.login{max-width:520px;margin:18px auto 0}
.login h1{margin-top:0}
.login form{display:grid;gap:14px}
.login label{display:grid;gap:6px;font-weight:700;font-size:17px}
.login select,.login input{min-height:52px;border:2.5px solid var(--line);border-radius:var(--r-md);background:var(--surface);color:var(--ink);font:600 19px/1.2 var(--f-body);padding:0 14px}
.login select:focus,.login input:focus{outline:none;border-color:var(--primary);box-shadow:3px 3px 0 var(--primary)}
.btn.big{min-height:56px;font-size:20px;justify-content:center}
.userbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 0;padding:6px 14px;border:2px dashed var(--line);border-radius:var(--r-pill);background:var(--surface);font-size:16px}

/* ---------- Thú cưng ---------- */
.pet{display:block;width:100%;height:100%;overflow:visible}
.pet .pet-body{fill:var(--pb);stroke:var(--pet-ink);stroke-width:2.5;stroke-linejoin:round}
.pet.sp-meo{--pb:var(--pet-meo)} .pet.sp-rong{--pb:var(--pet-rong)} .pet.sp-cu{--pb:var(--pet-cu)} .pet.sp-tho{--pb:var(--pet-tho)}
.pet .pet-belly{fill:var(--pet-belly)}
.pet .pet-egg{fill:var(--pet-egg);stroke:var(--pet-ink);stroke-width:2.5;stroke-linejoin:round}
.pet .pet-spot{fill:var(--pet-spot)}
.pet .pet-crack{fill:none;stroke:var(--pet-ink);stroke-width:2.5;stroke-linejoin:round}
.pet .pet-eye{fill:var(--pet-ink)} .pet .pet-shine{fill:var(--pet-white)}
.pet .pet-cheek{fill:var(--pet-cheek);opacity:.75}
.pet .pet-mouth{fill:none;stroke:var(--pet-ink);stroke-width:2;stroke-linecap:round}
.pet .pet-beak{fill:var(--pet-horn);stroke:var(--pet-ink);stroke-width:1.5;stroke-linejoin:round}

<script>/* assets/js/core.js */
/* =====================================================================
   CORE – hàm tiện ích, bộ dựng câu hỏi (QB, QC, QCmp) và sổ đăng ký lớp.
   ===================================================================== */
const App={grades:[],
  // Mỗi file data/<lớp>.js gọi App.addGrade({...}) một lần rồi dùng G.lesson(...) để thêm bài.
  addGrade(cfg){const g={subject:'Toán',book:'',topics:[],...cfg,lessons:[]};
    g.lesson=(t,id,name,desc,gens)=>{if(g.lessons.some(l=>l.id===id))console.warn('Trùng mã bài',g.id,id);g.lessons.push({t,id,name,desc,gens})};
    App.grades=App.grades.filter(x=>x.id!==g.id);App.grades.push(g);return g}};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const lcm=(a,b)=>a/gcd(a,b)*b;
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const F=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const Fs=(n,d)=>{const g=gcd(n,d);return F(n/g,d/g)};
const NAMES=['An','Bình','Mai','Nam','Lan','Minh','Hoa','Khôi','Ngọc','Phúc','Hà','Tùng'];
const WORD=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín','mười'];
const HANG=['đơn vị','chục','trăm','nghìn','chục nghìn','trăm nghìn','triệu','chục triệu','trăm triệu'];
const LOP=i=>i<3?'đơn vị':i<6?'nghìn':'triệu';
const digitsOf=n=>String(n).split('').reverse().map(Number);
const randDigits=len=>{let s=String(R(1,9));for(let i=1;i<len;i++)s+=R(0,9);return +s};
const uniqPos=n=>{const d=digitsOf(n),c={};d.forEach(x=>c[x]=(c[x]||0)+1);return d.map((_,i)=>i).filter(i=>c[d[i]]===1&&d[i]!==0)};
const cmp=(a,b)=>a<b?'<':a>b?'>':'=';
const joinVa=a=>a.length>1?a.slice(0,-1).join(', ')+' và '+a[a.length-1]:a[0];
const roman=n=>{const m=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let s='';for(const[v,r]of m)while(n>=v){s+=r;n-=v}return s};
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- Bộ dựng câu hỏi ---------- */
// Điền ô trống: tpl dùng [_] (ô số/chữ) và [F] (ô phân số). ans khớp theo thứ tự.
const QB=o=>({kind:'blanks',...o});
// Chọn đáp án: opts chứa ans; mặc định trộn thứ tự.
const QC=o=>{const opts=[...new Set(o.opts)];const arr=o.keepOrder?opts:shuffle(opts);return {kind:'choice',...o,opts:arr,correct:arr.indexOf(o.ans)}};
const QCmp=(text,left,right,a,b,extra={})=>QC({text,expr:`<span class="big">${left} <span style="color:var(--primary)">?</span> ${right}</span>`,opts:['<','>','='],ans:cmp(a,b),keepOrder:true,compact:true,...extra});

/* ---------- Công thức toán bằng LaTeX (MathJax vẽ) – dùng cho lớp 6 trở lên ----------
   tm('x^2+1')  → công thức trong dòng  \( … \)
   td('…')      → công thức đứng riêng một dòng \[ … \]
   tb('5')      → đáp án in đậm trong lời giải
   tpoly([2,'x'],[-3,'y'],[5,''])  → "2x-3y+5" (bỏ hệ số 1, bỏ hạng tử 0)
   tfrac(-6,4) → "-\dfrac{3}{2}" (tự rút gọn)   tf(a,b) → \dfrac{a}{b}
   tsys(['x+y=3','x-y=1'], true) → hệ có nhãn (1), (2)
   Ô trống [_] phải nằm NGOÀI công thức: `${tm('x=')}[_]`                                     */
const tm = s => `\\(${s}\\)`;
const td = s => `<span class="mxd">\\[${s}\\]</span>`;
const tb = s => `<b class="ans">\\(\\mathbf{${s}}\\)</b>`;
const tp = n => n < 0 ? `(${n})` : String(n);
function tpoly(...ts){ let s=''; for(const [c,v] of ts){ if(!c) continue; const a=Math.abs(c), body=v?(a===1?'':a)+v:String(a);
  s += s ? (c<0?' - ':' + ')+body : (c<0?'-':'')+body; } return s || '0'; }
const tf = (a,b) => `\\dfrac{${a}}{${b}}`;
const tfrac = (p,q) => { if(q<0){p=-p;q=-q} const g=gcd(p,q)||1; p/=g; q/=g; return q===1 ? String(p) : (p<0?'-':'')+tf(Math.abs(p),q); };
const tsys = (rows, lab) => `\\begin{cases}${rows.map((r,i)=>lab?`${r} & (${i+1})`:r).join(' \\\\ ')}\\end{cases}`;
const tdec = n => String(+n.toFixed(4)).replace('.', '{,}');

</script>
<script>/* assets/js/figures.js */
/* ---------- Hình SVG ---------- */
const P=(cx,cy,r,deg)=>[cx+r*Math.cos(deg*Math.PI/180),cy-r*Math.sin(deg*Math.PI/180)];
function protractorSVG(theta,{interactive=false}={}){
  const cx=170,cy=178,r=140;let s=`<svg viewBox="-12 0 364 205" role="img" aria-label="Thước đo góc và góc AOB" class="${interactive?'rot':''}">`;
  s+=`<path class="sv-prot" d="M${cx-r} ${cy} A${r} ${r} 0 0 1 ${cx+r} ${cy} Z"/>`;
  for(let d=0;d<=180;d+=5){const L=d%10?7:13;const[a,b]=P(cx,cy,r,d),[c,e]=P(cx,cy,r-L,d);s+=`<line class="sv-tick" x1="${a}" y1="${b}" x2="${c}" y2="${e}" stroke-width="${d%10?1.2:2}"/>`;
    if(d%10===0){const[x,y]=P(cx,cy,r-25,d);s+=`<text class="sv-muted" x="${x}" y="${y+4-(d===0||d===180?12:0)}" font-size="10.5" text-anchor="middle">${d}</text>`}}
  const[ax,ay]=P(cx,cy,158,0),[bx,by]=P(cx,cy,158,theta);
  s+=`<line class="sv-ray" x1="${cx}" y1="${cy}" x2="${ax}" y2="${ay}"/>`;
  s+=`<line class="sv-ray ${interactive?'mov':''}" data-ray x1="${cx}" y1="${cy}" x2="${bx}" y2="${by}"/>`;
  if(interactive)s+=`<circle class="sv-handle" data-handle cx="${bx}" cy="${by}" r="16"/>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="5" class="sv-dot"/><text class="sv-txt" x="${cx-6}" y="${cy+22}" font-size="17">O</text><text class="sv-txt" x="${ax-4}" y="${ay+22}" font-size="17">A</text>`;
  const[lx,ly]=P(cx,cy,176,theta);s+=`<text class="sv-txt" data-lb x="${lx-6}" y="${ly+6}" font-size="17">B</text></svg>`;return s;
}
function angleSVG(theta){
  const rot=theta>=170?0:R(-12,12),cx=theta>100?150:90,cy=theta>150?120:165,L=120;
  const[ax,ay]=P(cx,cy,L,rot),[bx,by]=P(cx,cy,L,rot+theta);
  let mark;if(theta===90){const[p1x,p1y]=P(cx,cy,20,rot),[p3x,p3y]=P(cx,cy,20,rot+90),[p2x,p2y]=P(cx,cy,20*Math.SQRT2,rot+45);mark=`<path class="sv-ink" stroke-width="2.5" d="M${p1x} ${p1y} L${p2x} ${p2y} L${p3x} ${p3y}"/>`}
  else{const[s1,s2]=P(cx,cy,28,rot),[e1,e2]=P(cx,cy,28,rot+theta);mark=`<path class="sv-ink" stroke-width="2.5" d="M${s1} ${s2} A28 28 0 0 0 ${e1} ${e2}"/>`}
  return `<svg viewBox="0 0 300 200" role="img" aria-label="Hình một góc"><line class="sv-ray" x1="${cx}" y1="${cy}" x2="${ax}" y2="${ay}"/><line class="sv-ray" x1="${cx}" y1="${cy}" x2="${bx}" y2="${by}"/>${mark}<circle cx="${cx}" cy="${cy}" r="5" class="sv-dot"/></svg>`;
}
function fracSVG(n,k,shape,interactive){
  let s=`<svg viewBox="0 0 320 ${shape==='circle'?240:(n>6&&n%2===0?200:130)}" role="img" aria-label="Hình chia thành ${n} phần bằng nhau" class="${interactive?'interactive':''}">`;
  if(shape==='circle'){const cx=160,cy=120,r=100;for(let i=0;i<n;i++){const a1=-90+360*i/n,a2=-90+360*(i+1)/n;const x1=cx+r*Math.cos(a1*Math.PI/180),y1=cy+r*Math.sin(a1*Math.PI/180),x2=cx+r*Math.cos(a2*Math.PI/180),y2=cy+r*Math.sin(a2*Math.PI/180);
    s+=`<path class="sv-part ${i<k?'on':''}" data-i="${i}" d="M${cx} ${cy} L${x1} ${y1} A${r} ${r} 0 0 1 ${x2} ${y2} Z"/>`}}
  else{const rows=n>6&&n%2===0?2:1,cols=n/rows,w=Math.min(60,300/cols),h=rows===2?85:100,x0=(320-w*cols)/2;let i=0;
    for(let rr=0;rr<rows;rr++)for(let c=0;c<cols;c++,i++)s+=`<rect class="sv-part ${i<k?'on':''}" data-i="${i}" x="${x0+c*w}" y="${14+rr*h}" width="${w}" height="${h}"/>`}
  return s+'</svg>';
}
function barSVG(labels,vals,step,unit){
  const W=440,H=260,x0=52,y0=215,top=20,max=Math.ceil(Math.max(...vals)/step)*step+step,sc=(y0-top)/max,bw=46,gap=(W-x0-20)/labels.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ cột">`;
  for(let v=0;v<=max;v+=step){const y=y0-v*sc;s+=`<line class="sv-grid" x1="${x0}" y1="${y}" x2="${W-10}" y2="${y}"/><text class="sv-muted" x="${x0-8}" y="${y+5}" font-size="13" text-anchor="end">${v}</text>`}
  labels.forEach((l,i)=>{const x=x0+gap*i+(gap-bw)/2,h=vals[i]*sc;s+=`<rect class="sv-bar" x="${x}" y="${y0-h}" width="${bw}" height="${h}" rx="3"/><text class="sv-txt" x="${x+bw/2}" y="${y0+24}" font-size="15" text-anchor="middle">${l}</text>`});
  s+=`<line class="sv-ink" stroke-width="2.5" x1="${x0}" y1="${y0}" x2="${W-10}" y2="${y0}"/><line class="sv-ink" stroke-width="2.5" x1="${x0}" y1="${top-6}" x2="${x0}" y2="${y0}"/><text class="sv-muted" x="${x0-44}" y="${top-8}" font-size="12">(${unit})</text></svg>`;return s;
}
/* Tam giác vuông tại n[0]: n[0] góc dưới trái, n[1] ở trên, n[2] bên phải.
   w = độ dài cạnh n[0]n[2] (nằm ngang), h = độ dài cạnh n[0]n[1] (thẳng đứng) – chỉ dùng để vẽ đúng tỉ lệ.
   ab, ac, bc: nhãn cạnh; aB, aC: nhãn góc tại n[1], n[2] (true = chỉ vẽ cung, không ghi chữ). */
function rtTriSVG(o={}){
  const n=o.n||['A','B','C'], ratio=Math.max(.4,Math.min(2.6,(o.w||4)/(o.h||3)));
  let w,h; if(ratio>230/150){w=230;h=230/ratio}else{h=150;w=150*ratio}
  const Ax=Math.max(78,(340-w)/2), Ay=182, By=Ay-h, Cx=Ax+w, t=Math.atan2(h,w)*180/Math.PI;
  const T=(x,y,s,a='middle',fs=16)=>`<text class="sv-txt" x="${x}" y="${y}" font-size="${fs}" text-anchor="${a}">${s}</text>`;
  const arc=(cx,cy,a1,a2,lab,anc)=>{const r=26,[x1,y1]=P(cx,cy,r,a1),[x2,y2]=P(cx,cy,r,a2),[lx,ly]=P(cx,cy,r+14,(a1+a2)/2);
    return `<path class="sv-tick" stroke-width="2.5" fill="none" d="M${x1} ${y1} A${r} ${r} 0 0 0 ${x2} ${y2}"/>`+(lab&&lab!==true?T(lx+(anc==='start'?2:-2),ly+(anc==='start'?10:0),lab,anc,14):'')};
  let s=`<svg viewBox="0 0 340 226" role="img" aria-label="Tam giác ${n.join('')} vuông tại ${n[0]}">`;
  s+=`<path class="sv-ink" stroke-width="3" stroke-linejoin="round" d="M${Ax} ${Ay} L${Ax} ${By} L${Cx} ${Ay} Z"/><path class="sv-ink" stroke-width="2" d="M${Ax} ${Ay-14} h14 v14"/>`;
  if(o.aC!=null)s+=arc(Cx,Ay,180-t,180,o.aC,'end');
  if(o.aB!=null)s+=arc(Ax,By,270,360-t,o.aB,'start');
  if(o.ab)s+=T(Ax-10,(Ay+By)/2+5,o.ab,'end');
  if(o.ac)s+=T((Ax+Cx)/2,Ay+26,o.ac);
  if(o.bc){const L=Math.hypot(w,h);s+=T((Ax+Cx)/2+h/L*14,(Ay+By)/2-w/L*14,o.bc,'start')}
  return s+T(Ax-16,Ay+20,n[0],'middle',19)+T(Ax,By-10,n[1],'middle',19)+T(Cx+16,Ay+6,n[2],'middle',19)+'</svg>';
}
/* Mặt phẳng toạ độ Oxy có đường thẳng và phần bị gạch (KNTT: miền nghiệm là phần KHÔNG bị gạch).
   o.x=[xmin,xmax], o.y=[ymin,ymax] (số nguyên, chứa 0)
   o.lines=[[a,b,c,dashed,label]]  vẽ đường ax+by=c (dashed: bờ không thuộc miền nghiệm)
   o.hatch=[[a,b,c]]               gạch phần ax+by > c
   o.pts=[[x,y,label]]             chấm điểm có tên                                               */
let _hatchN=0;
function planeSVG(o={}){
  const [x0,x1]=o.x||[-1,6],[y0,y1]=o.y||[-1,6],u=Math.min(320/(x1-x0),320/(y1-y0)),W=(x1-x0)*u+40,H=(y1-y0)*u+40;
  const X=x=>20+(x-x0)*u, Y=y=>20+(y1-y)*u, id='hx'+(++_hatchN), st=(x1-x0)>14||(y1-y0)>14?2:1;
  const rect=[[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
  const clip=(poly,a,b,c)=>{const out=[],f=p=>a*p[0]+b*p[1]-c;for(let i=0;i<poly.length;i++){const P=poly[i],Q=poly[(i+1)%poly.length],fp=f(P),fq=f(Q);
    if(fp>=0)out.push(P);if((fp>=0)!==(fq>=0)){const t=fp/(fp-fq);out.push([P[0]+t*(Q[0]-P[0]),P[1]+t*(Q[1]-P[1])])}}return out};
  const seg=(a,b,c)=>{const pts=[];const add=(x,y)=>{if(x>=x0-1e-9&&x<=x1+1e-9&&y>=y0-1e-9&&y<=y1+1e-9&&!pts.some(p=>Math.hypot(p[0]-x,p[1]-y)<1e-6))pts.push([x,y])};
    if(b){add(x0,(c-a*x0)/b);add(x1,(c-a*x1)/b)} if(a){add((c-b*y0)/a,y0);add((c-b*y1)/a,y1)} return pts.slice(0,2)};
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mặt phẳng toạ độ Oxy" style="max-height:380px"><defs><pattern id="${id}" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" class="sv-hatch"/></pattern></defs>`;
  for(let x=x0;x<=x1;x++)s+=`<line class="sv-grid" x1="${X(x)}" y1="${Y(y0)}" x2="${X(x)}" y2="${Y(y1)}"/>`;
  for(let y=y0;y<=y1;y++)s+=`<line class="sv-grid" x1="${X(x0)}" y1="${Y(y)}" x2="${X(x1)}" y2="${Y(y)}"/>`;
  (o.hatch||[]).forEach(([a,b,c])=>{const P=clip(rect,a,b,c);if(P.length>2){const d=P.map(p=>`${X(p[0])},${Y(p[1])}`).join(' ');s+=`<polygon class="sv-excl" points="${d}"/><polygon points="${d}" fill="url(#${id})" stroke="none"/>`}});
  s+=`<line class="sv-axis" x1="${X(x0)}" y1="${Y(0)}" x2="${X(x1)+12}" y2="${Y(0)}"/><line class="sv-axis" x1="${X(0)}" y1="${Y(y0)}" x2="${X(0)}" y2="${Y(y1)-12}"/>`;
  s+=`<path class="sv-axis" fill="none" d="M${X(x1)+5} ${Y(0)-5} L${X(x1)+12} ${Y(0)} L${X(x1)+5} ${Y(0)+5} M${X(0)-5} ${Y(y1)-5} L${X(0)} ${Y(y1)-12} L${X(0)+5} ${Y(y1)-5}"/>`;
  s+=`<text class="sv-txt" x="${X(x1)+6}" y="${Y(0)+20}" font-size="15">x</text><text class="sv-txt" x="${X(0)+8}" y="${Y(y1)-6}" font-size="15">y</text><text class="sv-muted" x="${X(0)-5}" y="${Y(0)+15}" font-size="12" text-anchor="end">O</text>`;
  for(let x=x0;x<=x1;x++)if(x&&x%st===0)s+=`<text class="sv-muted" x="${X(x)}" y="${Y(0)+15}" font-size="11" text-anchor="middle">${x}</text>`;
  for(let y=y0;y<=y1;y++)if(y&&y%st===0)s+=`<text class="sv-muted" x="${X(0)-5}" y="${Y(y)+4}" font-size="11" text-anchor="end">${y}</text>`;
  (o.lines||[]).forEach(([a,b,c,dash,lab])=>{const P=seg(a,b,c);if(P.length<2)return;
    s+=`<line class="sv-ink" stroke-width="2.6" ${dash?'stroke-dasharray="8 6"':''} x1="${X(P[0][0])}" y1="${Y(P[0][1])}" x2="${X(P[1][0])}" y2="${Y(P[1][1])}"/>`;
    if(lab){const q=P[0][1]>P[1][1]?P[0]:P[1];s+=`<text class="sv-txt" x="${Math.min(X(q[0])+6,W-18)}" y="${Math.max(Y(q[1])+14,14)}" font-size="14">${lab}</text>`}});

  return s+'</svg>';
}
/* Tam giác ABC bất kì vẽ theo độ dài ba cạnh a = BC, b = CA, c = AB (chỉ để lấy hình dạng).
   o.n=['A','B','C'] tên đỉnh · o.la, o.lb, o.lc nhãn cạnh BC, CA, AB · o.gA, o.gB, o.gC nhãn góc (true = chỉ vẽ cung). */
function triSVG(o={}){
  const n=o.n||['A','B','C'], a=o.a||7, b=o.b||5, c=o.c||8;
  let Ax=(c*c+a*a-b*b)/(2*a), Ay=Math.sqrt(Math.max(0,c*c-Ax*Ax));
  const xs=[0,a,Ax], minX=Math.min(...xs), spanX=Math.max(...xs)-minX, sc=Math.min(250/spanX,150/Math.max(Ay,1e-6));
  const W=320,H=220, ox=(W-spanX*sc)/2-minX*sc, oy=(H+Ay*sc)/2+4;
  const P={A:[ox+Ax*sc,oy-Ay*sc],B:[ox,oy],C:[ox+a*sc,oy]}, G=[(P.A[0]+P.B[0]+P.C[0])/3,(P.A[1]+P.B[1]+P.C[1])/3];
  const T=(x,y,s,fs=16,anc='middle')=>`<text class="sv-txt" x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="${fs}" text-anchor="${anc}" dominant-baseline="middle">${s}</text>`;
  const out=(p,d)=>{const vx=p[0]-G[0],vy=p[1]-G[1],L=Math.hypot(vx,vy)||1;return [p[0]+vx/L*d,p[1]+vy/L*d]};
  let s=`<svg viewBox="0 0 ${W} ${H+18}" role="img" aria-label="Tam giác ${n.join('')}"><path class="sv-ink" stroke-width="3" stroke-linejoin="round" d="M${P.A} L${P.B} L${P.C} Z"/>`;
  const arc=(V,U1,U2,lab)=>{const r=24,a1=Math.atan2(-(U1[1]-V[1]),U1[0]-V[0]),a2=Math.atan2(-(U2[1]-V[1]),U2[0]-V[0]);let d=a2-a1;while(d<=-Math.PI)d+=2*Math.PI;while(d>Math.PI)d-=2*Math.PI;
    const p1=[V[0]+r*Math.cos(a1),V[1]-r*Math.sin(a1)],p2=[V[0]+r*Math.cos(a1+d),V[1]-r*Math.sin(a1+d)],m=a1+d/2;
    return `<path class="sv-tick" stroke-width="2.5" fill="none" d="M${p1} A${r} ${r} 0 0 ${d>0?0:1} ${p2}"/>`+(lab&&lab!==true?T(V[0]+(r+18)*Math.cos(m),V[1]-(r+18)*Math.sin(m),lab,14):'')};
  if(o.gA!=null)s+=arc(P.A,P.B,P.C,o.gA); if(o.gB!=null)s+=arc(P.B,P.C,P.A,o.gB); if(o.gC!=null)s+=arc(P.C,P.A,P.B,o.gC);
  const side=(U,V,lab)=>{if(!lab)return'';const m=[(U[0]+V[0])/2,(U[1]+V[1])/2],q=out(m,16);return T(q[0],q[1],lab,15)};
  s+=side(P.B,P.C,o.la)+side(P.C,P.A,o.lb)+side(P.A,P.B,o.lc);
  ['A','B','C'].forEach((k,i)=>{const q=out(P[k],16);s+=T(q[0],q[1],n[i],19)});
  return s+'</svg>';
}
/* Nửa đường tròn đơn vị với điểm M ứng với góc xOM = deg (0..180). */
function halfCircleSVG(deg,o={}){
  const cx=160,cy=160,R=120,t=deg*Math.PI/180,Mx=cx+R*Math.cos(t),My=cy-R*Math.sin(t);
  const T=(x,y,s,fs=15,anc='middle',cls='sv-txt')=>`<text class="${cls}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="${fs}" text-anchor="${anc}">${s}</text>`;
  let s=`<svg viewBox="0 0 320 200" role="img" aria-label="Nửa đường tròn đơn vị">`;
  s+=`<line class="sv-axis" x1="20" y1="${cy}" x2="306" y2="${cy}"/><line class="sv-axis" x1="${cx}" y1="${cy+14}" x2="${cx}" y2="16"/>`;
  s+=`<path class="sv-axis" fill="none" d="M300 ${cy-5} L307 ${cy} L300 ${cy+5} M${cx-5} 22 L${cx} 15 L${cx+5} 22"/>`;
  s+=`<path class="sv-ink" stroke-width="2.5" fill="none" d="M${cx-R} ${cy} A${R} ${R} 0 0 1 ${cx+R} ${cy}"/>`;
  s+=`<line class="sv-ink" stroke-width="1.6" stroke-dasharray="5 4" x1="${Mx}" y1="${My}" x2="${Mx}" y2="${cy}"/><line class="sv-ink" stroke-width="1.6" stroke-dasharray="5 4" x1="${Mx}" y1="${My}" x2="${cx}" y2="${My}"/>`;
  s+=`<line class="sv-ray" style="stroke-width:3" x1="${cx}" y1="${cy}" x2="${Mx}" y2="${My}"/>`;
  const r=30,a2=t;s+=`<path class="sv-tick" stroke-width="2.5" fill="none" d="M${cx+r} ${cy} A${r} ${r} 0 0 0 ${cx+r*Math.cos(a2)} ${cy-r*Math.sin(a2)}"/>`;
  s+=T(cx+(r+14)*Math.cos(t/2),cy-(r+14)*Math.sin(t/2)+5,o.alpha||'α',16);
  s+=`<circle class="sv-dot" cx="${Mx}" cy="${My}" r="5"/>`+T(Mx+(deg>90?-10:10),My-10,'M',17,deg>90?'end':'start');
  s+=T(Mx,cy+20,o.x0||'x₀',14)+T(cx+(deg>90?8:-8),My+5,o.y0||'y₀',14,deg>90?'start':'end');
  s+=T(cx-R,cy+20,'−1',13,'middle','sv-muted')+T(cx+R,cy+20,'1',13,'middle','sv-muted')+T(cx-10,cy+18,'O',14,'middle','sv-muted')+T(cx+8,cy-R-4,'1',13,'start','sv-muted')+T(308,cy+20,'x',15)+T(cx+10,20,'y',15,'start');
  return s+'</svg>';
}

<script>/* assets/js/generators.js */
/* ---------- Bộ sinh câu hỏi dùng chung ---------- */
function gPlace(len,withLop){return()=>{let n,pos;do{n=randDigits(len);pos=uniqPos(n)}while(!pos.length);const p=pick(pos),d=digitsOf(n)[p];
  const lab=i=>'Hàng '+HANG[i]+(withLop?', lớp '+LOP(i):'');const others=shuffle([...Array(len).keys()].filter(i=>i!==p)).slice(0,3);
  return QC({text:`Trong số <b>${fmt(n)}</b>, chữ số <b>${d}</b> thuộc hàng nào${withLop?', lớp nào':''}?`,opts:[lab(p),...others.map(lab)],ans:lab(p),
   hint:`Đếm từ phải sang trái: đơn vị, chục, trăm, nghìn, chục nghìn, trăm nghìn, triệu…${withLop?' Cứ 3 hàng tạo thành một lớp.':''}`,
   sol:`Chữ số ${d} đứng ở vị trí thứ ${p+1} tính từ phải sang, nên thuộc <b>${lab(p).toLowerCase()}</b>.`})}}
function gValue(len){return()=>{let n,pos;do{n=randDigits(len);pos=uniqPos(n).filter(i=>i>0)}while(!pos.length);const p=pick(pos),d=digitsOf(n)[p],v=d*10**p;
  return QB({text:`Giá trị của chữ số <b>${d}</b> trong số <b>${fmt(n)}</b> là:`,tpl:'[_]',ans:[v],wide:true,hint:`Chữ số ${d} ở hàng ${HANG[p]}, nên giá trị là ${d} × ${fmt(10**p)}.`,sol:`Chữ số ${d} ở hàng ${HANG[p]} → giá trị là <b>${fmt(v)}</b>.`})}}
function gCompose(len){return lv=>{const d=[];for(let i=0;i<len;i++)d.push(i===len-1?R(1,9):(lv>=2&&Math.random()<.35?0:R(1,9)));const n=d.reduce((s,x,i)=>s+x*10**i,0);
  const parts=[];for(let i=len-1;i>=0;i--)if(d[i])parts.push(`${d[i]} ${HANG[i]}`);
  return QB({text:`Số gồm ${joinVa(parts)} viết là:`,tpl:'[_]',ans:[n],wide:true,hint:`Viết lần lượt từng chữ số từ hàng cao nhất (${HANG[len-1]}) xuống hàng đơn vị. Hàng nào không có thì viết chữ số 0.`,sol:`Số cần viết là <b>${fmt(n)}</b>.`})}}
function gCmp(len){return lv=>{const a=randDigits(len);let b;
  if(Math.random()<.12)b=a;else{do{const p=lv===1?len-1-R(0,1):R(0,Math.max(1,len-3));b=a+(Math.random()<.5?1:-1)*R(1,9)*10**p}while(String(b).length!==len||b===a)}
  return QCmp('Chọn dấu thích hợp:',fmt(a),fmt(b),a,b,{hint:len===String(b).length?'Hai số có cùng số chữ số: so sánh từng cặp chữ số từ trái sang phải.':'Số nào có nhiều chữ số hơn thì lớn hơn.',sol:`${fmt(a)} <b>${cmp(a,b)}</b> ${fmt(b)}.`})}}
function gRound(len,pChoices){return()=>{const p=pick(pChoices),n=randDigits(len),r=Math.round(n/10**p)*10**p,dd=digitsOf(n)[p-1];
  return QB({text:`Làm tròn số <b>${fmt(n)}</b> đến hàng <b>${HANG[p]}</b> ta được:`,tpl:'[_]',ans:[r],wide:true,hint:`Nhìn chữ số hàng ${HANG[p-1]} (là ${dd}): bé hơn 5 thì làm tròn xuống, từ 5 trở lên thì làm tròn lên.`,sol:`Chữ số hàng ${HANG[p-1]} là ${dd} ${dd<5?'< 5 → làm tròn xuống':'≥ 5 → làm tròn lên'}: <b>${fmt(r)}</b>.`})}}
function gAddSub(len){return lv=>{const L=lv===1?len-1:len;const add=Math.random()<.5;let a=randDigits(L),b=randDigits(L-(lv===3?0:1));if(!add&&b>a)[a,b]=[b,a];const r=add?a+b:a-b;
  return QB({text:'Tính:',tpl:`<span class="eq">${fmt(a)} ${add?'+':'−'} ${fmt(b)} = [_]</span>`,ans:[r],wide:true,hint:`Đặt tính thẳng cột, ${add?'cộng':'trừ'} từ phải sang trái, nhớ ${add?'1 sang hàng bên trái':'1 vào hàng bên trái khi mượn'}.`,sol:`${fmt(a)} ${add?'+':'−'} ${fmt(b)} = <b>${fmt(r)}</b>.`})}}
function gFindX(len){return lv=>{const t=pick(lv===1?[0,1]:[0,1,2]);const x=randDigits(len-1),a=randDigits(len-1);let tpl,b,sol;
  if(t===0){b=x+a;tpl=`[_] + ${fmt(a)} = ${fmt(b)}`;sol=`Số hạng chưa biết = tổng − số hạng đã biết = ${fmt(b)} − ${fmt(a)} = <b>${fmt(x)}</b>.`}
  else if(t===1){b=x;const y=x+a;tpl=`[_] − ${fmt(a)} = ${fmt(b)}`;sol=`Số bị trừ = hiệu + số trừ = ${fmt(b)} + ${fmt(a)} = <b>${fmt(y)}</b>.`;return QB({text:'Tìm số thích hợp điền vào ô trống:',tpl:`<span class="eq">${tpl}</span>`,ans:[y],wide:true,hint:'Muốn tìm số bị trừ, lấy hiệu cộng với số trừ.',sol})}
  else{const big=x+a;tpl=`${fmt(big)} − [_] = ${fmt(a)}`;sol=`Số trừ = số bị trừ − hiệu = ${fmt(big)} − ${fmt(a)} = <b>${fmt(x)}</b>.`}
  return QB({text:'Tìm số thích hợp điền vào ô trống:',tpl:`<span class="eq">${tpl}</span>`,ans:[x],wide:true,hint:t===0?'Muốn tìm số hạng chưa biết, lấy tổng trừ đi số hạng đã biết.':'Muốn tìm số trừ, lấy số bị trừ trừ đi hiệu.',sol})}}

/* Góc */
const angCat=t=>t<90?'Góc nhọn':t===90?'Góc vuông':t<180?'Góc tù':'Góc bẹt';
const ANG_OPTS=['Góc nhọn','Góc vuông','Góc tù','Góc bẹt'];

function randAngle(step){let t;do{t=R(1,Math.floor(180/step)-1)*step}while(t===90&&Math.random()<.5);return t}
const gReadProt=lv=>{const t=randAngle(lv===1?10:5);return QB({text:'Dùng thước đo góc: góc đỉnh O, cạnh OA, OB có số đo là bao nhiêu?',fig:protractorSVG(t),tpl:'Góc AOB = [_]°',ans:[t],hint:'Tâm thước trùng đỉnh O, cạnh OA đi qua vạch 0. Đọc số ở vạch mà cạnh OB đi qua.',sol:`Cạnh OB đi qua vạch <b>${t}</b>, nên góc AOB = <b>${t}°</b>.`})};
const gRotate=lv=>{const t=randAngle(lv===1?10:5);return {kind:'rotate',text:`Kéo (hoặc bấm nút) xoay cạnh OB để góc AOB bằng <b>${t}°</b>.`,target:t,val:90===t?40:90,step:5,hint:'Cạnh OA nằm ở vạch 0. Hãy đưa cạnh OB tới đúng vạch ghi số đo cần tìm.',sol:`Cạnh OB phải đi qua vạch <b>${t}</b> của thước.`}};
const gAngType=()=>{const t=pick([R(3,8)*10,90,R(10,17)*10,180,R(2,17)*5]);return QC({text:'Góc trong hình là góc gì?',fig:angleSVG(t),opts:ANG_OPTS,ans:angCat(t),keepOrder:true,hint:angHint+' Dùng ê-ke để kiểm tra.',sol:`Đó là <b>${angCat(t).toLowerCase()}</b>.`})};
const gAngDeg=()=>{const t=pick([R(2,17)*5,R(19,35)*5,90,180]);return QC({text:`Góc có số đo <b>${t}°</b> là:`,opts:ANG_OPTS,ans:angCat(t),keepOrder:true,hint:angHint,sol:`${t}° ${t<90?'< 90°':t===90?'= 90°':t<180?'lớn hơn 90° và bé hơn 180°':'= 180°'} → <b>${angCat(t).toLowerCase()}</b>.`})};
const gAngWhich=()=>{const cat=pick(['Góc nhọn','Góc tù']);const good=cat==='Góc nhọn'?R(2,17)*5:R(19,35)*5;const bad=shuffle(cat==='Góc nhọn'?[90,180,R(19,35)*5,R(19,35)*5]:[90,180,R(2,17)*5,R(2,17)*5]).slice(0,3);
  return QC({text:`Trong các góc có số đo dưới đây, góc nào là <b>${cat.toLowerCase()}</b>?`,opts:[good,...bad].map(x=>x+'°'),ans:good+'°',hint:angHint,sol:`Góc <b>${good}°</b> là ${cat.toLowerCase()}.`})};

function gConv(U,wordCtx){ // U: [{n,f}] từ bé đến lớn
  const pair=maxR=>{let i,j;do{i=R(0,U.length-2);j=R(i+1,U.length-1)}while(U[j].f/U[i].f>maxR);return[U[i],U[j]]};
  return lv=>{const t=lv===1?0:lv===2?pick([1,2]):pick([2,3,4]);
    if(t===0){const[s,b]=pair(1000),k=R(2,9);return QB({text:'Điền số thích hợp:',tpl:`${k} ${b.n} = [_] ${s.n}`,ans:[k*b.f/s.f],hint:`1 ${b.n} = ${fmt(b.f/s.f)} ${s.n}.`,sol:`${k} ${b.n} = ${k} × ${fmt(b.f/s.f)} = <b>${fmt(k*b.f/s.f)}</b> ${s.n}.`})}
    if(t===1){const[s,b]=pair(1000),q=b.f/s.f,k=R(2,9),m=R(1,q-1),v=k*q+m;return QB({text:'Điền số thích hợp:',tpl:`${k} ${b.n} ${m} ${s.n} = [_] ${s.n}`,ans:[v],wide:true,hint:`Đổi ${k} ${b.n} ra ${s.n} trước (1 ${b.n} = ${fmt(q)} ${s.n}), rồi cộng thêm ${m} ${s.n}.`,sol:`${k} ${b.n} = ${fmt(k*q)} ${s.n}; ${fmt(k*q)} + ${m} = <b>${fmt(v)}</b> ${s.n}.`})}
    if(t===2){const[s,b]=pair(1000),q=b.f/s.f,k=R(2,40);return QB({text:'Điền số thích hợp:',tpl:`${fmt(k*q)} ${s.n} = [_] ${b.n}`,ans:[k],hint:`${fmt(q)} ${s.n} = 1 ${b.n}. Lấy ${fmt(k*q)} chia cho ${fmt(q)}.`,sol:`${fmt(k*q)} : ${fmt(q)} = <b>${k}</b> → ${fmt(k*q)} ${s.n} = ${k} ${b.n}.`})}
    if(t===3){const[s,b]=pair(1000),q=b.f/s.f,k=R(2,9),m=R(1,q-1),v=k*q+m;const other=v+pick([-1,1])*R(1,3)*(q>=100?q/10:1)*(Math.random()<.3?0:1);
      return QCmp('Chọn dấu thích hợp:',`${k} ${b.n} ${m} ${s.n}`,`${fmt(other)} ${s.n}`,v,other,{hint:`Đổi về cùng đơn vị ${s.n} rồi so sánh.`,sol:`${k} ${b.n} ${m} ${s.n} = ${fmt(v)} ${s.n}, nên chọn dấu <b>${cmp(v,other)}</b>.`})}
    return wordCtx(lv);}}

window.MathJax = {
  loader: { load: [] },
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']], processEscapes: false },
  chtml: { scale: 1.05, matchFontHeight: false, displayAlign: 'left', displayIndent: '0' },
  options: { enableMenu: false, ignoreHtmlClass: 'no-math', processHtmlClass: 'math' },
  startup: {
    typeset: false,
    ready() {
      MathJax.startup.defaultReady();
      MathJax.startup.promise.then(() => MathTS.start());
    },
  },
};

const MathTS = (() => {
  let queued = new Set(), timer = null, busy = Promise.resolve();
  const HAS = /\\\(|\\\[/;
  function flush() {
    timer = null;
    const nodes = [...queued]; queued.clear();
    if (!window.MathJax || !MathJax.typesetPromise) return;
    busy = busy.then(async () => {
      for (const n of nodes) {
        if (!n.isConnected || !HAS.test(n.textContent)) continue;
        try { await MathJax.typesetPromise([n]); }
        catch (e) { if (n.isConnected) setTimeout(() => add(n), 30); }   // nội dung vừa bị thay khi đang vẽ → vẽ lại
      }
    });
  }
  function add(n) {
    if (!n || n.nodeType !== 1) n = n && n.parentElement;
    if (!n || n.closest('mjx-container')) return;
    queued.add(n); if (!timer) timer = setTimeout(flush, 0);
  }
  function start() {
    add(document.body);
    new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(add)))
      .observe(document.body, { childList: true, subtree: true });
  }
  return { start, typeset: add };
})();

</script>

<script>/* assets/js/sound.js */
/* =====================================================================
   SOUND – âm thanh khi chấm: đúng → CONFIG.sounds.ok, sai → CONFIG.sounds.bad.
   Mỗi loại là danh sách nguồn, thử lần lượt (file trong dự án trước, link ngoài sau).
   Học sinh bật/tắt bằng nút 🔊 cạnh nút đổi giao diện; lựa chọn lưu trên máy.
   ===================================================================== */
const Sound = (() => {
  const SRC = (typeof CONFIG !== 'undefined' && CONFIG.sounds) || {};
  let on = store.get('hoctap:sound'); if (on === null) on = true;
  const cache = {};
  function get(k) {
    if (cache[k]) return cache[k];
    const list = [].concat(SRC[k] || []); if (!list.length) return null;
    let i = 0; const a = new Audio(); a.preload = 'auto';
    a.addEventListener('error', () => { if (++i < list.length) { a.src = list[i]; a.load(); } });
    a.src = list[0]; return (cache[k] = a);
  }
  function play(k) {
    if (!on) return;
    try { const a = get(k); if (!a) return; a.currentTime = 0; const p = a.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
  }
  function toggle() { on = !on; store.set('hoctap:sound', on); if (on) play('ok'); return on; }
  try { get('ok'); get('bad'); } catch (e) {}
  return { play, toggle, get on() { return on; } };
})();

</script>
<script>/* assets/js/account.js */
/* =====================================================================
   ACCOUNT – Đăng nhập theo lớp (Google Sheets) và thú cưng tiến hoá.
   - Nếu CONFIG.sheetAPI để trống: không cần đăng nhập, thú cưng vẫn chạy (lưu trên máy).
   - Nếu có sheetAPI: học sinh chọn lớp + tài khoản + mật khẩu; tiến độ lưu theo từng em
     trên máy và gửi về Google Sheet của giáo viên (xem tools/apps-script/).
   Nạp SAU generators.js và TRƯỚC engine.js. Engine gọi Account.on(sự kiện, …).
   ===================================================================== */
const Account = (() => {
  const API = () => String(CONFIG.sheetAPI || '').trim();
  const LS = {
    get(k){ try{ return JSON.parse(localStorage.getItem(k)) }catch(e){ return null } },
    set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} },
    del(k){ try{ localStorage.removeItem(k) }catch(e){} },
  };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let user = API() ? LS.get('hoctap:session') : null;          // {token, name, lop, user}

  /* ---- Mỗi học sinh một “ngăn” lưu riêng trên cùng một máy ---- */
  const rawGet = store.get.bind(store), rawSet = store.set.bind(store);
  const SKIP = new Set(['hoctap:theme','hoctap:session','hoctap:queue']);
  const ns = k => (user && k.startsWith('hoctap:') && !SKIP.has(k)) ? `hoctap:u:${user.lop}|${user.user}:${k.slice(7)}` : k;
  store.get = k => rawGet(ns(k));
  store.set = (k,v) => rawSet(ns(k), v);

  /* ---- Gọi Apps Script (POST text/plain để không cần preflight CORS) ---- */
  async function api(body){
    const r = await fetch(API(), { method:'POST', body: JSON.stringify(body), redirect:'follow' });
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }
  const queue = () => LS.get('hoctap:queue') || [];
  async function flush(){
    if(!API() || !navigator.onLine) return;
    let q = queue(); if(!q.length) return;
    const rest = [];
    for(const item of q){ try{ const r = await api(item); if(!r.ok && r.code !== 'auth') rest.push(item); }catch(e){ rest.push(item) } }
    LS.set('hoctap:queue', rest);
  }
  function send(body){
    if(!API() || !user) return;
    const item = {...body, action:'save', token:user.token};
    api(item).then(r => { if(!r.ok){ if(r.code==='auth') expired(); else LS.set('hoctap:queue', [...queue(), item]); } else flush(); })
             .catch(() => LS.set('hoctap:queue', [...queue(), item]));
  }
  let playBusy = false;
  function syncPlay(play){
    if(!API() || !user || playBusy) return; playBusy = true;
    api({action:'play', token:user.token, play}).then(r => { if(!r.ok && r.code==='auth') expired(); }).catch(() => {}).finally(() => playBusy = false);
  }
  const rank = () => api({action:'rank', token:user.token});
  const P = () => typeof Play !== 'undefined';
  function expired(){ toastSafe('Phiên đăng nhập đã hết hạn, em đăng nhập lại nhé.'); setTimeout(logout, 1500); }
  function logout(){ LS.del('hoctap:session'); user = null; location.hash = '#/'; location.reload(); }
  const toastSafe = m => { try{ toast(m) }catch(e){} };

  /* ---- Chỉ hiện đúng khối của lớp: "10A12" → lop10, "9A" → lop9 ----
     Lớp không có số (vd "GV") hoặc khối chưa có nội dung → hiện mọi khối. Tắt bằng CONFIG.lockGrade = false. */
  const gradeOfClass = lop => { const m = String(lop || '').match(/\d{1,2}/); return m ? 'lop' + (+m[0]) : null; };
  function restrict(){
    if(!user || CONFIG.lockGrade === false) return;
    const id = gradeOfClass(user.lop), g = id && App.grades.find(x => x.id === id);
    if(!g) return;
    App.grades = [g]; CONFIG.upcoming = [];
    const h = location.hash.match(/^#\/([\w-]+)/);
    if(!h || h[1] !== g.id) location.replace('#/' + g.id);
  }

  /* ---- Màn hình đăng nhập ---- */
  function gate(start, opt={}){
    if(!API() || user){ restrict(); start(); flush(); return; }
    const app = document.getElementById('app');
    app.innerHTML = `<div class="login card">
      <h1>${opt.title || 'Chào em! 👋'}</h1><p class="lead">${opt.lead || 'Chọn lớp rồi đăng nhập bằng tài khoản thầy cô đã phát.'}</p>
      <form id="lgForm" autocomplete="off">
        <label>Lớp<select id="lgLop" required><option value="">Đang tải danh sách lớp…</option></select></label>
        <label>Tài khoản<input id="lgUser" required autocapitalize="none" spellcheck="false" inputmode="text"></label>
        <label>Mật khẩu<input id="lgPass" type="password" required></label>
        <div class="fb" id="lgMsg"></div>
        <button class="btn primary big" id="lgBtn" type="submit">Đăng nhập</button>
      </form></div><p class="foot">${esc(CONFIG.author)}</p>`;
    const sel = $('#lgLop'), msg = $('#lgMsg'), btn = $('#lgBtn');
    const say = (t, type='sol') => { msg.className = `fb show ${type}`; msg.innerHTML = t; };
    const loadClasses = () => api({action:'classes'}).then(r => {
      if(!r.ok) throw new Error(r.msg);
      sel.innerHTML = `<option value="">— Chọn lớp —</option>` + r.classes.map(c => `<option>${esc(c)}</option>`).join('');
      const last = LS.get('hoctap:lastLop'); if(last && r.classes.includes(last)) sel.value = last;
    }).catch(() => { sel.innerHTML = `<option value="">Không tải được</option>`; say('Không kết nối được máy chủ. Em kiểm tra mạng rồi bấm <b>Thử lại</b>. <button type="button" class="btn small" id="lgRetry">Thử lại</button>'); $('#lgRetry').onclick = () => { msg.className='fb'; loadClasses(); }; });
    loadClasses();
    $('#lgForm').onsubmit = async e => {
      e.preventDefault();
      const lop = sel.value, u = $('#lgUser').value.trim(), p = $('#lgPass').value;
      if(!lop){ say('Em chọn lớp trước nhé.','note'); return; }
      btn.disabled = true; btn.textContent = 'Đang đăng nhập…';
      try{
        const ua = navigator.userAgent, device = /iPad|Macintosh/.test(ua) && 'ontouchend' in document ? 'iPad' : /iPhone/.test(ua) ? 'iPhone' : /Android/.test(ua) ? (/Mobile/.test(ua) ? 'Điện thoại Android' : 'Máy tính bảng Android') : /Windows/.test(ua) ? 'Máy tính Windows' : /Mac/.test(ua) ? 'Máy Mac' : 'Khác';
        const r = await api({action:'login', lop, user:u, pass:p, device});
        if(!r.ok){ say(esc(r.msg || 'Sai tài khoản hoặc mật khẩu.')); return; }
        user = {token:r.token, name:r.name, lop:r.lop, user:r.user};
        LS.set('hoctap:session', user); LS.set('hoctap:lastLop', lop);
        if(P()){ Play.reset(); Play.adopt(r.play); }
        Object.entries(r.progress || {}).forEach(([k,v]) => { const key = 'hoctap:'+k; if((+v||0) > (store.get(key)||0)) store.set(key, +v); });
        App.grades.forEach(g => store.set(`hoctap:petseen:${g.id}`, Pet.stage(g)));   // không bật màn tiến hoá khi vừa đăng nhập
        restrict(); start();
      }catch(err){ say('Không kết nối được máy chủ. Em thử lại sau ít phút nhé.'); }
      finally{ btn.disabled = false; btn.textContent = 'Đăng nhập'; }
    };
  }
  const isTeacher = () => !!user && !/\d/.test(user.lop);        // lớp không có chữ số (vd "GV") = giáo viên
  const userBar = () => user ? `<div class="userbar"><span>👋 <b>${esc(user.name)}</b> · ${esc(user.lop)}</span>${isTeacher() && !/giao-vien/.test(location.pathname) ? '<a class="linkbtn" href="giao-vien/">📚 Bài giảng</a>' : ''}<button class="linkbtn" data-logout>Đăng xuất</button></div>` : '';
  const bindLogout = () => $$('[data-logout]').forEach(b => b.onclick = () => { if(queue().length) flush(); logout(); });

  /* ---- Sự kiện từ engine ---- */
  function on(ev, a, b){
    if(ev === 'answer'){ if(P()) Play.on('answer', a); return; }
    if(ev === 'picker'){
      $('#app').insertAdjacentHTML('afterbegin', userBar()); bindLogout();
      App.grades.forEach(g => { const t = $(`.tile.grade[href="#/${g.id}"]`); if(t) t.insertAdjacentHTML('beforeend', `<span class="tile-pet">${Pet.svg(g, Pet.stage(g))}</span>`); });
    }
    if(ev === 'home'){
      $('#app').insertAdjacentHTML('afterbegin', userBar()); bindLogout();
      const lead = $('#app .lead'); if(lead) lead.insertAdjacentHTML('afterend', Pet.card(a));
      Pet.bindCard(); if(P()) Play.on('home', a);
    }
    if(ev === 'lesson'){
      const tb = $('#app .toolbar .tbtns') || $('#app .toolbar #themeBtn'); if(tb){ const s = gradeStars(a); tb.insertAdjacentHTML('beforebegin', `<a class="pet-mini" href="#/${a.id}" title="Thú cưng của em">${Pet.svg(a, Pet.stage(a))}<b>${s}⭐</b></a>`); }
      if(P()) Play.on('lesson', a);
    }
    if(ev === 'done'){
      const {g, l, lv, st, pts, n} = a;
      if(P()) Play.on('done', a);
      Pet.check(g);
      send({ key:`${g.id}:${l.id}:${lv}`, stars: store.get(`hoctap:${g.id}:${l.id}:${lv}`) || 0, setStars: st, score: pts, total: n,
             grade: g.name, lesson: l.name, level: lv, gradeStars: gradeStars(g), pet: Pet.name(g, Pet.stage(g)), summary: Pet.summary(), play: P() ? Play.snapshot() : '' });
    }
  }
  addEventListener('online', flush);
  return { gate, on, get user(){ return user }, logout, flush, syncPlay, rank, gradeOfClass, isTeacher, userBar, bindLogout };
})();

/* =====================================================================
   PET – thú cưng 5 cấp cho mỗi khối lớp, vẽ bằng SVG (màu lấy từ biến CSS).
   ===================================================================== */
const Pet = (() => {
  const SPECIES = { lop4:['meo','Mèo Mây'], lop9:['rong','Rồng Lửa'], lop10:['cu','Cú Tí Hon'], lop11:['tho','Thỏ Bông'] };
  const ORDER = ['meo','rong','cu','tho'], NAMES = {meo:'Mèo Mây', rong:'Rồng Lửa', cu:'Cú Tí Hon', tho:'Thỏ Bông'};
  const sp = g => SPECIES[g.id] ? SPECIES[g.id][0] : ORDER[Math.max(0, App.grades.indexOf(g)) % 4];
  const nm = g => NAMES[sp(g)];
  const STAGE = ['Quả trứng bí ẩn', 'Trứng sắp nở', 'Bé {n}', '{n}', '{n} Vương'];
  const MSG = ['', 'Quả trứng đang rung rinh… sắp nở rồi!', 'Trứng đã nở! Chào bé {n}!', '{n} đã lớn phổng phao rồi!', '{n} đã đội vương miện! Em thật xuất sắc! 👑'];
  function thresholds(g){ const M = g.lessons.length * 9, t = [0, 3, Math.max(6, Math.ceil(.15*M)), Math.ceil(.4*M), Math.ceil(.75*M)];
    for(let i = 2; i < 5; i++) if(t[i] <= t[i-1]) t[i] = t[i-1] + 2; return t; }
  const stage = g => { const s = gradeStars(g), t = thresholds(g); let k = 0; t.forEach((v,i) => { if(s >= v) k = i }); return k; };
  const name = (g, k) => STAGE[k].replace('{n}', nm(g));

  /* ---- Vẽ ---- */
  function svg(g, k, cls='', opt){
    const s = sp(g), W = 120, L = opt || (typeof Play !== 'undefined' ? Play.look() : {}), wear = L.wear || {}, mood = L.mood || 'vui';
    const bg = wear.bg && typeof Play !== 'undefined' ? Play.bgSVG(wear.bg) : '';
    const egg = (crack) => `<ellipse class="pet-shadow" cx="60" cy="110" rx="30" ry="5"/>
      <g class="${crack?'pet-wobble':'pet-float'}"><path class="pet-egg" d="M60 18 C 86 18 96 58 96 76 C 96 98 80 108 60 108 C 40 108 24 98 24 76 C 24 58 34 18 60 18 Z"/>
      <circle class="pet-spot" cx="46" cy="52" r="7"/><circle class="pet-spot" cx="72" cy="42" r="5"/><circle class="pet-spot" cx="74" cy="80" r="8"/><circle class="pet-spot" cx="42" cy="88" r="4"/>
      ${crack?`<path class="pet-crack" d="M30 66 L40 58 L48 68 L57 57 L66 69 L75 58 L84 67 L90 62"/>
      <ellipse class="pet-eye" cx="50" cy="50" rx="3.5" ry="4.5"/><ellipse class="pet-eye" cx="68" cy="50" rx="3.5" ry="4.5"/>`:''}</g>`;
    if(k <= 1) return `<svg class="pet sp-${s} ${cls}" viewBox="0 0 ${W} ${W}" aria-label="${name(g,k)}" role="img">${bg}${egg(k===1)}</svg>`;
    const grown = k >= 3, r = grown ? 34 : 27, cx = 60, cy = grown ? 70 : 76;
    const P = (x,y) => `${(cx + x*r).toFixed(1)} ${(cy + y*r).toFixed(1)}`;
    let back = '', front = '';
    if(s === 'meo'){ front += `<path class="pet-body" d="M${P(-.85,-.45)} L${P(-.6,-1.2)} L${P(-.15,-.9)} Z"/><path class="pet-body" d="M${P(.85,-.45)} L${P(.6,-1.2)} L${P(.15,-.9)} Z"/>
        <path class="pet-belly" d="M${P(-.66,-.62)} L${P(-.57,-.98)} L${P(-.35,-.83)} Z"/><path class="pet-belly" d="M${P(.66,-.62)} L${P(.57,-.98)} L${P(.35,-.83)} Z"/>`;
      if(grown) back += `<path class="pet-tail" d="M${P(.8,.5)} C ${P(1.5,.5)} ${P(1.5,-.4)} ${P(1.15,-.55)}"/>`; }
    if(s === 'rong'){ front += `<path class="pet-horn" d="M${P(-.55,-.8)} L${P(-.45,-1.25)} L${P(-.25,-.92)} Z"/><path class="pet-horn" d="M${P(.55,-.8)} L${P(.45,-1.25)} L${P(.25,-.92)} Z"/>`;
      if(grown) back += `<path class="pet-wing" d="M${P(-.8,-.1)} L${P(-1.55,-.75)} L${P(-1.35,-.05)} L${P(-1.6,.25)} L${P(-.85,.35)} Z"/><path class="pet-wing" d="M${P(.8,-.1)} L${P(1.55,-.75)} L${P(1.35,-.05)} L${P(1.6,.25)} L${P(.85,.35)} Z"/>`; }
    if(s === 'cu'){ front += `<path class="pet-body" d="M${P(-.9,-.4)} L${P(-.75,-1.15)} L${P(-.3,-.9)} Z"/><path class="pet-body" d="M${P(.9,-.4)} L${P(.75,-1.15)} L${P(.3,-.9)} Z"/>`;
      if(grown) back += `<ellipse class="pet-wing" cx="${cx - r*.95}" cy="${cy + r*.2}" rx="${r*.32}" ry="${r*.6}"/><ellipse class="pet-wing" cx="${cx + r*.95}" cy="${cy + r*.2}" rx="${r*.32}" ry="${r*.6}"/>`; }
    if(s === 'tho'){ const L = grown ? 1.35 : .95;
      back += `<ellipse class="pet-body" cx="${cx - r*.4}" cy="${cy - r*(.55+L/2)}" rx="${r*.2}" ry="${r*L/2+4}" transform="rotate(-10 ${cx - r*.4} ${cy - r*.8})"/><ellipse class="pet-body" cx="${cx + r*.4}" cy="${cy - r*(.55+L/2)}" rx="${r*.2}" ry="${r*L/2+4}" transform="rotate(10 ${cx + r*.4} ${cy - r*.8})"/>
        <ellipse class="pet-belly" cx="${cx - r*.4}" cy="${cy - r*(.55+L/2)}" rx="${r*.09}" ry="${r*L/2-2}" transform="rotate(-10 ${cx - r*.4} ${cy - r*.8})"/><ellipse class="pet-belly" cx="${cx + r*.4}" cy="${cy - r*(.55+L/2)}" rx="${r*.09}" ry="${r*L/2-2}" transform="rotate(10 ${cx + r*.4} ${cy - r*.8})"/>`; }
    const face = s === 'cu'
      ? `<circle class="pet-belly" cx="${cx - r*.36}" cy="${cy - r*.12}" r="${r*.28}"/><circle class="pet-belly" cx="${cx + r*.36}" cy="${cy - r*.12}" r="${r*.28}"/><path class="pet-beak" d="M${P(-.1,.12)} L${P(.1,.12)} L${P(0,.32)} Z"/>`
      : mood === 'buon' ? `<path class="pet-mouth" d="M${P(-.14,.3)} Q ${P(0,.16)} ${P(.14,.3)}"/>`
      : `<path class="pet-mouth" d="M${P(-.14,.2)} Q ${P(-.07,.32)} ${P(0,.2)} Q ${P(.07,.32)} ${P(.14,.2)}"/>`;
    const tear = mood === 'buon' ? `<path class="pet-tear" d="M${P(.44,.02)} q ${r*.07} ${r*.14} 0 ${r*.2} q ${-r*.07} ${-r*.06} 0 ${-r*.2} Z"/>` : '';
    const acc = typeof Play !== 'undefined' ? Play.accSVG(wear, cx, cy, r) : '';
    const eyes = `<ellipse class="pet-eye" cx="${cx - r*.36}" cy="${cy - r*.12}" rx="${r*.12}" ry="${r*.15}"/><ellipse class="pet-eye" cx="${cx + r*.36}" cy="${cy - r*.12}" rx="${r*.12}" ry="${r*.15}"/>
      <circle class="pet-shine" cx="${cx - r*.32}" cy="${cy - r*.18}" r="${r*.045}"/><circle class="pet-shine" cx="${cx + r*.4}" cy="${cy - r*.18}" r="${r*.045}"/>
      <ellipse class="pet-cheek" cx="${cx - r*.62}" cy="${cy + r*.12}" rx="${r*.13}" ry="${r*.08}"/><ellipse class="pet-cheek" cx="${cx + r*.62}" cy="${cy + r*.12}" rx="${r*.13}" ry="${r*.08}"/>`;
    const body = `<ellipse class="pet-body" cx="${cx}" cy="${cy}" rx="${r}" ry="${r*.95}"/><ellipse class="pet-belly" cx="${cx}" cy="${cy + r*.42}" rx="${r*.5}" ry="${r*.38}"/>`;
    const feet = grown ? `<ellipse class="pet-body" cx="${cx - r*.45}" cy="${cy + r*.95}" rx="${r*.24}" ry="${r*.13}"/><ellipse class="pet-body" cx="${cx + r*.45}" cy="${cy + r*.95}" rx="${r*.24}" ry="${r*.13}"/>` : '';
    const shell = grown ? '' : `<path class="pet-egg" d="M26 90 L34 82 L42 90 L51 81 L60 90 L69 81 L78 90 L86 82 L94 90 C 94 104 80 110 60 110 C 40 110 26 104 26 90 Z"/>`;
    const crown = k === 4 && !wear.hat ? `<path class="pet-crown" d="M${P(-.42,-.82)} L${P(-.45,-1.3)} L${P(-.2,-1.06)} L${P(0,-1.42)} L${P(.2,-1.06)} L${P(.45,-1.3)} L${P(.42,-.82)} Z"/><circle class="pet-gem" cx="${cx}" cy="${cy - r*1.0}" r="${r*.07}"/>` : '';
    const spark = k === 4 ? `<path class="pet-spark" d="M16 30 l3 -8 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 Z"/><path class="pet-spark s2" d="M98 20 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 Z"/><path class="pet-spark s3" d="M104 86 l2 -5 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 Z"/>` : '';
    return `<svg class="pet sp-${s} ${cls}" viewBox="0 0 ${W} ${W}" aria-label="${name(g,k)}" role="img">${bg}<ellipse class="pet-shadow" cx="60" cy="112" rx="${grown?34:30}" ry="5"/>${spark}
      <g class="pet-float">${back}${body}${feet}${front}${eyes}${face}${tear}${crown}${acc}</g>${shell}</svg>`;
  }

  /* ---- Thẻ thú cưng trên trang khối lớp ---- */
  function card(g){
    const s = gradeStars(g), k = stage(g), t = thresholds(g), next = t[k+1];
    const pct = next ? Math.round((s - t[k]) / (next - t[k]) * 100) : 100;
    return `<section class="pet-card card" aria-label="Thú cưng của em">
      <div class="pet-stage">${svg(g, k, 'big')}</div>
      <div class="pet-info"><small>Thú cưng ${g.name} · Cấp ${k+1}/5</small><h2>${name(g,k)}</h2>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <p>${next ? `Em có <b>${s} ⭐</b>. Còn <b>${next - s} ⭐</b> nữa để tiến hoá!` : `Em có <b>${s} ⭐</b>. Thú cưng đã đạt cấp cao nhất! 👑`}</p>
        <div class="pet-steps">${[0,1,2,3,4].map(i => `<span class="${i<=k?'on':''}" title="${name(g,i)}">${svg(g, i, '', {mood:'vui'})}</span>`).join('')}</div>
      </div></section>`;
  }
  function bindCard(){ const c = $('.pet-card .pet-stage'); if(c) c.onclick = () => { c.classList.remove('boing'); void c.offsetWidth; c.classList.add('boing'); }; }

  /* ---- Tiến hoá ---- */
  function check(g){
    const k = stage(g), key = `hoctap:petseen:${g.id}`, seen = store.get(key);
    if(seen == null){ store.set(key, k); if(k === 0) return; }
    if(seen != null && k <= seen) return;
    store.set(key, k); show(g, seen == null ? Math.max(0, k-1) : seen, k);
  }
  function show(g, from, to){
    const old = document.getElementById('evolve'); if(old) old.remove();
    const el = document.createElement('div'); el.id = 'evolve'; el.className = 'evolve'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true');
    el.innerHTML = `<div class="evolve-card card"><div class="evolve-stage">${svg(g, from, 'big')}</div>
      <h2>Ơ kìa… có điều kì diệu!</h2><p class="lead">&nbsp;</p><button class="btn primary" data-close>Tuyệt vời!</button></div>`;
    document.body.appendChild(el);
    const st = el.querySelector('.evolve-stage'), h = el.querySelector('h2'), p = el.querySelector('p');
    st.classList.add('shake');
    setTimeout(() => { st.classList.remove('shake'); st.classList.add('flash');
      setTimeout(() => { st.innerHTML = svg(g, to, 'big'); st.classList.remove('flash'); st.classList.add('pop');
        h.textContent = `${name(g, to)}`; p.textContent = MSG[to].replace(/\{n\}/g, nm(g)); }, 350); }, 1100);
    const close = () => el.remove();
    el.querySelector('[data-close]').onclick = close; el.addEventListener('click', e => { if(e.target === el) close(); });
    el.querySelector('[data-close]').focus();
  }
  const summary = () => App.grades.map(g => `${g.name}: ${gradeStars(g)}⭐ – ${name(g, stage(g))}`).join(' | ');
  return { svg, card, bindCard, check, show, stage, name, summary, thresholds };
})();

</script>
<script>/* assets/js/play.js */
/* =====================================================================
   PLAY – "Nhà thú cưng": chăm sóc hằng ngày, cửa hàng phụ kiện, nhiệm vụ ngày,
   huy hiệu và bảng xếp hạng lớp. Nạp SAU account.js, TRƯỚC engine.js.
   - Làm đúng: +2 xu (đúng ngay lần đầu) / +1 xu (đúng lần hai). Xong một bộ: mỗi ⭐ = 1 hạt thức ăn.
   - Thú cưng đói (no) và buồn (vui) dần theo thời gian nếu em không học; KHÔNG bao giờ chết.
   - Trạng thái lưu trong store 'hoctap:play' (riêng từng học sinh) và đồng bộ lên Google Sheet.
   ===================================================================== */
const Play = (() => {
  const KEY = 'hoctap:play';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pad = n => String(n).padStart(2,'0');
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
  const dayNum = s => s ? Math.round(new Date(s + 'T12:00:00').getTime() / 864e5) : -1e9;
  const clamp = v => Math.max(0, Math.min(100, Math.round(v)));
  const uid = () => (typeof Account !== 'undefined' && Account.user) ? `${Account.user.lop}|${Account.user.user}` : '';
  const blankStats = () => ({correct:0, sets:0, three:0, run:0, bestRun:0, fed:0, played:0, bought:0});
  const blank = () => ({v:1, ts:0, xu:0, xuTotal:0, food:3, no:80, vui:80, t:Date.now(), lastPlay:0,
    streak:0, best:0, last:'', owned:[], wear:{}, q:{day:'', list:[]}, qDone:0, badges:{}, st:blankStats(), seen:{}});
  let S = null, who = null;

  /* ---------- Lưu / nạp ---------- */
  function st(){
    if(S && who === uid()) return S;
    who = uid(); const d = store.get(KEY) || {};
    S = Object.assign(blank(), d); S.st = Object.assign(blankStats(), d.st || {}); S.wear = S.wear || {};
    tick(); rollQuests(); return S;
  }
  function tick(){   // đói, buồn dần theo thời gian; chuỗi ngày bị ngắt nếu bỏ quá 1 ngày
    const now = Date.now(), days = Math.max(0, (now - (S.t || now)) / 864e5);
    S.no = clamp(S.no - 22*days); S.vui = clamp(S.vui - 28*days); S.t = now;
    if(S.last && dayNum(today()) - dayNum(S.last) > 1) S.streak = 0;
  }
  let syncT = null;
  function save(sync){
    S.ts = Date.now(); store.set(KEY, S);
    if(sync && typeof Account !== 'undefined' && Account.syncPlay){ clearTimeout(syncT); syncT = setTimeout(() => Account.syncPlay(snapshot()), 3000); }
  }
  function snapshot(){ st(); const pets = {}; App.grades.forEach(g => pets[g.id] = Pet.stage(g)); return JSON.stringify({...S, pets}); }
  function adopt(raw){   // nhận dữ liệu từ máy chủ khi đăng nhập (nếu mới hơn dữ liệu trên máy)
    S = null; if(!raw) return; let d; try{ d = typeof raw === 'string' ? JSON.parse(raw) : raw; }catch(e){ return; }
    const cur = store.get(KEY); if(cur && (cur.ts||0) >= (d.ts||0)) return;
    delete d.pets; store.set(KEY, d); S = null;
  }

  /* ---------- Thông báo nối tiếp ---------- */
  const Q = []; let busy = false;
  function note(m){ Q.push(m); if(!busy) nextNote(); }
  function nextNote(){ const m = Q.shift(); if(!m){ busy = false; return; } busy = true; try{ toast(m) }catch(e){} setTimeout(nextNote, 1700); }

  /* ---------- Nhiệm vụ ngày ---------- */
  const QUESTS = {
    bo1:   {text:'Hoàn thành 1 bộ câu hỏi', n:1, xu:10, food:1},
    bo3:   {text:'Hoàn thành 3 bộ câu hỏi', n:3, xu:25, food:2},
    dung10:{text:'Trả lời đúng 10 câu', n:10, xu:15, food:1},
    dung20:{text:'Trả lời đúng 20 câu', n:20, xu:25, food:1},
    lien5: {text:'Đúng liền 5 câu ngay lần đầu', n:5, xu:20, food:1},
    sao3:  {text:'Đạt ⭐⭐⭐ ở một bộ', n:1, xu:20, food:1},
    muc2:  {text:'Làm xong một bộ ở Mức 2 hoặc Mức 3', n:1, xu:15, food:1},
    moi:   {text:'Làm một bài em chưa làm bao giờ', n:1, xu:20, food:1},
    an:    {text:'Cho thú cưng ăn 1 lần', n:1, xu:5, food:0},
    choi:  {text:'Chơi với thú cưng 1 lần', n:1, xu:5, food:0},
  };
  function seeded(str){ let h = 2166136261; for(const c of str){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function rollQuests(){
    const d = today(); if(S.q.day === d) return;
    const rnd = seeded(d + uid()), pk = a => a.splice(Math.floor(rnd()*a.length), 1)[0];
    const setQ = ['bo1','bo1','bo3'], ansQ = ['dung10','dung20','lien5','sao3','muc2','moi'], care = ['an','choi'];
    S.q = {day:d, list:[pk(setQ), pk(ansQ), rnd() < .5 ? pk(care) : pk(ansQ)].map(id => ({id, p:0, done:false}))};
  }
  function quest(id, add = 1, setTo){
    for(const it of S.q.list){ if(it.id !== id || it.done) continue; const Qd = QUESTS[id];
      it.p = setTo != null ? Math.max(it.p, setTo) : it.p + add;
      if(it.p >= Qd.n){ it.p = Qd.n; it.done = true; S.qDone++; S.xu += Qd.xu; S.xuTotal += Qd.xu; S.food += Qd.food;
        note(`🎯 Xong nhiệm vụ: ${Qd.text}! +${Qd.xu} 🪙${Qd.food?` +${Qd.food} 🍖`:''}`); } }
  }

  /* ---------- Huy hiệu ---------- */
  const BADGES = [
    ['buoc-dau','🌱','Bước đầu tiên','Hoàn thành bộ câu hỏi đầu tiên', s => s.st.sets >= 1],
    ['ba-sao','⭐','Ba sao đầu tiên','Lần đầu đạt ⭐⭐⭐ một bộ', s => s.st.three >= 1],
    ['sieu-sao','🌟','Siêu sao','Đạt ⭐⭐⭐ ở 10 bộ', s => s.st.three >= 10],
    ['cham-chi','🔥','Chăm chỉ','Học 3 ngày liên tiếp', s => s.best >= 3],
    ['ben-bi','💪','Bền bỉ','Học 7 ngày liên tiếp', s => s.best >= 7],
    ['kien-tri','🏆','Kiên trì','Học 30 ngày liên tiếp', s => s.best >= 30],
    ['tram-cau','💯','Trăm câu đúng','Trả lời đúng 100 câu', s => s.st.correct >= 100],
    ['nghin-cau','🧠','Bộ óc vàng','Trả lời đúng 500 câu', s => s.st.correct >= 500],
    ['lien-tay','⚡','Nhanh tay chắc chắn','Đúng liền 10 câu ngay lần đầu', s => s.st.bestRun >= 10],
    ['dau-bep','🍖','Người nuôi tận tâm','Cho thú cưng ăn 20 lần', s => s.st.fed >= 20],
    ['ban-than','🎾','Bạn thân','Chơi với thú cưng 20 lần', s => s.st.played >= 20],
    ['thoi-trang','🎀','Nhà tạo mẫu','Mua 3 món phụ kiện', s => s.st.bought >= 3],
    ['nhiem-vu','🎯','Hoàn thành nhiệm vụ','Xong 10 nhiệm vụ ngày', s => s.qDone >= 10],
    ['vuong-mien','👑','Vương miện','Thú cưng một khối đạt cấp 5', () => App.grades.some(g => Pet.stage(g) === 4)],
  ];
  function checkBadges(){
    for(const [id, ic, nm, , ok] of BADGES) if(!S.badges[id] && ok(S)){ S.badges[id] = today(); S.xu += 10; S.xuTotal += 10; note(`🏅 Huy hiệu mới: ${ic} ${nm}! +10 🪙`); }
  }

  /* ---------- Phụ kiện (vẽ SVG, màu lấy từ biến CSS acc-*) ---------- */
  const ITEMS = [
    {id:'mu-tiec',   slot:'hat',  name:'Mũ sinh nhật', price:30},
    {id:'mu-len',    slot:'hat',  name:'Mũ len ấm áp', price:40},
    {id:'no-hoa',    slot:'hat',  name:'Bông hoa xinh', price:25},
    {id:'mu-tn',     slot:'hat',  name:'Mũ tốt nghiệp', price:80},
    {id:'kinh-tron', slot:'eye',  name:'Kính tròn thông thái', price:35},
    {id:'kinh-ram',  slot:'eye',  name:'Kính râm sành điệu', price:45},
    {id:'kinh-tim',  slot:'eye',  name:'Kính trái tim', price:50},
    {id:'no-co',     slot:'neck', name:'Nơ đỏ', price:20},
    {id:'khan',      slot:'neck', name:'Khăn quàng xanh', price:30},
    {id:'huy-chuong',slot:'neck', name:'Huy chương vàng', price:70},
    {id:'nen-vuon',  slot:'bg',   name:'Khu vườn', price:50},
    {id:'nen-bien',  slot:'bg',   name:'Bãi biển', price:60},
    {id:'nen-dem',   slot:'bg',   name:'Bầu trời đêm', price:70},
    {id:'nen-lop',   slot:'bg',   name:'Lớp học', price:60},
  ];
  const SLOT = {hat:'Mũ & hoa', eye:'Kính', neck:'Nơ & khăn', bg:'Phòng / nền'};
  function bgSVG(id){
    const box = inner => `<g class="acc-bg"><clipPath id="clip-${id}"><rect x="2" y="2" width="116" height="116" rx="18"/></clipPath><g clip-path="url(#clip-${id})">${inner}</g></g>`;
    if(id === 'nen-vuon') return box(`<rect class="acc-sky" width="120" height="120"/><circle class="acc-yellow" cx="96" cy="24" r="11"/><ellipse class="acc-grass" cx="30" cy="118" rx="60" ry="26"/><ellipse class="acc-grass2" cx="100" cy="122" rx="55" ry="24"/><circle class="acc-pink" cx="18" cy="100" r="4"/><circle class="acc-yellow" cx="104" cy="104" r="3.5"/>`);
    if(id === 'nen-bien') return box(`<rect class="acc-sky" width="120" height="120"/><rect class="acc-sea" y="70" width="120" height="30"/><path class="acc-foam" d="M0 72 q10 -6 20 0 t20 0 t20 0 t20 0 t20 0 t20 0"/><rect class="acc-sand" y="98" width="120" height="22"/><circle class="acc-yellow" cx="22" cy="24" r="10"/>`);
    if(id === 'nen-dem') return box(`<rect class="acc-night" width="120" height="120"/><circle class="acc-moon" cx="94" cy="24" r="10"/><circle class="acc-night" cx="99" cy="20" r="9"/>${[[16,18],[40,10],[64,26],[22,50],[108,54],[80,44]].map(([x,y]) => `<path class="acc-yellow" d="M${x} ${y-4} l1.2 3 3 1.2 -3 1.2 -1.2 3 -1.2 -3 -3 -1.2 3 -1.2 Z"/>`).join('')}<rect class="acc-grass-dark" y="104" width="120" height="16"/>`);
    if(id === 'nen-lop') return box(`<rect class="acc-wall" width="120" height="120"/><rect class="acc-board" x="14" y="10" width="92" height="44" rx="4"/><text class="acc-chalk" x="60" y="40" text-anchor="middle" font-size="15" font-family="var(--f-head)">1 + 1 = 2</text><rect class="acc-wood" y="104" width="120" height="16"/>`);
    return '';
  }
  function accSVG(w, cx, cy, r){
    const top = cy - r*.95, P = (x,y) => `${(cx + x*r).toFixed(1)} ${(cy + y*r).toFixed(1)}`; let s = '';
    const ey = cy - r*.12, ex = r*.36;
